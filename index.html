/* 打卡/图鉴/时间轴列表卡片：真实 frosted glass 毛玻璃——#f5e6e0 半透明雾面、背景柔和模糊、细白高光描边、玻璃厚度内高光、折射光斑、轻阴影悬浮 */
.hlistitem,.hcard,.invhubrow,.goal,.cal{
  position:relative;
  background:
    radial-gradient(120% 90% at 12% 0%, rgba(255,255,255,.30), rgba(255,255,255,0) 42%),
    radial-gradient(80% 60% at 88% 8%, rgba(255,255,255,.14), rgba(255,255,255,0) 55%),
    linear-gradient(155deg, rgba(255,255,255,.11) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 72%, rgba(255,255,255,.06) 100%),
    linear-gradient(135deg, rgba(255,255,255,.30), rgba(190,172,136,.32) 45%, rgba(190,172,136,.24))!important;
  backdrop-filter:blur(18px) saturate(1.6) brightness(1.04)!important;
  -webkit-backdrop-filter:blur(18px) saturate(1.6) brightness(1.04)!important;
  border:1px solid rgba(255,255,255,.85)!important;
  border-radius:20px!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -1px 1px rgba(255,255,255,.22),
    inset 1px 0 1px rgba(255,255,255,.16),
    0 10px 26px rgba(74,63,53,.13),
    0 3px 8px rgba(74,63,53,.06)!important;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:var(--ink)}
.hand{font-family:'Kaiti SC','STKaiti','KaiTi','DFKai-SB','楷体','Noto Serif SC',serif}

/* ===== S2 通用组件 ===== */
.topbar{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.topbar h1{font-size:22px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar.stack{display:block}
.topbar.stack h1{flex:none;overflow:visible;text-overflow:clip;white-space:normal;line-height:1.4}
.tb-tools{display:flex;align-items:center;gap:8px;margin-top:8px}
.tb-tools .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--shadow);font-size:16px;flex:none}
.iconbtn:active{transform:scale(.94)}
.iconbtn.plain{background:none;box-shadow:none;width:auto;min-width:38px}
.spec-top{display:flex;gap:6px;align-items:center;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px}
.btn.primary{background:var(--coffee);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.input,.textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--rs);padding:9px 12px;background:#fff;outline:none}
.input:focus,.textarea:focus{border-color:var(--coffee)}
.textarea{resize:vertical;min-height:84px;line-height:1.7}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px}
.mask{position:fixed;inset:0;background:rgba(74,63,53,.38);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;animation:fade .15s;overflow-y:auto}
.sheet{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow2);padding:20px;width:100%;max-width:360px;margin:auto}
.sheet h3{margin:0 0 14px;font-size:17px}
.sheet .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
@keyframes fade{from{opacity:0}}
#toast-root{position:fixed;left:0;right:0;bottom:40px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none}
.toast{background:rgba(74,63,53,.92);color:#fff;padding:8px 16px;border-radius:999px;font-size:13.5px;animation:tin .2s;max-width:86vw}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.empty{color:var(--ink2);text-align:center;padding:30px 10px;font-size:14px}
.saved{font-size:12px;color:var(--ok);opacity:0;transition:opacity .3s;margin-left:8px;flex:none}
.saved.show{opacity:1}
.listitem{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;width:100%;text-align:left}
.listitem .li-main{flex:1;min-width:0}
.listitem .li-title{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listitem .li-sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.seg{display:inline-flex;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:999px;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--coffee);color:#fff}
.fab{position:fixed;right:20px;bottom:26px;width:54px;height:54px;border-radius:50%;background:var(--coffee);color:#fff;font-size:26px;box-shadow:var(--shadow2);display:flex;align-items:center;justify-content:center;z-index:20}
.fab:active{transform:scale(.94)}
/* ===== 时间轴（反思集/工资条） ===== */
.tl-list{display:flex;flex-direction:column;gap:12px;padding:4px 16px 96px}
.tl-item{display:flex;gap:10px;cursor:pointer}
.tl-time{width:80px;flex:none;font-size:11.5px;color:var(--ink2);text-align:right;line-height:1.45;padding-top:1px}
.tl-time b{display:block;font-size:13.5px;color:var(--ink);font-weight:600}
.tl-mid{width:14px;flex:none;position:relative}
.tl-mid::before{content:'';position:absolute;left:6px;top:0;bottom:-12px;width:2px;background:var(--line)}
.tl-item:last-child .tl-mid::before{bottom:auto;height:16px}
.tl-dot{position:absolute;left:3px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--coffee)}
.tl-body{flex:1;min-width:0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 12px;font-size:14px;line-height:1.6;word-break:break-word}
.tl-body .tl-fee{color:var(--bean);font-weight:700;font-size:15px}
.tl-stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:4px 16px 14px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.tl-stat .lab{font-size:12.5px;color:var(--ink2)}
.tl-stat .val{font-size:22px;font-weight:800;color:var(--bean)}

/* ===== S3 页面样式 ===== */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:8px 16px 26px}
.hcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 12px;border-top:4px solid var(--c,var(--coffee));text-align:left;width:100%;cursor:pointer}
.hcard:active{transform:scale(.98)}
.hcard .nm{font-size:19px}
.hcard .st{font-size:12.5px;color:var(--ink2);margin-top:6px}
.hcard .st.ok{color:var(--ok)}
.hcard.manage{touch-action:none;cursor:grab}
.hcard .ops{display:none;gap:6px;margin-top:10px}
.hcard.manage .ops{display:flex}
.hcard .ops button{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--bg);box-shadow:var(--shadow)}

<body>
<div id="view"></div>
<div id="modal-root"></div>
<div id="viewer-root"></div>
<div id="banner-root"></div>
<div id="toast-root"></div>
<input type="file" id="file-input" accept="image/*" multiple hidden>

<script>
'use strict';
/* ===== J1 工具层 ===== */
const $=(s,r=document)=>r.querySelector(s);
function h(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}
function bindSwipeRight(box,cb){ // 右滑切换：手机用 touch 事件（pointer 会被滚动 pointercancel 掉），鼠标用 pointer 事件
  let tx=null,ty=0,mx=0,my=0;
  box.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    if(document.querySelector('#modal-root .mask'))return;
    tx=e.touches[0].clientX;ty=e.touches[0].clientY;
  },{passive:true});
  box.addEventListener('touchend',e=>{
    if(tx===null)return;
    const t=(e.changedTouches&&e.changedTouches[0])||null;const sx0=tx;tx=null;
    if(!t||document.querySelector('#modal-root .mask'))return;
    if(t.clientX-sx0>60&&Math.abs(t.clientY-ty)<40&&Math.abs(t.clientX-sx0)<200)cb();
  },{passive:true});
  box.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch'||e.pointerType==='pen')return;
    if(document.querySelector('#modal-root .mask'))return;
    mx=e.clientX;my=e.clientY;
  });
  box.addEventListener('pointerup',e=>{
    if(e.pointerType==='touch'||e.pointerType==='pen')return;
    if(document.querySelector('#modal-root .mask'))return;
    if(e.clientX-mx>60&&Math.abs(e.clientY-my)<40&&Math.abs(e.clientX-mx)<200)cb();
  });
}
function esc(s){return String(s!=null?s:'');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
const pad2=n=>String(n).padStart(2,'0');
function dkey(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
const todayKey=()=>dkey(new Date());
function addDays(key,n){const[y,m,d]=key.split('-').map(Number);return dkey(new Date(y,m-1,d+n));}
function cnDay(key){const[y,m,d]=key.split('-').map(Number);return m+'月'+d+'日';}
function weekStart(key){const[y,m,d]=key.split('-').map(Number);const w=(new Date(y,m-1,d).getDay()+6)%7;return addDays(key,-w);}
function nowHM(){const d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function debounce(fn,ms){let t=null,last=null;const f=(...a)=>{last=a;clearTimeout(t);t=setTimeout(()=>{t=null;fn(...last);},ms);};f.flush=()=>{if(t&&last){clearTimeout(t);t=null;fn(...last);}};return f;}
const flushers=[];
window.addEventListener('pagehide',()=>flushers.forEach(f=>{try{f();}catch(e){}}));
function bindAutosave(el,saveFn,statusEl,ms=1000){
  const d=debounce(async()=>{await saveFn(el.value);if(statusEl){statusEl.classList.add('show');setTimeout(()=>statusEl.classList.remove('show'),1500);}},ms);
  el.addEventListener('input',d);
  flushers.push(()=>d.flush());
}
function toast(msg){const t=h('<div class="toast"></div>');t.textContent=msg;$('#toast-root').appendChild(t);setTimeout(()=>t.remove(),2400);}
function modal(sheet){const m=h('<div class="mask"></div>');m.appendChild(sheet);$('#modal-root').appendChild(m);return m;}
function closeModal(m){if(m)m.remove();}
function confirmBox(msg,{danger=false,okText='确定'}={}){
  return new Promise(res=>{
    const s=h('<div class="sheet"><h3></h3><div class="row"><button class="btn" data-x="no">取消</button><button class="btn '+(danger?'danger':'primary')+'" data-x="ok">'+esc(okText)+'</button></div></div>');
    s.querySelector('h3').textContent=msg;
    s.querySelector('[data-x=no]').onclick=()=>{closeModal(s.closest('.mask'));res(false);};
    s.querySelector('[data-x=ok]').onclick=()=>{closeModal(s.closest('.mask'));res(true);};
    modal(s);
  });
}
function promptBox(title,val='',{multiline=false,placeholder=''}={}){
  return new Promise(res=>{
    const s=h('<div class="sheet"><h3>'+esc(title)+'</h3>'+(multiline?'<textarea class="textarea"></textarea>':'<input class="input">')+'<div class="row"><button class="btn" data-x="no">取消</button><button class="btn primary" data-x="ok">保存</button></div></div>');
    const inp=s.querySelector(multiline?'textarea':'input');
    if(placeholder)inp.placeholder=placeholder;
    inp.value=val;
    const done=v=>{closeModal(s.closest('.mask'));res(v);};
    s.querySelector('[data-x=no]').onclick=()=>done(null);
    s.querySelector('[data-x=ok]').onclick=()=>done(inp.value.trim()||null);
    modal(s);inp.focus();
  });
}
function computeStreak(dateSet){
  let d=todayKey();
  if(!dateSet.has(d))d=addDays(d,-1);
  let n=0;
  while(dateSet.has(d)){n++;d=addDays(d,-1);}
  return n;
}
window.addEventListener('error',e=>toast('出错了：'+e.message));
window.addEventListener('unhandledrejection',e=>toast('出错了：'+((e.reason&&e.reason.message)||e.reason)));

/* ===== J2 存储层 ===== */
const DB=(()=>{
  const NAME='journal-db';
  const DEFS={
    items:[{n:'order'}],
    records:[{n:'itemId'},{n:'date'},{n:['itemId','date'],as:'item_date'},{n:['itemId','updatedAt'],as:'item_updated'}],
    entries:[{n:'bucket'},{n:'createdAt'}],
    meals:[{n:'date'},{n:['date','slot'],as:'date_slot'}],
    exercises:[{n:'date'}],
    bodyMetrics:[{n:'date'}],
    books:[],
    skills:[{n:'category'}],
    inventory:[{n:'itemId'},{n:'createdAt'}],
    groceries:[{n:'date'}],
    fridge:[{n:'itemId'}],
    images:[],
    settings:[],
    outbox:[],
  };
  // 数据库版本升级：已有库缺 store 时补建
  let dbp=null;
  function open(){
    if(dbp)return dbp;
    dbp=new Promise((res,rej)=>{
      function buildStores(db){
        for(const[name,idxs]of Object.entries(DEFS)){
          if(db.objectStoreNames.contains(name))continue;
          const st=db.createObjectStore(name,{keyPath:name==='settings'?'key':'id'});
          idxs.forEach(ix=>{
            const nm=ix.as||(Array.isArray(ix.n)?ix.n.join('_'):ix.n);
            st.createIndex(nm,ix.n,{unique:false});
          });
        }
      }
      // 先不带版本号打开（自动取当前版本），避免硬编码版本低于实际版本触发 VersionError
      const rq=indexedDB.open(NAME);
      rq.onupgradeneeded=e=>{buildStores(e.target.result);}; // 全新库：一次性建齐
      rq.onsuccess=()=>{
        const db=rq.result;
        // 检查是否所有 store 都存在，缺则升版本补建
        let missing=false;
        for(const name of Object.keys(DEFS))if(!db.objectStoreNames.contains(name)){missing=true;break;}
        if(missing){
          const v=db.version+1;
          db.close();
          const rq2=indexedDB.open(NAME,v);
          rq2.onupgradeneeded=e=>{buildStores(e.target.result);};
          rq2.onsuccess=()=>res(rq2.result);
          rq2.onerror=()=>rej(rq2.error);
          rq2.onblocked=()=>rej(new Error('数据库升级被其他标签页阻塞'));
        }else res(db);
      };
      rq.onerror=()=>rej(rq.error);
    });
    return dbp;
  }
  function req2p(rq){return new Promise((res,rej)=>{rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
  async function _st(name,mode){const db=await open();return db.transaction(name,mode).objectStore(name);}
  async function putRaw(name,val){return req2p((await _st(name,'readwrite')).put(val));}
  async function delRaw(name,key){return req2p((await _st(name,'readwrite')).delete(key));}
  async function put(name,val){
    if(val&&typeof val==='object'&&!val.updatedAt)val.updatedAt=Date.now();
    const r=await putRaw(name,val);
    try{await Cloud.enqueue(name,val);}catch(e){}
    return r;
  }
  async function get(name,key){return req2p((await _st(name,'readonly')).get(key));}
  async function del(name,key){
    const r=await delRaw(name,key);
    try{await Cloud.enqueue(name,null,key);}catch(e){}
    return r;
  }
  async function all(name){return req2p((await _st(name,'readonly')).getAll());}
  async function byIndex(name,idx,query){return req2p((await _st(name,'readonly')).index(idx).getAll(query));}
  async function count(name){return req2p((await _st(name,'readonly')).count());}
  async function clear(name){return req2p((await _st(name,'readwrite')).clear());}
  async function bulkPut(name,vals){
    const db=await open();
    return new Promise((res,rej)=>{
      const t=db.transaction(name,'readwrite');
      vals.forEach(v=>t.objectStore(name).put(v));
      t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);
    });
  }
  async function clearAll(){for(const n of Object.keys(DEFS))await clear(n);}
  async function getSetting(k,dflt){const v=await get('settings',k);return v===undefined?dflt:v.value;}
  async function setSetting(k,value){return put('settings',{key:k,value});}
  return {open,put,get,del,putRaw,delRaw,all,byIndex,count,clear,bulkPut,clearAll,getSetting,setSetting};
})();

/* ===== 云同步层（双后端：Cloudflare Worker / GitHub 私有仓库；离线仍是事实源）===== */
const Cloud=(()=>{
  const LS_CFG='cloud_config';
  const SYNC_EVERY=300000; // 后台同步间隔 5 分钟
  const STORES=['items','records','entries','meals','exercises','bodyMetrics','books','skills','inventory','groceries','fridge','images','settings'];
  const keyOf=(store,val)=>val[store==='settings'?'key':'id'];
  let flushing=false,lastPullOk=0,lastErr='',pulling=false,exitBound=false;

  /* ---- 配置：{mode:'gh',token,repo} 或 {mode:'worker',base} ---- */
  function config(){
    try{
      const v=JSON.parse(localStorage.getItem(LS_CFG)||'null');
      if(v&&(v.mode==='gh'||v.mode==='worker'))return v;
    }catch(e){}
    const legacy=localStorage.getItem('cloud_base')||'';
    if(legacy){const c={mode:'worker',base:legacy};localStorage.setItem(LS_CFG,JSON.stringify(c));return c;}
    // 从秘密路径自动识别：形如 /<20位以上随机串>（Worker 部署场景）
    const p=location.pathname.replace(/\/+$/,'');
    if(p&&/^\/[A-Za-z0-9_-]{20,}$/.test(p)){
      const c={mode:'worker',base:location.origin+p};
      localStorage.setItem(LS_CFG,JSON.stringify(c));
      return c;
    }
    return null;
  }
  function setCfg(c){
    if(c)localStorage.setItem(LS_CFG,JSON.stringify(c));
    else localStorage.removeItem(LS_CFG);
    localStorage.removeItem('cloud_base');
  }
  function enabled(){return !!config();}
  function base(){const c=config();return c&&c.mode==='worker'?c.base:'';}
  async function status(){
    if(!enabled())return {enabled:false};
    const c=config();
    return {enabled:true,mode:c.mode,base:c.mode==='worker'?c.base:'',repo:c.mode==='gh'?c.repo:'',
      lastPull:lastPullOk,lastErr,pending:(await DB.count('outbox'))};
  }

  /* ---- Blob <-> base64 ---- */
  async function blobToB64(blob){
    const u=new Uint8Array(await blob.arrayBuffer());
    let s='';const CH=0x8000;
    for(let i=0;i<u.length;i+=CH)s+=String.fromCharCode.apply(null,u.subarray(i,Math.min(i+CH,u.length)));
    return btoa(s);
  }
  async function b64ToBlob(b64){
    const s=atob(b64);const u=new Uint8Array(s.length);
    for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);
    return new Blob([u]);
  }
  // 出站序列化：images 的 Blob 转 base64
  async function serialize(store,val){
    if(val==null)return null;
    if(store==='images'&&val.blob instanceof Blob){
      return {__img:true,id:val.id,createdAt:val.createdAt,updatedAt:val.updatedAt,b64:await blobToB64(val.blob)};
    }
    return JSON.parse(JSON.stringify(val));
  }
  async function deserialize(store,v){
    if(v&&v.__img)return {id:v.id,createdAt:v.createdAt,updatedAt:v.updatedAt,blob:await b64ToBlob(v.b64)};
    return v;
  }

  /* ---- 后端：GitHub 私有仓库（每条记录一个文件 data/<store>/<id>.json）---- */
  const Gh=(()=>{
    function root(c){return (c.api||'https://api.github.com').replace(/\/+$/,'');}
    function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
    function b64d(s){return decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))));}
    async function req(c,method,path,body){
      const r=await fetch(root(c)+path,{method,
        headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
        body:body===undefined?undefined:JSON.stringify(body)});
      if(r.status===404||r.status===204)return null;
      if(!r.ok){
        let msg='GitHub '+r.status;
        try{const j=await r.json();if(j&&j.message)msg+=' · '+j.message;}catch(e){}
        const err=new Error(msg);err.status=r.status;throw err;
      }
      return r.json();
    }
    function fpath(store,id){return 'data/'+encodeURIComponent(store)+'/'+encodeURIComponent(id)+'.json';}
    function parsePath(p){const m=p.match(/^data\/([^/]+)\/(.+)\.json$/);return m?{store:decodeURIComponent(m[1]),id:decodeURIComponent(m[2])}:null;}
    async function push(c,items){
      const shas=(await DB.getSetting('gh_shacache',null))||{};
      let n=0;
      for(const it of items){
        if(it.s==='outbox')continue;
        const p=fpath(it.s,it.id);
        if(it.v==null){ // 墓碑 → 删除远端文件
          let sha=shas[p];
          if(!sha){
            const f=await req(c,'GET','/repos/'+c.repo+'/contents/'+p+'?ref=main');
            sha=f&&f.sha;
          }
          if(sha){
            try{await req(c,'DELETE','/repos/'+c.repo+'/contents/'+p,{message:'sync',sha:sha,branch:'main'});}
            catch(e){
              if(e.status===409||e.status===422){ // sha 过期：刷新后重试一次
                const f=await req(c,'GET','/repos/'+c.repo+'/contents/'+p+'?ref=main');
                if(f&&f.sha)await req(c,'DELETE','/repos/'+c.repo+'/contents/'+p,{message:'sync',sha:f.sha,branch:'main'});
              }else throw e;
            }
          }
          delete shas[p];n++;
          continue;
        }
        const body={message:'sync',content:b64e(JSON.stringify(it.v)),branch:'main'};
        if(shas[p])body.sha=shas[p];
        let r;
        try{r=await req(c,'PUT','/repos/'+c.repo+'/contents/'+p,body);}
        catch(e){
          if(e.status===409||e.status===422){ // sha 过期：刷新后重试一次
            const f=await req(c,'GET','/repos/'+c.repo+'/contents/'+p+'?ref=main');
            if(f&&f.sha){shas[p]=f.sha;body.sha=f.sha;r=await req(c,'PUT','/repos/'+c.repo+'/contents/'+p,body);}
            else throw e;
          }else throw e;
        }
        if(r&&r.content&&r.content.sha)shas[p]=r.content.sha;
        n++;
      }
      await DB.putRaw('settings',{key:'gh_shacache',value:shas});
      return n;
    }
    async function pull(c){
      const cm=await req(c,'GET','/repos/'+c.repo+'/commits/main?per_page=1');
      if(!cm||!cm.sha)return {applied:0,deleted:0};
      const tr=await req(c,'GET','/repos/'+c.repo+'/git/trees/'+cm.sha+'?recursive=1');
      if(!tr||!Array.isArray(tr.tree))return {applied:0,deleted:0};
      const remote={};
      for(const t of tr.tree){
        if(t.type==='blob'&&t.path.indexOf('data/')===0)remote[t.path]=t.sha;
      }
      const shas=(await DB.getSetting('gh_shacache',null))||{};
      let applied=0,deleted=0;
      for(const p of Object.keys(remote)){
        if(shas[p]===remote[p]){
          // 内容未变：仅当本地仍存在该记录时才可跳过（否则新设备/清库后拉不回数据）
          const pp=parsePath(p);
          if(pp&&STORES.indexOf(pp.store)>=0){
            const loc=await DB.get(pp.store,pp.id);
            if(loc)continue;
          }
        }
        const f=await req(c,'GET','/repos/'+c.repo+'/git/blobs/'+remote[p]); // blobs API 无 1MB 大小限制
        shas[p]=remote[p];
        if(!f||!f.content)continue;
        const pp=parsePath(p);if(!pp||STORES.indexOf(pp.store)<0)continue;
        let v;
        try{v=JSON.parse(b64d(f.content));}catch(e){continue;}
        const local=await DB.get(pp.store,pp.id);
        const localTs=(local&&local.updatedAt)||0;
        if((v.updatedAt||0)>=localTs){await DB.putRaw(pp.store,await deserialize(pp.store,v));applied++;}
      }
      for(const p of Object.keys(shas)){ // 缓存有但远端已删 → 本地删除
        if(remote[p])continue;
        const pp=parsePath(p);
        if(pp&&STORES.indexOf(pp.store)>=0){
          if(pp.store==='items'){ // 固定模块不允许被同步误删（云端仓库重置时保护本地数据）
            const loc=await DB.get('items',pp.id);
            if(loc&&loc.builtin){delete shas[p];continue;}
          }
          await DB.delRaw(pp.store,pp.id);deleted++;
        }
        delete shas[p];
      }
      await DB.putRaw('settings',{key:'gh_shacache',value:shas});
      return {applied,deleted};
    }
    return {push,pull};
  })();

  /* ---- 出站推送：按后端分发（同步内部状态不上传）---- */
  async function apiPush(items){
    items=(items||[]).filter(it=>!(it.s==='settings'&&/^(gh_|cloud_)/.test(String(it.id))));
    if(!items.length)return 0;
    const c=config();
    if(c.mode==='gh')return Gh.push(c,items);
    for(let i=0;i<items.length;i+=40){
      const r=await fetch(c.base+'/api/push',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:items.slice(i,i+40)})});
      if(!r.ok)throw new Error('push HTTP '+r.status);
    }
    return items.length;
  }

  /* ---- 出站队列：本地写操作进入 outbox，后台批量推送 ---- */
  async function enqueue(store,val,deletedKey){
    if(!enabled())return;
    const rec={id:uid(),store,ts:Date.now()};
    if(deletedKey!==undefined){rec.del=true;rec.key=deletedKey;rec.value=null;}
    else{rec.key=keyOf(store,val);rec.value=await serialize(store,val);}
    await DB.putRaw('outbox',rec);
    scheduleFlush();
  }
  const scheduleFlush=debounce(()=>{flushOutbox();},3000);
  async function flushOutbox(){
    if(!enabled()||flushing)return;
    flushing=true;
    try{
      const items=await DB.all('outbox');
      if(items.length){
        const payload=items.map(o=>({s:o.store,id:o.key,v:o.value,ts:o.ts}));
        await apiPush(payload);
        for(const o of items)await DB.delRaw('outbox',o.id);
      }
      lastErr='';
    }catch(e){lastErr=String(e&&e.message||e);}
    finally{flushing=false;}
  }

  /* ---- 入站合并：按 updatedAt 最新胜出（LWW），远端缺失视为删除 ---- */
  async function pull(since){
    if(!enabled())return null;
    if(pulling)return {applied:0,deleted:0,skip:true};
    pulling=true;
    try{
      const c=config();
      let res;
      if(c.mode==='gh'){
        res=await Gh.pull(c);
      }else{
        if(since===undefined)since=await DB.getSetting('cloud_last_pull',0);
        const r=await fetch(c.base+'/api/pull?since='+encodeURIComponent(since));
        if(!r.ok)throw new Error('pull HTTP '+r.status);
        const data=await r.json();
        res={applied:0,deleted:0,serverTime:data.serverTime};
        for(const ch of (data.changes||[])){
          if(ch.s==='outbox')continue;
          const local=await DB.get(ch.s,ch.id);
          const localTs=(local&&local.updatedAt)||0;
          if((ch.ts||0)<localTs)continue; // 本地更新，跳过
          if(ch.v==null){await DB.delRaw(ch.s,ch.id);res.deleted++;}
          else{await DB.putRaw(ch.s,await deserialize(ch.s,ch.v));res.applied++;}
        }
        await DB.putRaw('settings',{key:'cloud_last_pull',value:(data.serverTime||Date.now())});
      }
      lastPullOk=Date.now();lastErr='';
      try{await ensureBuiltin();}catch(e){} // 拉取后自愈固定模块
      return res;
    }catch(e){lastErr=String(e&&e.message||e);throw e;}
    finally{pulling=false;}
  }

  /* ---- 一次性迁移：把本地全部数据推上云端（保留本地不动）---- */
  async function fullUpload(){
    if(!enabled())throw new Error('未配置云同步');
    const now=Date.now();const payload=[];
    for(const s of STORES){
      const rows=await DB.all(s);
      for(const v of rows){
        if(!v.updatedAt)v.updatedAt=now;
        await DB.putRaw(s,v);
        payload.push({s,id:keyOf(s,v),v:await serialize(s,v),ts:v.updatedAt});
      }
    }
    await apiPush(payload);
    return {count:payload.length};
  }

  function init(){
    if(!enabled())return;
    if('serviceWorker' in navigator){
      try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
    }
    // 动态注入 PWA 所需的 manifest / 主题色（本地版无这些文件也不受影响）
    try{
      const mf=document.createElement('link');
      mf.rel='manifest';mf.href='manifest.webmanifest';
      document.head.appendChild(mf);
      const th=document.createElement('meta');
      th.name='theme-color';th.content='#FAF6EF';
      document.head.appendChild(th);
    }catch(e){}
    setTimeout(async()=>{
      try{await pull();await flushOutbox();}catch(e){}
    },1500);
    setInterval(async()=>{
      if(flushing||pulling)return;
      try{await pull();await flushOutbox();}catch(e){}
    },SYNC_EVERY);
    // 退出前自动保存：页面隐藏或关闭时立即推送待同步数据（尽力而为，只注册一次）
    if(!exitBound){
      exitBound=true;
      const exitFlush=()=>{try{flushOutbox();}catch(e){}};
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')exitFlush();});
      window.addEventListener('pagehide',exitFlush);
    }
  }

  return {config,setCfg,base,enabled,status,enqueue,flushOutbox,pull,fullUpload,init,blobToB64,b64ToBlob};
})();

/* ===== J3 图片层 ===== */
const Img=(()=>{
  const urlCache=new Map();
  function pickFiles(){
    return new Promise(res=>{
      const inp=$('#file-input');
      inp.value='';
      inp.onchange=()=>res([...inp.files]);
      inp.click();
    });
  }
  async function compress(file){
    const dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(file);});
    const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=dataUrl;});
    const MAX=1280;
    let w=img.width,ht=img.height;
    if(Math.max(w,ht)>MAX){const k=MAX/Math.max(w,ht);w=Math.round(w*k);ht=Math.round(ht*k);}
    const cv=document.createElement('canvas');cv.width=w;cv.height=ht;
    cv.getContext('2d').drawImage(img,0,0,w,ht);
    const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',.85));
    return blob;
  }
  async function store(blob){
    const id=uid();
    await DB.put('images',{id,blob,createdAt:Date.now()});
    urlCache.set(id,URL.createObjectURL(blob));
    return id;
  }
  async function url(id){
    if(!id)return '';
    if(!urlCache.has(id)){
      const rec=await DB.get('images',id);
      if(!rec)return '';
      urlCache.set(id,URL.createObjectURL(rec.blob));
    }
    return urlCache.get(id);
  }
  async function attach(imgEl,id){const u=await url(id);if(u)imgEl.src=u;}
  function viewer(ids,idx){
    let i=idx;
    const v=h('<div class="viewer"><img alt=""><div class="vbar"><button data-v="prev">‹</button><button data-v="close" class="close">关闭</button><button data-v="next">›</button></div></div>');
    const img=v.querySelector('img');
    const show=()=>attach(img,ids[i]);
    show();
    v.querySelector('[data-v=prev]').onclick=()=>{i=(i-1+ids.length)%ids.length;show();};
    v.querySelector('[data-v=next]').onclick=()=>{i=(i+1)%ids.length;show();};
    v.querySelector('[data-v=close]').onclick=()=>v.remove();
    v.onclick=e=>{if(e.target===v)v.remove();};
    $('#viewer-root').appendChild(v);
  }
  function grid(container,ids,{max=3,onChange=null}={}){
    container.classList.add('imggrid');
    async function render(){
      container.innerHTML='';
      for(const id of ids){
        const c=h('<div class="imgcell"><img alt=""><button class="imgdel" title="删除">×</button></div>');
        attach(c.querySelector('img'),id);
        c.querySelector('img').onclick=()=>viewer(ids,ids.indexOf(id));
        c.querySelector('.imgdel').onclick=async e=>{
          e.stopPropagation();
          const yes=await confirmBox('删除这张图片？',{danger:true,okText:'删除'});
          if(!yes)return;
          const pos=ids.indexOf(id);
          if(pos>-1)ids.splice(pos,1);
          await render();
          onChange&&onChange(id);
        };
        container.appendChild(c);
      }
      const add=h('<button class="imgcell add">＋</button>');
      add.onclick=async()=>{
        if(ids.length>=max){toast('最多 '+max+' 张图片');return;}
        const files=await pickFiles();
        for(const f of files){
          if(ids.length>=max){toast('最多 '+max+' 张图片');break;}
          try{const blob=await compress(f);ids.push(await store(blob));}
          catch(err){toast('图片处理失败');}
        }
        await render();
        onChange&&onChange(null);
      };
      container.appendChild(add);
    }
    render();
    return {ids,redraw:render};
  }
  return {pickFiles,compress,store,url,attach,viewer,grid};
})();

/* ===== J4 路由层 ===== */
const Pages={};
const Router=(()=>{
  const stack=[];
  let rendering=false;
  async function render(){
    if(rendering)return;rendering=true;
    try{
      const top=stack[stack.length-1];
      const el=await Pages[top.page].render(top.params||{});
      const v=$('#view');
      v.innerHTML='';v.appendChild(el);
      window.scrollTo(0,0);
    }finally{rendering=false;}
  }
  function go(page,params){stack.push({page,params});render();}
  function back(){if(stack.length>1){stack.pop();render();}}
  function replace(page,params){stack.length=0;stack.push({page,params});render();}
  function start(){stack.length=0;stack.push({page:'home'});render();}
  function refresh(){render();}
  return {go,back,replace,start,refresh,stack};
})();
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act="back"]');
  if(b)Router.back();
});

async function collectImageIds(rec){return rec&&Array.isArray(rec.imageIds)?rec.imageIds:[];}
async function deleteImages(ids){for(const id of ids){if(id)await DB.del('images',id);}}
async function deleteItemCascade(item){
  const imgIds=[];
  const recs=await DB.byIndex('records','itemId',item.id);
  for(const r of recs){imgIds.push(...await collectImageIds(r));await DB.del('records',r.id);}
  const ek=item.kind==='custom'?(item.specKind||'none'):item.kind;
  const isCustom=item.kind==='custom';
  // 共享数据（meals/exercises 等）仅在删除默认事项时清空；自定义事项只删自身记录
  if(isCustom){
    // 自定义模块：数据归属隔离，只删自己 itemId 名下的记录与专属文件夹
    for(const st of ['meals','groceries','exercises','bodyMetrics','skills']){
      for(const r of await DB.all(st))if(r.itemId===item.id)await DB.del(st,r.id);
    }
    for(const bk of await DB.all('books')){
      if(bk.itemId===item.id){imgIds.push(bk.coverId,bk.coverImageId);imgIds.push(...await collectImageIds(bk));await DB.del('books',bk.id);}
    }
    for(const b of ['sew-inspiration','sew-tips','dish-gallery','eat-tips']){
      const es=await DB.byIndex('entries','bucket','c_'+item.id+'-'+b);
      for(const en of es){imgIds.push(...await collectImageIds(en));await DB.del('entries',en.id);}
    }
  }else if(ek==='sew'){
    for(const b of ['sew-inspiration','sew-gallery','sew-tips']){
      const es=await DB.byIndex('entries','bucket',b);
      for(const en of es){imgIds.push(...await collectImageIds(en));await DB.del('entries',en.id);}
    }
  }else if(ek==='eat'){
    for(const m of await DB.all('meals'))await DB.del('meals',m.id);
    for(const b of ['dish-gallery']){
      const es=await DB.byIndex('entries','bucket',b);
      for(const en of es){imgIds.push(...await collectImageIds(en));await DB.del('entries',en.id);}
    }
  }else if(ek==='sport'){
    for(const x of await DB.all('exercises'))await DB.del('exercises',x.id);
    for(const bm of await DB.all('bodyMetrics'))await DB.del('bodyMetrics',bm.id);
  }else if(ek==='read'){
    for(const bk of await DB.all('books')){imgIds.push(bk.coverImageId);imgIds.push(...await collectImageIds(bk));await DB.del('books',bk.id);}
  }else if(ek==='skill'){
    for(const sk of await DB.all('skills'))await DB.del('skills',sk.id);
  }else if(ek==='inventory'){
    for(const o of await DB.byIndex('inventory','itemId',item.id))await DB.del('inventory',o.id);
  }
  await deleteImages(imgIds);
  await DB.del('items',item.id);
}
/* ===== 首页全局搜索：按关键词搜全部相关记录 ===== */
function bucketDisplayName(bucket,byId){ // 由 bucket 推导文件夹显示名
  const b=bucket||'';
  let owner=null;
  if(b.startsWith('c_')){
    const rest=b.slice(2),dash=rest.indexOf('-');
    if(dash>0)owner=byId[rest.slice(0,dash)];
  }
  const nm=owner?owner.name:'';
  if(b==='sew-inspiration'||b.endsWith('-sew-inspiration'))return '灵感收集';
  if(b==='sew-tips'||b.endsWith('-sew-tips')||b==='eat-tips'||b.endsWith('-eat-tips'))return 'Tip';
  if(b==='dish-gallery'||b.endsWith('-dish-gallery'))return nm?(nm+'待做'):'待做';
  if(b==='tl-reflect')return '反思集';
  if(b==='tl-salary')return '工资条';
  if(b.indexOf('tlc-')===0)return byId[b.slice(4)]?byId[b.slice(4)].name:'时间轴项目';
  return '条目';
}
async function globalSearch(q){
  q=(q||'').trim().toLowerCase();
  if(!q)return [];
  const items=await DB.all('items');
  const byId={};items.forEach(i=>byId[i.id]=i);
  const itemName=id=>{const it=byId[id];return it?it.name:'记录';};
  const res=[];
  const push=r=>{if(res.length<200)res.push(r);};
  // 模块名
  for(const it of items){
    if((it.name||'').toLowerCase().indexOf(q)>=0)
      push({t:'模块',label:it.name,date:'',text:(it.kind==='custom'&&it.specKind?({eat:'饮食',sew:'输出类',sport:'运动',skill:'技能',read:'阅读',inventory:'图鉴'}[it.specKind]||'自定义模块'):(it.kind==='inventory'?'图鉴':'打卡模块')),go:()=>Router.go(it.kind==='custom'&&it.specKind==='read'?'readShelf':'item',{itemId:it.id,id:it.id})});
  }
  // 打卡记录文本
  for(const r of await DB.all('records')){
    if(r.text&&r.text.toLowerCase().indexOf(q)>=0)
      push({t:'记录',label:itemName(r.itemId),date:r.date,text:r.text,go:()=>Router.go('day',{itemId:r.itemId,date:r.date})});
  }
  // 饮食菜名
  for(const m of await DB.all('meals')){
    const names=(m.dishes||[]).map(d=>d.name).filter(n=>n&&n.toLowerCase().indexOf(q)>=0);
    if(names.length)
      push({t:'菜品',label:itemName(m.itemId),date:m.date,text:names.join('、'),go:()=>Router.go('day',{itemId:m.itemId,date:m.date})});
  }
  // 运动
  for(const x of await DB.all('exercises')){
    if((x.type||'').toLowerCase().indexOf(q)>=0)
      push({t:'运动',label:itemName(x.itemId),date:x.date,text:(x.type||'')+' '+(x.minutes||0)+' 分钟',go:()=>Router.go('day',{itemId:x.itemId,date:x.date})});
  }
  // 文件夹条目（灵感/Tip/图鉴/待做）+ 时间轴记录
  for(const e of await DB.all('entries')){
    if(((e.title||'')+' '+(e.text||'')).toLowerCase().indexOf(q)>=0){
      const nm=bucketDisplayName(e.bucket,byId);
      if(e.bucket==='tl-reflect'||e.bucket==='tl-salary'||e.bucket.indexOf('tlc-')===0){
        const kind=e.bucket==='tl-salary'?'salary':e.bucket==='tl-reflect'?'reflect':e.bucket.slice(4);
        push({t:'条目',label:nm,date:e.tlDate||'',text:e.title||(e.text||''),go:()=>Router.go('timeline',{kind})});
        continue;
      }
      push({t:'条目',label:nm,date:e.createdAt?new Date(e.createdAt).toISOString().slice(0,10):'',text:e.title||(e.text||''),go:()=>Router.go('folder',{bucket:e.bucket,name:nm})});
    }
  }
  // 图书
  for(const b of await DB.all('books')){
    if(((b.title||'')+' '+(b.author||'')+' '+(b.review||'')).toLowerCase().indexOf(q)>=0)
      push({t:'阅读',label:itemName(b.itemId),date:'',text:b.title+(b.author?' · '+b.author:''),go:()=>Router.go('bookDetail',{id:b.id})});
  }
  // 技能
  for(const s of await DB.all('skills')){
    if(((s.title||'')+' '+(s.text||'')).toLowerCase().indexOf(q)>=0)
      push({t:'技能',label:itemName(s.itemId),date:s.time||'',text:s.title,go:()=>Router.go('item',{id:s.itemId,itemId:s.itemId})});
  }
  // 物品图鉴
  for(const o of await DB.all('inventory')){
    if(((o.name||'')+' '+(o.tag||'')+' '+(o.reason||'')).toLowerCase().indexOf(q)>=0)
      push({t:'物品',label:itemName(o.itemId),date:'',text:o.name+(o.tag?' · '+o.tag:''),go:()=>Router.go('inventory',{itemId:o.itemId})});
  }
  // 食材价格
  for(const g of await DB.all('groceries')){
    if(((g.name||'')+' '+(g.note||'')).toLowerCase().indexOf(q)>=0)
      push({t:'食材',label:itemName(g.itemId),date:g.date||'',text:g.name+(g.price?(' ¥'+g.price):''),go:()=>Router.go('grocery',{itemId:g.itemId})});
  }
  return res;
}
function renderSearchResults(host,rows,q){
  host.innerHTML='';
  host.classList.remove('managing');
  if(!rows.length){
    host.appendChild(h('<div class="empty" style="padding:20px">没有找到与「'+esc(q)+'」相关的记录</div>'));
    return;
  }
  host.appendChild(h('<div style="font-size:12.5px;color:var(--ink2);padding:2px 4px 0">找到 '+rows.length+' 条与「'+esc(q)+'」相关的记录</div>'));
  for(const r of rows){
    const li=h('<div class="hlistitem" style="--c:var(--sand)"><div class="libody"><div class="liname" style="font-size:14.5px"></div><div class="list"></div></div><span style="color:var(--ink2);flex:none">›</span></div>');
    li.querySelector('.liname').textContent='['+r.t+'] '+(r.label||'')+(r.date?(' · '+r.date):'');

    li.onclick=r.go;
    host.appendChild(li);
  }
}

      try{card.setPointerCapture(e.pointerId);}catch(err){}
    });
    grid.addEventListener('pointermove',e=>{
      if(!drag)return;
      if(!drag.moved){
        if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;
        drag.moved=true;drag.card.classList.add('dragging');
      }
      const over=document.elementFromPoint(e.clientX,e.clientY);
      const target=over&&over.closest?over.closest('.hlistitem'):null;
      if(target&&target!==drag.card&&grid.contains(target)){
        const rect=target.getBoundingClientRect();
        grid.insertBefore(drag.card,e.clientY<rect.top+rect.height/2?target:target.nextSibling);
      }
    });
    const endDrag=()=>{
      if(!drag)return;
      const d=drag;drag=null;
      d.card.classList.remove('dragging');

      suppressClick=true;

function buildCalendar(host,state,marked,onPick){
  function draw(){
    const y=state.y,m=state.m;
    const first=new Date(y,m,1);
    const daysInMonth=new Date(y,m+1,0).getDate();

    let cells='';
    for(let i=0;i<startCol;i++)cells+='<span></span>';
    const tk=todayKey();
    for(let d=1;d<=daysInMonth;d++){
      const key=y+'-'+pad2(m+1)+'-'+pad2(d);
      const icon=key===tk?IC_TODAY:(marked.has(key)?IC_DONE:IC_NOT);
      cells+='<button data-d="'+key+'" class="'+(marked.has(key)?'mk ':'')+(key===tk?'today':'')+'">'+d+'<span class="cic">'+icon+'</span></button>';
    }
    host.innerHTML='';
    const box=h('<div class="cal"><div class="cal-head"><button class="cal-nav" data-n="-1">‹</button><div class="cal-title hand">'+y+'年'+(m+1)+'月</div><button class="cal-nav" data-n="1">›</button></div><div class="cal-weekrow"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="cal-days">'+cells+'</div></div>');
    box.querySelectorAll('.cal-days [data-d]').forEach(b=>b.onclick=()=>onPick(b.dataset.d));
    box.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{state.m+=+b.dataset.n;if(state.m<0){state.m=11;state.y--;}else if(state.m>11){state.m=0;state.y++;}draw();});
    host.appendChild(box);
  }
  draw();
}
Pages.item={
  async render(params){
    const item=await DB.get('items',params.id);
    if(!item)return h('<div><div class="topbar"><h1 class="hand">事项不存在</h1></div><div class="empty">它可能已被删除</div></div>');

    const el=h('<div><div class="topbar stack"><h1 class="hand">'+esc(item.name)+'</h1><div class="tb-tools"><button class="iconbtn" data-act="back">←</button><span class="sp"></span><span class="spec-top"></span><button class="iconbtn" id="remind-btn" title="提醒">🔔</button></div></div><div id="todo-banner" class="todo-banner" style="display:none"></div><div class="goals"></div><div id="qadd"></div><div id="spec-above"></div><div id="weekplan"></div><div class="calbox"></div><div class="spec"></div></div>');

    if(ek0==='skill')goals.remove();else renderGoalList(goals,item);
    if(ek0==='eat'){ // 饮食页：🔔提醒移除（采购记录等功能在下方功能 chips 行）
      el.querySelector('#remind-btn').remove();
    }
    // 模块待办（饮食/缝纫/运动）：左上角入口 + 标题下滚动横幅提醒
    if(['eat','sew','sport'].indexOf(ek0)>=0){
      const tbtn=h('<button class="iconbtn" id="todo-btn" title="待办">📋</button>');
      el.querySelector('[data-act=back]').after(tbtn);
      const banner=el.querySelector('#todo-banner');
      function renderBanner(){
        const pend=(item.todos||[]).filter(t=>!t.done);
        banner.innerHTML='';
        if(!pend.length){banner.style.display='none';return;}
        banner.style.display='';
        const txt=pend.map(t=>'！！！'+t.text).join('　');
        banner.appendChild(h('<div class="tb-track">'+esc(txt)+'</div>'));
      }
      function openTodos(){
        const s=h('<div class="sheet"><h3>待办 · '+esc(item.name)+'</h3><div id="td-list" style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px"></div><div><input class="input" id="td-inp" placeholder="新待办，如 今晚整理布料"></div><div class="row"><button class="btn" data-x="cancel">关闭</button><button class="btn primary" data-x="ok">添加</button></div></div>');
        function drawList(){
          const box=s.querySelector('#td-list');box.innerHTML='';
          if(!(item.todos||[]).length){box.appendChild(h('<div style="font-size:12.5px;color:var(--ink2)">暂无待办</div>'));return;}
          [...item.todos].sort((a,b)=>(a.done-b.done)||((a.createdAt||0)-(b.createdAt||0))).forEach(t=>{
            const row=h('<div style="display:flex;align-items:center;gap:10px;padding:5px 2px"></div>');
            const ck=h('<button style="width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff"></button>');
            if(t.done){ck.style.background='var(--ok)';ck.style.borderColor='var(--ok)';ck.textContent='✓';}
            const tx=h('<span style="flex:1;min-width:0;font-size:14.5px"></span>');
            tx.textContent=t.text;
            if(t.done){tx.style.textDecoration='line-through';tx.style.color='var(--ink2)';}
            const tm=h('<span style="flex:none;font-size:12px;color:var(--ink2)"></span>');
            if(t.done&&t.completedAt){const d=new Date(t.completedAt);tm.textContent=(d.getMonth()+1)+'-'+d.getDate()+' '+d.toTimeString().slice(0,5);}
            ck.onclick=async()=>{t.done=!t.done;if(t.done)t.completedAt=Date.now();else delete t.completedAt;await DB.put('items',item);drawList();renderBanner();};
            row.appendChild(ck);row.appendChild(tx);row.appendChild(tm);
            box.appendChild(row);
          });
        }
        function addTodo(){
          const v=(s.querySelector('#td-inp').value||'').trim();
          if(!v)return;
          item.todos=item.todos||[];
          item.todos.push({id:uid(),text:v,done:false,createdAt:Date.now()});
          s.querySelector('#td-inp').value='';
          DB.put('items',item).then(()=>{drawList();renderBanner();});
        }
        drawList();
        const m=modal(s);
        s.querySelector('[data-x=ok]').onclick=addTodo;
        s.querySelector('#td-inp').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addTodo();}};
        s.querySelector('[data-x=cancel]').onclick=()=>closeModal(m);
      }
      tbtn.onclick=()=>openTodos();
      banner.onclick=()=>openTodos();
      renderBanner();
    }else{
      el.querySelector('#todo-banner').remove();
    }
    // 月历（运动和技能模块不显示日历；custom 按 specKind 决定）
    const showCal = (item.kind==='custom'?(item.specKind!=='sport'&&item.specKind!=='skill'):(item.kind!=='sport'&&item.kind!=='skill'));
    if(showCal){
      const now=new Date();
      const state={y:now.getFullYear(),m:now.getMonth()};
      buildCalendar(el.querySelector('.calbox'),state,marked,date=>Router.go('day',{itemId:item.id,date}));
    }else{
      el.querySelector('.calbox').remove();
    }
    // 专属功能区
    await renderSpec(el.querySelector('.spec'),item,el.querySelector('.spec-top'),marked,el.querySelector('#spec-above'));
    // 本周安排（缝纫/饮食/运动，位于日历上方；其他模块移除占位）
    renderWeekPlan(el.querySelector('#weekplan'),item);
    // 快速添加今日记录（饮食/缝纫，位于日历上方）
    if(ek0==='eat'||ek0==='sew'){
      const qa=el.querySelector('#qadd');
      const qbox=ek0==='eat'
        ?h('<button class="skill-add" style="margin:6px 0 4px;padding:14px"><span class="plus">＋</span><span>快速记录今日</span></button>')
        :h('<button class="skill-add" style="margin:6px 0 4px;padding:14px"><span class="plus">＋</span><span>快速记录今日</span></button>');
      qbox.onclick=()=>{if(ek0==='eat')openQuickEat(item);else openQuickSew(item);};
      qa.appendChild(qbox);
    }
    // 铃铛提醒（饮食页已将 🔔 换成 🛒，无铃铛则跳过）
    const rbtn=el.querySelector('#remind-btn');
    if(rbtn){
    function refreshRemindBtn(){rbtn.style.color=item.remindOn?'var(--bean)':'var(--ink2)';}
    refreshRemindBtn();
    rbtn.onclick=async()=>{
      const sheet=h('<div class="sheet"><h3>每日提醒</h3><div style="margin:10px 0"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="r-on"><span>开启提醒</span></label></div><div style="margin:10px 0"><label style="display:block;font-size:13px;color:var(--ink2);margin-bottom:4px">提醒时间</label><input type="time" id="r-time" style="border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff"></div><div class="row"><button class="btn" data-x="close">取消</button><button class="btn primary" data-x="save">保存</button></div></div>');
      sheet.querySelector('#r-on').checked=!!item.remindOn;
      sheet.querySelector('#r-time').value=item.remindTime||'21:00';
      const m=modal(sheet);
      sheet.querySelector('[data-x="close"]').onclick=()=>closeModal(m);
      sheet.querySelector('[data-x="save"]').onclick=async()=>{
        item.remindOn=sheet.querySelector('#r-on').checked;
        item.remindTime=sheet.querySelector('#r-time').value||'21:00';
        await DB.put('items',item);
        refreshRemindBtn();
        closeModal(m);
        toast(item.remindOn?'提醒已开启':'提醒已关闭');
      };
    };
    }
    return el;
  }
};
/* ===== 本周安排（缝纫/饮食/运动）：两行排列——一行一二三四五六日、一行莫兰迪彩虹方格，点击方格输入当天预设安排；不显示输入文字，「快速安排」随机分配到一天；位于日历上方 ===== */
const WEEKPLAN_DAYS=['周一','周二','周三','周四','周五','周六','周日'];
const WEEKPLAN_COLORS=['#A98467','#C97B7B','#D9A48F','#C2A27C','#8FA68A','#7A93AC','#B5838D'];
function renderWeekPlan(host,item){
  if(!host)return;
  const ek=item.kind==='custom'?(item.specKind||'none'):item.kind;
  if(['sew','eat','sport'].indexOf(ek)<0){host.remove();return;}
  // 按周分开保存：{ [周一日期]: {'1'..'7': 文本} }；周一自动进入新的一周，空白开始
  const curWeek=weekStart(todayKey());
  const nextWeek=addDays(curWeek,7);
  // 旧格式迁移：直接 {'1'..'7'} 的数据迁入当前周（仅当当前周无数据）
  if(item.weekPlan&&!Object.keys(item.weekPlan).some(k=>/^\d{4}-/.test(k))){
    const old=item.weekPlan;
    if(!old[curWeek])item.weekPlan={[curWeek]:Object.assign({},old)};
    for(const k of Object.keys(old))if(/^[1-7]$/.test(k))delete item.weekPlan[k];
    DB.put('items',item);
  }
  if(!item.weekPlan)item.weekPlan={};
  const wp=item.weekPlan;
  const cur=wp[curWeek]||{};
  const todayN=(new Date().getDay()+6)%7+1; // 今天星期数（1=周一）
  host.innerHTML='';
  const card=h('<div class="cal" id="wp-card"><div class="cal-head"><div class="cal-title hand">本周安排</div><button class="btn" id="wp-quick" style="padding:5px 12px;font-size:12.5px">快速安排</button></div><div id="wp-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px"></div><div style="font-size:11.5px;color:var(--ink2);margin-top:8px">点击方格设置当天预设安排（早于今天的会存到下周同天）；「快速安排」随机填入一天</div></div>');
  const grid=card.querySelector('#wp-grid');
  for(let i=0;i<7;i++){
    const key=String(i+1);
    const has=!!cur[key];
    const isToday=Number(key)===todayN;
    const done=(item.weekDone&&item.weekDone[curWeek]&&item.weekDone[curWeek][key])?true:false;
    const CHECK_SVG='<svg viewBox="0 0 24 24" style="position:absolute;left:50%;top:50%;width:62%;height:62%;transform:translate(-50%,-50%);color:#fff;pointer-events:none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="m3.75 12.95l2.2 2.7c1.44 1.75 2.15 2.63 3.1 2.63s1.67-.88 3.1-2.65l8.1-10"/></svg>';
    const cell=h('<div style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0"><span style="font-size:11.5px;color:'+(isToday?'var(--ink)':'var(--ink2)')+(isToday?';font-weight:700':'')+'">'+WEEKPLAN_DAYS[i].slice(1)+'</span><button type="button" class="wp-cell" data-day="'+key+'" title="'+WEEKPLAN_DAYS[i]+'" style="width:100%;aspect-ratio:1;border-radius:8px;background:'+WEEKPLAN_COLORS[i]+';opacity:'+(has||done?'1':'.35')+';box-shadow:'+((has||done)?'var(--shadow)':'none')+';border:'+(isToday?'2px solid #4A3F35':'2px solid transparent')+';position:relative;cursor:pointer;padding:0">'+(done?CHECK_SVG:(has?'<span style="position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)"></span>':''))+'</button></div>');
    let suppressWp=false; // 长按后短暂屏蔽 click，避免误开编辑弹窗
    cell.querySelector('.wp-cell').onclick=async()=>{
      if(suppressWp)return;
      // 该天星期数早于今天 → 存下一周同天；否则存本周
      const targetWeek=Number(key)<todayN?nextWeek:curWeek;
      const wkLabel=targetWeek===curWeek?'本周':'下周';
      const tw=wp[targetWeek]||{};
      const s=h('<div class="sheet"><h3>'+wkLabel+WEEKPLAN_DAYS[i]+'预设安排 · '+esc(item.name)+'</h3><textarea class="textarea" id="wp-inp" placeholder="如 19:00 有氧半小时（留空保存即清除）"></textarea><div class="row"><button class="btn" data-x="no">取消</button><button class="btn primary" data-x="ok">保存</button></div></div>');
      s.querySelector('#wp-inp').value=tw[key]||'';
      const m=modal(s);
      s.querySelector('[data-x=no]').onclick=()=>closeModal(m);
      s.querySelector('[data-x=ok]').onclick=async()=>{
        const v=s.querySelector('#wp-inp').value.trim();
        item.weekPlan=item.weekPlan||{};
        item.weekPlan[targetWeek]=item.weekPlan[targetWeek]||{};
        if(v)item.weekPlan[targetWeek][key]=v;else delete item.weekPlan[targetWeek][key];
        await DB.put('items',item);
        closeModal(m);
        toast('已保存'+wkLabel+WEEKPLAN_DAYS[i]+'安排');
        renderWeekPlan(host,item);
      };
    };
    // 长按方格＝切换当天完成状态（打勾），按周记录
    bindLongPress(cell.querySelector('.wp-cell'),async()=>{
      suppressWp=true;setTimeout(()=>suppressWp=false,400);
      item.weekDone=item.weekDone||{};
      item.weekDone[curWeek]=item.weekDone[curWeek]||{};
      const nowDone=!item.weekDone[curWeek][key];
      if(nowDone)item.weekDone[curWeek][key]=1;else delete item.weekDone[curWeek][key];
      await DB.put('items',item);
      toast(nowDone?'已完成'+WEEKPLAN_DAYS[i]:'已取消'+WEEKPLAN_DAYS[i]+'完成');
      renderWeekPlan(host,item);
    });
    grid.appendChild(cell);
  }
  // 快速安排：输入一条内容，随机分配到本周尚未设置的一天
  card.querySelector('#wp-quick').onclick=async()=>{
    const v=await promptBox('输入安排内容（随机分配到一天）','');
    if(!v)return;
    const empty=[];for(let i=1;i<=7;i++)if(!cur[String(i)])empty.push(String(i));
    if(!empty.length){toast('本周 7 天都已有安排');return;}
    const key=empty[Math.floor(Math.random()*empty.length)];
    item.weekPlan=item.weekPlan||{};
    item.weekPlan[curWeek]=item.weekPlan[curWeek]||{};
    item.weekPlan[curWeek][key]=v;
    await DB.put('items',item);
    toast('已随机安排到'+WEEKPLAN_DAYS[Number(key)-1]);
    renderWeekPlan(host,item);
  };
  host.appendChild(card);
}
async function renderSpec(host,item,topSlot,marked,aboveSlot){
  host.innerHTML='';
  if(topSlot)topSlot.innerHTML='';
  // custom kind 根据 specKind 决定专属模块渲染
  const ek=(item.kind==='custom'?(item.specKind||'none'):item.kind);
  const head=h('<div class="spec-head"><div class="sp"></div></div>');
  host.appendChild(head);
  const sp=head.querySelector('.sp');
  // 帮助函数：向 topSlot 添加小图标按钮
  function topBtn(html,title,onclick){
    const b=h('<button class="iconbtn" title="'+title+'">'+html+'</button>');
    b.onclick=onclick;
    if(topSlot)topSlot.appendChild(b);
    return b;
  }
  if(ek==='none'){
    sp.textContent='';
  }else if(ek==='sew'){
    // 自定义模块使用独立文件夹（完全空白初始化，不共享固定模块内容）
    const bp=item.kind==='custom'?('c_'+item.id+'-'):'';
    [['inspiration','灵感收集','💡'],['tips','Tip','📝']].forEach(([b,name,ic])=>{
      topBtn(ic,'打开 '+name,()=>Router.go('folder',{bucket:bp+'sew-'+b,name,itemId:item.id}));
    });
    sp.textContent='';
  }else if(ek==='eat'){
    sp.textContent='';
    // 自定义模块文件夹独立命名，与固定饮食模块完全隔离
    const bp=item.kind==='custom'?('c_'+item.id+'-'):'';
    // 功能入口 chips：文案按模块名生成；长按可隐藏，行尾「＋」恢复
    const feats=[
      {k:'weekStat',lab:'本周统计',go:()=>Router.go('weekStat',{itemId:item.id})},
      {k:'gallery',lab:'待做',go:()=>Router.go('folder',{bucket:bp+'dish-gallery',name:'待做',itemId:item.id})},
      {k:'tips',lab:'Tip',go:()=>Router.go('folder',{bucket:bp+'eat-tips',name:'Tip',itemId:item.id})},
      {k:'grocery',lab:'采购记录',go:()=>Router.go('grocery',{itemId:item.id})}
    ];
    if(item.kind!=='custom')feats.splice(2,0,{k:'fridge',lab:'食材库',go:()=>Router.go('fridge',{itemId:item.id})}); // 食材库排在待做之后（上一行），仅固定饮食模块生效
    const dis=item.disabledFeats||[];
    const row=h('<div style="display:flex;gap:8px;flex-wrap:wrap;margin:2px 16px 12px"></div>');
    for(const f of feats){
      if(dis.indexOf(f.k)>=0)continue;
      const c=h('<button class="tagchip feat-chip" style="padding:6px 14px;font-size:13.5px">'+esc(f.lab)+'</button>');
      c.onclick=f.go;
      bindLongPress(c,async()=>{
        const y=await confirmBox('隐藏「'+esc(f.lab)+'」功能？隐藏后可在行尾「＋」恢复',{danger:true,okText:'隐藏'});
        if(y){item.disabledFeats=Array.from(new Set((item.disabledFeats||[]).concat(f.k)));await DB.put('items',item);Router.refresh();}
      });
      row.appendChild(c);
    }
    if(dis.length){
      const rec=h('<button class="tagchip" style="padding:6px 12px;font-size:13.5px">＋</button>');
      rec.onclick=()=>{
        const s=h('<div class="sheet"><h3>恢复功能</h3><div style="display:flex;flex-direction:column;gap:10px" id="fr-list"></div></div>');
        const m=modal(s);
        for(const f of feats.filter(f=>dis.indexOf(f.k)>=0)){
          const b=h('<button class="btn">'+esc(f.lab)+'</button>');
          b.onclick=async()=>{item.disabledFeats=(item.disabledFeats||[]).filter(k=>k!==f.k);await DB.put('items',item);closeModal(m);Router.refresh();};
          s.querySelector('#fr-list').appendChild(b);
        }
        const no=h('<button class="btn">取消</button>');
        no.onclick=()=>closeModal(m);
        s.querySelector('#fr-list').appendChild(no);
      };
      row.appendChild(rec);
    }
    // 六个功能 chips 行移到日历上方
    (aboveSlot||host).appendChild(row);
  }else if(ek==='sport'){
    topBtn('⚖','体重三围',()=>Router.go('bodyMetrics',{itemId:item.id}));
    sp.textContent=item.name+'记录';
    // 手动添加入口（大加号框，同技能页样式）
    const addBox=h('<button class="skill-add" style="margin:6px 0 10px"><span class="plus">＋</span><span>添加'+esc(item.name)+'</span></button>');
    addBox.onclick=()=>{
      const sheet=h('<div class="sheet"><h3>添加'+esc(item.name)+'</h3>'
        +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">日期</label><input type="date" class="input" id="ex-date" value="'+todayKey()+'"></div>'
        +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">运动类型</label><input class="input" id="ex-type" placeholder="如 慢跑、瑜伽"></div>'
        +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">分钟数</label><input type="number" class="input" id="ex-min" placeholder="如 30" min="1"></div>'
        +'<label style="display:flex;align-items:center;gap:6px;margin:10px 0;font-size:13.5px"><input type="checkbox" id="ex-fav"> 保存为常见运动（双击可快速打卡）</label>'
        +'<div class="row"><button class="btn" data-x="no">取消</button><button class="btn primary" data-x="ok">保存</button></div></div>');
      const m=modal(sheet);
      sheet.querySelector('[data-x="no"]').onclick=()=>closeModal(m);
      sheet.querySelector('[data-x="ok"]').onclick=async()=>{
        const date=sheet.querySelector('#ex-date').value||todayKey();
        const type=sheet.querySelector('#ex-type').value.trim();
        const min=parseInt(sheet.querySelector('#ex-min').value,10);
        if(!type){toast('请输入运动类型');return;}
        if(!min||min<1){toast('请输入分钟数');return;}
        await DB.put('exercises',{id:uid(),itemId:item.id,date,time:nowHM(),type,minutes:min});
        await syncExerciseRecord(item.id,date);
        if(sheet.querySelector('#ex-fav').checked){ // 存为常见运动（同名覆盖分钟数）
          item.favSports=item.favSports||[];
          const ex=item.favSports.find(f=>f.name===type);

async function saveRec(rec){
  const empty=!rec.text.trim()&&!rec.imageIds.length;
  if(empty){
    if(rec._saved)await DB.del('records',rec.id);
    rec._saved=false;
    return;
  }
  rec.updatedAt=Date.now();
  await DB.put('records',{id:rec.id,itemId:rec.itemId,date:rec.date,text:rec.text,imageIds:[...rec.imageIds],updatedAt:rec.updatedAt});
  rec._saved=true;
}
function mealDishes(m){
  if(Array.isArray(m.dishes))return m.dishes;
  return (m.items||'').split('\n').map(x=>x.trim()).filter(Boolean).map(name=>({name,ing:[]}));
}
async function computeFoodKinds(date,itemId){
  let meals=await DB.byIndex('meals','date',date);
  if(itemId)meals=meals.filter(m=>m.itemId===itemId);
  const set=new Set();
  for(const m of meals)for(const d of mealDishes(m)){
    const tags=(d.ing||[]).filter(Boolean);
    if(tags.length)tags.forEach(t=>set.add(t));
    else if(d.name)set.add(d.name);
  }
  return set.size;
}
const MEAL_SLOTS=[['breakfast','早餐'],['lunch','午餐'],['dinner','晚餐'],['snack','加餐']];
async function getModuleTagPool(itemId){ // 模块标签池：各项目（模块）标签独立存放，互不混用
  const key='tagpool_'+(itemId||'none');
  const v=await DB.getSetting(key,[]);
  return Array.isArray(v)?v:[];
}
async function addModuleTagPool(itemId,tags){ // 把本模块用到的标签写入模块池
  const key='tagpool_'+(itemId||'none');
  const pool=await getModuleTagPool(itemId);
  let ch=false;
  for(const t of (tags||[])){const k=(t||'').trim();if(k&&pool.indexOf(k)<0){pool.push(k);ch=true;}}
  if(ch)await DB.setSetting(key,pool);
}
async function migrateTagpoolNone(){ // 旧版 Tip/灵感收集漏传 itemId 时标签存进 tagpool_none，现并入饮食池
  const old=await DB.getSetting('tagpool_none',[]);
  if(!Array.isArray(old)||!old.length)return;
  const its=(await DB.all('items')).filter(it=>it.name==='饮食');
  const dietId=its.length?its[0].id:null;
  await addModuleTagPool(dietId,old);
  await DB.setSetting('tagpool_none',[]);
}
async function cleanTagpoolCross(){ // 一次性清洗历史脏数据：剔除非饮食模块标签池中与饮食食材重复的词（如五花肉、香菇）
  const flag=await DB.getSetting('tagpool_cross_cleaned',false);
  if(flag)return;
  const its=await DB.all('items');
  const diet=its.find(it=>it.name==='饮食');
  const dietId=diet?diet.id:null;
  const foodWords=[];
  const addWord=t=>{const k=(t||'').trim();if(k&&foodWords.indexOf(k)<0)foodWords.push(k);};
  for(const t of await allMealTags(dietId))addWord(t);
  for(const t of await getModuleTagPool(dietId))addWord(t);
  for(const it of its){
    if(it.id===dietId||it.kind==='eat'||it.kind==='timeline')continue; // 饮食自身与时间轴固定标签项目不清洗
    const pool=await getModuleTagPool(it.id);
    const cleaned=pool.filter(t=>foodWords.indexOf(t)<0);
    if(cleaned.length!==pool.length)await DB.setSetting('tagpool_'+it.id,cleaned);
  }
  await DB.setSetting('tagpool_cross_cleaned',true);
}
async function moduleTagCands(itemId){ // 模块标签候选历史：本模块池优先，其后并入该模块菜名/待做来源；本模块食材库的食材名一并入候选
  const pool=await getModuleTagPool(itemId);
  const extra=await allMealTags(itemId);
  const arr=[...pool,...extra.filter(t=>pool.indexOf(t)<0)];
  if(itemId){ // 食材库联动：该模块在库食材（含历史区）的名字进入标签候选
    const fs=await DB.byIndex('fridge','itemId',itemId);
    for(const f of fs){const k=(f.name||'').trim();if(k&&arr.indexOf(k)<0)arr.push(k);}
  }
  return arr;
}
async function galleryDishTags(itemId){ // 图鉴条目的食材标签（与菜名标签共用历史）
  const item=itemId?await DB.get('items',itemId):null;
  const bucket=(item&&item.kind==='custom'?'c_'+item.id+'-':'')+'dish-gallery';
  const arr=[];
  for(const e of await DB.all('entries')){
    if(e.bucket!==bucket)continue;
    for(const t of (e.ing||[])){const k=(t||'').trim();if(k&&arr.indexOf(k)<0)arr.push(k);}
  }
  return arr;
}
async function topMealTags(limit,itemId){
  let meals=await DB.all('meals');
  if(itemId)meals=meals.filter(m=>m.itemId===itemId);
  const stat={};
  for(const m of meals)for(const d of mealDishes(m))for(const t of (d.ing||[])){
    const k=(t||'').trim();if(!k)continue;
    if(!stat[k])stat[k]={count:0,last:''};
    stat[k].count++;
    if((m.date||'')>stat[k].last)stat[k].last=m.date;
  }
  const arr=Object.keys(stat).map(k=>({tag:k,count:stat[k].count,last:stat[k].last}))
    .sort((a,b)=>b.count-a.count||b.last.localeCompare(a.last));
  const gt=await galleryDishTags(itemId); // 图鉴标签并入历史（按使用次数排后）
  for(const t of gt)if(!arr.some(x=>x.tag===t))arr.push({tag:t,count:0,last:''});
  return arr.slice(0,limit);
}
async function allMealTags(itemId){
  let meals=await DB.all('meals');
  if(itemId)meals=meals.filter(m=>m.itemId===itemId);
  const arr=[];
  for(const m of meals)for(const d of mealDishes(m))for(const t of (d.ing||[])){
    const k=(t||'').trim();if(k&&arr.indexOf(k)<0)arr.push(k);
  }
  for(const t of await galleryDishTags(itemId))if(arr.indexOf(t)<0)arr.push(t);
  return arr;
}

      histCache.forEach(t=>{

    function drawSearch(){
      const q=searchInp.value.trim();

      if(isNew){for(let k=0;k<parts.length;k++)dishes.push({name:parts[k],ing:[...new Set(sel)],price:k===0?price:null,market:k===0?market:null});}
      else{dishes[dIdx]={name:parts[0],ing:[...new Set(sel)],price,market};for(let k=1;k<parts.length;k++)dishes.push({name:parts[k],ing:[],price:null,market:null});}
      await addModuleTagPool(itemId,sel); // 菜名食材写入本模块标签池

async function renderExerciseSection(body,date,itemId){
  let exs=await DB.byIndex('exercises','date',date);
  if(itemId)exs=exs.filter(x=>x.itemId===itemId);
  const wrap=h('<div style="margin-top:16px"><div style="font-size:13px;color:var(--ink2);margin-bottom:6px">今日运动</div><div class="exrow"><input data-f="type" placeholder="运动类型"><input data-f="min" placeholder="分钟数" style="flex:none;width:80px"><button class="btn primary" data-x="add">添加</button></div><div class="exlist"></div></div>');
  const inpT=wrap.querySelector('[data-f=type]');
  const inpM=wrap.querySelector('[data-f=min]');
  const list=wrap.querySelector('.exlist');
  async function draw(){
    list.innerHTML='';
    let all=await DB.byIndex('exercises','date',date);
    if(itemId)all=all.filter(x=>x.itemId===itemId);
    all=all.sort((a,b)=>a.time.localeCompare(b.time));
    if(!all.length)list.appendChild(h('<div class="empty" style="padding:10px">还没有运动</div>'));
    for(const x of all){
      const it=h('<div class="exitem"><span></span><button>删</button></div>');
      const hm=x.time?x.time+' · ':'';
      it.querySelector('span').textContent=hm+(x.type||'未分类')+' · '+(x.minutes||0)+' 分钟';
      it.querySelector('button').onclick=async()=>{const y=await confirmBox('删除这条运动？',{danger:true,okText:'删除'});if(y){await DB.del('exercises',x.id);await syncExerciseRecord(itemId,x.date);draw();}};
      list.appendChild(it);
    }
  }
  wrap.querySelector('[data-x=add]').onclick=async()=>{
    const type=inpT.value.trim();const m=parseInt(inpM.value,10);
    if(!type){toast('请输入运动类型');return;}
    if(!m||m<1){toast('请输入分钟数');return;}

    await syncExerciseRecord(itemId,date);
    inpT.value='';inpM.value='';draw();
  };
  body.appendChild(wrap);await draw();
}

/* ===== J8 设置 + ZIP 工具 ===== */
// CRC32 表（precomputed）
const CRC32_TABLE=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c;}return t;})();
function crc32Bytes(bytes){let c=0xFFFFFFFF;for(const b of bytes)c=CRC32_TABLE[(c^b)&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function strToBytes(s){return new TextEncoder().encode(s);}
// 生成一个 ZIP（store 不压缩）。entries=[{name, bytes}]
function makeZip(entries){
  const parts=[]; // 收集所有部分
  const centralDirs=[];
  let offset=0;
  for(const e of entries){
    const nameBytes=strToBytes(e.name);
    const data=e.bytes;
    const crc=crc32Bytes(data);
    const nlen=nameBytes.length;
    const dlen=data.length;
    // Local file header (30 bytes + name + data)
    const lh=new Uint8Array(30+nlen+dlen);
    const dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); // PK\x03\x04
    dv.setUint16(4,20,true); // version needed
    dv.setUint16(6,0,true); // flags
    dv.setUint16(8,0,true); // method: store
    dv.setUint16(10,0,true); // time
    dv.setUint16(12,0,true); // date
    dv.setUint32(14,crc,true);
    dv.setUint32(18,dlen,true); // compressed
    dv.setUint32(22,dlen,true); // uncompressed
    dv.setUint16(26,nlen,true);
    dv.setUint16(28,0,true); // extra len
    lh.set(nameBytes,30);
    lh.set(data,30+nlen);
    parts.push(lh);
    // Central directory entry (46 bytes + name)
    const cd=new Uint8Array(46+nlen);
    const cdv=new DataView(cd.buffer);
    cdv.setUint32(0,0x02014b50,true); // PK\x01\x02
    cdv.setUint16(4,20,true);
    cdv.setUint16(6,20,true);
    cdv.setUint16(8,0,true);
    cdv.setUint16(10,0,true);
    cdv.setUint16(12,0,true);
    cdv.setUint16(14,0,true);
    cdv.setUint32(16,crc,true);
    cdv.setUint32(20,dlen,true);
    cdv.setUint32(24,dlen,true);
    cdv.setUint16(28,nlen,true);
    cdv.setUint16(30,0,true);
    cdv.setUint16(32,0,true);
    cdv.setUint16(34,0,true);
    cdv.setUint16(36,0,true);
    cdv.setUint32(38,offset,true);
    cd.set(nameBytes,46);
    centralDirs.push(cd);
    offset+=lh.length;
  }
  // End of central directory (22 bytes)
  const eocd=new Uint8Array(22);
  const ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(4,0,true);
  ev.setUint16(6,0,true);
  ev.setUint16(8,entries.length,true);
  ev.setUint16(10,entries.length,true);
  let cdSize=0;for(const cd of centralDirs)cdSize+=cd.length;
  ev.setUint32(12,cdSize,true);
  ev.setUint32(16,offset,true);
  ev.setUint16(20,0,true);
  // 合并
  let total=offset+cdSize+22;
  const out=new Uint8Array(total);
  let p=0;
  for(const part of parts){out.set(part,p);p+=part.length;}
  for(const cd of centralDirs){out.set(cd,p);p+=cd.length;}
  out.set(eocd,p);
  return new Blob([out],{type:'application/zip'});
}
// 简单 ZIP 解析（只支持 store + 本工具生成的格式）
async function parseZip(blob){
  const buf=new Uint8Array(await blob.arrayBuffer());
  const dv=new DataView(buf.buffer);
  const entries={};
  let p=0;
  while(p<buf.length){
    if(dv.getUint32(p,true)!==0x04034b50)break;
    const method=dv.getUint16(p+8,true);
    const compSize=dv.getUint32(p+18,true);
    const nameLen=dv.getUint16(p+26,true);
    const extraLen=dv.getUint16(p+28,true);
    const name=new TextDecoder().decode(buf.subarray(p+30,p+30+nameLen));
    const dataStart=p+30+nameLen+extraLen;
    const data=buf.subarray(dataStart,dataStart+compSize);
    entries[name]=new Blob([data]);
    p=dataStart+compSize;
  }
  return entries;
}
async function exportAll(){
  const storeNames=['items','records','entries','meals','exercises','bodyMetrics','books','skills','inventory','groceries','fridge','images','settings'];
  const entries=[];
  for(const n of storeNames){
    const all=await DB.all(n);
    if(n==='images'){
      // images 存的是 Blob，需要特殊处理
      for(const img of all){
        const buf=await (img.blob||img.data).arrayBuffer();
        entries.push({name:'images/'+img.id+'.bin',bytes:new Uint8Array(buf)});
      }
    }else{
      const json=JSON.stringify(all,(_k,v)=>v instanceof Blob?'[BLOB]':v);
      entries.push({name:n+'.json',bytes:strToBytes(json)});
    }
  }
  const zip=makeZip(entries);
  const url=URL.createObjectURL(zip);
  const a=document.createElement('a');
  // 备份文件名带具体时间（到秒），同一天的多份备份也能区分
  const dn=new Date();
  const ts=dn.getFullYear()+pad2(dn.getMonth()+1)+pad2(dn.getDate())+'-'+pad2(dn.getHours())+pad2(dn.getMinutes())+pad2(dn.getSeconds());
  a.href=url;a.download='journal-backup-'+ts+'.zip';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importAll(blob,mode){
  const entries=await parseZip(blob);
  const storeNames=['items','records','entries','meals','exercises','bodyMetrics','books','skills','inventory','groceries','fridge','images','settings'];
  if(mode==='overwrite'){
    for(const n of storeNames)await DB.clear(n);
  }
  for(const n of storeNames){
    const key=n+'.json';
    if(entries[key]){
      const text=await entries[key].text();
      const arr=JSON.parse(text);
      if(arr&&arr.length)await DB.bulkPut(n,arr);
    }
  }
  // images
  for(const k in entries){
    if(k.startsWith('images/')&&k.endsWith('.bin')){
      const id=k.slice(7,-4);
      const ab=await entries[k].arrayBuffer();
      await DB.put('images',{id,blob:new Blob([ab]),updatedAt:Date.now()});
    }
  }
}

  const storeNames=['items','records','entries','meals','exercises','bodyMetrics','books','skills','inventory','groceries','fridge','images','settings'];

}

/* ===== 目标列表（长/短期合并，短期倒计时）===== */
function goalDaysLeft(g){ // 剩余天数 =（创建日+天数）- 今天；0=今天截止，负数=已到期
  if(!g.days)return null;
  const s=new Date(g.start+'T00:00:00'),dl=new Date(s);
  dl.setDate(dl.getDate()+Number(g.days));
  const t=new Date(todayKey()+'T00:00:00');
  return Math.round((dl-t)/86400000);
}
function openGoalForm(item){ // 新增目标弹窗：内容+类型（短期/长期）+天数（短期必填，长期可不填不倒计时）
  let type='short';
  const sheet=h('<div class="sheet"><h3>添加目标</h3>'

    +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">类型</label><div id="g-type" style="display:flex;gap:6px"></div></div>'

function renderGoalList(box,item){ // 目标列表：只显示已设目标＋底部「＋添加目标」；短期显示倒计时（天数黑色加粗），长期仅文本
  // 旧数据迁移：短期/长期文本框内容 → 两条长期目标（无天数，仅文本）
  if(!item.goals&&(item.shortGoal||item.longGoal)){
    item.goals=[];
    if(item.shortGoal)item.goals.push({id:uid(),text:item.shortGoal,type:'long',days:null,start:todayKey()});
    if(item.longGoal)item.goals.push({id:uid(),text:item.longGoal,type:'long',days:null,start:todayKey()});
    delete item.shortGoal;delete item.longGoal;
    DB.put('items',item);
  }
  box.innerHTML='';
  for(const g of (item.goals||[])){
    const left=goalDaysLeft(g);
    let cd='';
    if(left!==null){
      if(left>0)cd='<span class="gleft"><b>'+left+'</b> 天</span>';
      else if(left===0)cd='<span class="gleft"><b>今天</b></span>';
      else cd='<span class="gleft"><b>已到期</b></span>';
    }
    const card=h('<div class="goal"><div class="goal-row"><div class="gtext">'+esc(g.text)+'</div>'+cd+'</div></div>');
    // 左滑删除
    let pd=null;
    card.addEventListener('pointerdown',e=>{
      pd={sx:e.clientX,sy:e.clientY,moved:false,dx:0};
      try{card.setPointerCapture(e.pointerId);}catch(err){}
    });
    card.addEventListener('pointermove',e=>{
      if(!pd)return;
      if(!pd.moved){
        if(Math.abs(e.clientX-pd.sx)>6&&Math.abs(e.clientX-pd.sx)>Math.abs(e.clientY-pd.sy))pd.moved=true;
        else return;
      }
      let dx=e.clientX-pd.sx;
      if(dx>0)dx=0; // 只允许向左滑
      pd.dx=dx;
      card.style.transform='translateX('+dx+'px)';
    });
    card.addEventListener('pointerup',async()=>{
      if(!pd)return;
      const dx=pd.dx;
      card.style.transform='';
      if(pd.moved&&dx<-80){
        const y=await confirmBox('删除该目标？',{danger:true,okText:'删除'});
        if(y){item.goals=(item.goals||[]).filter(x=>x.id!==g.id);await DB.put('items',item);Router.refresh();}
      }
      pd=null;
    });
    box.appendChild(card);
  }
  const add=h('<button class="skill-add" style="margin-top:10px;padding:16px 14px"><span class="plus">＋</span><span>添加目标</span></button>');
  add.onclick=()=>openGoalForm(item);
  box.appendChild(add);
}
/* ===== 手势助手：双击 / 长按（桌面+移动端）===== */
function bindDoubleTap(el,fn){ // 双击＝触发 fn（移动端用 touchend 双触检测，桌面用 dblclick）
  let lastTouch=0;
  el.addEventListener('touchend',e=>{
    const now=Date.now();
    if(now-lastTouch<300){lastTouch=0;e.preventDefault();fn();}
    else lastTouch=now;
  },{passive:false});
  el.addEventListener('dblclick',e=>{e.preventDefault();fn();});
}
function bindLongPress(el,fn){ // 长按 600ms＝触发 fn（touch 与 pointer 鼠标）
  let timer=null,start=null;
  function cancel(){if(timer){clearTimeout(timer);timer=null;}}
  el.addEventListener('touchstart',e=>{start=e.touches[0];timer=setTimeout(()=>{timer=null;fn();},600);},{passive:true});
  el.addEventListener('touchmove',e=>{if(start&&Math.abs(e.touches[0].clientX-start.clientX)>10)cancel();},{passive:true});
  el.addEventListener('touchend',cancel,{passive:true});
  el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')timer=setTimeout(()=>{timer=null;fn();},600);});
  el.addEventListener('pointerup',cancel);
  el.addEventListener('pointerleave',cancel);
}

        +'<div class="row">'+(isNew?'':'<button class="btn danger" data-x="del">删除</button>')+'<button class="btn" data-x="no">取消</button><button class="btn primary" data-x="ok">保存</button></div></div>');

          const m2=modal(s2);

          invs.forEach(it=>{
            const b=h('<button class="btn"></button>');b.textContent='📚 '+it.name;
            b.onclick=()=>{closeModal(m2);done(it);};
            s2.querySelector('#ie-inv-list').appendChild(b);
          });
        });

      const mvBtn=sheet.querySelector('#ie-move');

        o.itemId=it.id;await DB.put('inventory',o);closeModal(m);toast('已移动到「'+it.name+'」');Router.refresh();
      });
      const cpBtn=sheet.querySelector('#ie-copy');
      if(cpBtn)cpBtn.onclick=()=>pickInv('复制到哪个图鉴？',async it=>{

/* ===== J5 时间轴（反思集 / 工资条）===== */
const TL_KINDS={reflect:{name:'反思集',bucket:'tl-reflect',count:false,contentLabel:'记录内容'},salary:{name:'工资条',bucket:'tl-salary',count:true,feeLabel:'人工费（元）',feePlaceholder:'如 120.00',statLabel:'本月工资',statPrefix:'¥',statHint:'按当月人工费合计自动统计',contentLabel:'内容（如 项目名称、工作内容）'}};
const TL_SELF_TAGS=['魅力值','生命值','幸福值','金币值','智力值','经验值'];
async function ensureSelfTags(){ // 「投资自己」项目迁移：固定五标签；仅首次迁移时清除旧标签池与记录上的旧标签
  const its=(await DB.all('items')).filter(it=>it.kind==='timeline'&&it.name==='投资自己');
  for(const it of its){
    if(it.statTags){ // 已迁移：仅补齐新增的固定标签（不清记录，不影响已有统计）
      if(TL_SELF_TAGS.some(t=>it.statTags.indexOf(t)<0))await DB.put('items',Object.assign({},it,{statTags:TL_SELF_TAGS}));
      continue;
    }
    await DB.put('items',Object.assign({},it,{statTags:TL_SELF_TAGS}));
    await DB.setSetting('tltag_tlc-'+it.id,[]);
    for(const e of await DB.byIndex('entries','bucket','tlc-'+it.id)){
      if(e.tags&&e.tags.length)await DB.put('entries',Object.assign({},e,{tags:[]}));
    }
  }
}
function fmtSigned(v){ // 带符号数值：加分绿色、减分红色
  const n=Math.round(v*100)/100;
  return '<span style="color:var(--'+(n>=0?'ok':'danger')+')">'+(n>=0?'+':'-')+Math.abs(n)+'</span>';
}
async function getTlCfg(kind){ // kind='reflect'|'salary' 或自定义项目 itemId
  if(TL_KINDS[kind])return TL_KINDS[kind];
  const it=await DB.get('items',kind);
  if(it&&it.kind==='timeline'){
    const count=it.tlKind==='count';
    return {name:it.name,bucket:'tlc-'+it.id,count,
      feeLabel:'数值',feePlaceholder:'如 120.00',statLabel:'本月合计',statPrefix:'',statHint:'按当月数值合计自动统计',
      contentLabel:'记录内容',itemId:it.id,custom:true,statTags:it.statTags||null};
  }
  return null;
}
function chooseTlKind(){ // 新增时间轴项目：选择计数 / 不计数
  return new Promise(resolve=>{
    const opts=[{k:'nocount',label:'不计数',sub:'纯文字记录，像反思集'},{k:'count',label:'计数',sub:'每条记录含数值，自动按月合计'}];
    const sheet=h('<div class="sheet"><h3>选择项目类型</h3><div style="display:flex;flex-direction:column;gap:8px">'+opts.map(x=>'<button class="btn specopt" data-k="'+x.k+'" style="flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px"><span style="font-size:15px;font-weight:600">'+x.label+'</span><span style="font-size:12px;color:var(--ink2)">'+x.sub+'</span></button>').join('')+'<button class="btn" id="ck-no">取消</button></div></div>');
    const m=modal(sheet);
    sheet.querySelector('#ck-no').onclick=()=>{closeModal(m);resolve(null);};
    sheet.querySelectorAll('.specopt').forEach(b=>b.onclick=()=>{closeModal(m);resolve(b.dataset.k);});
  });
}
function openTlForm(K,existing){ // 新增/编辑时间轴记录：日期、时间（可选）、内容；工资条另有人工费
  const isNew=!existing;

  const rec=existing||{id:uid(),bucket:K.bucket,title:'',text:'',fee:'',tlDate:todayKey(),tlTime:nowHM(),imageIds:[],createdAt:Date.now()};
  const sheet=h('<div class="sheet"><h3>'+(isNew?'新增'+K.name:'编辑'+K.name)+'</h3>'
    +'<div style="display:flex;gap:10px"><div style="flex:1"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">日期</label><input type="date" class="input" id="tl-date"></div>'
