    +(K.count?'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">'+K.feeLabel+'</label><input type="number" '+(K.statTags?'':'min="0" ')+'step="0.01" class="input" id="tl-fee" placeholder="'+(K.statTags?K.feePlaceholder+'（可输负数减分）':K.feePlaceholder)+'"></div>':'')
    +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">'+K.contentLabel+'</label><textarea class="textarea" id="tl-text" placeholder="'+(K.bucket==='tl-reflect'?'事件结果、导致原因及改进方法':'随便写点什么…')+'"></textarea></div>'
    +(K.statTags
      ?'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">标签（点选分类，可多选）</label><div id="tl-tsel" style="display:flex;flex-wrap:wrap;gap:6px;min-height:26px"></div></div>'
      :'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">标签（点选添加，回车新建，仅编辑页可见）</label><div id="tl-thist" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px"></div><input class="input" id="tl-taginp" placeholder="输入标签，回车添加"><div id="tl-tsel" style="display:flex;flex-wrap:wrap;gap:4px;min-height:26px;margin-top:6px"></div></div>')
    +'<div class="row">'+(isNew?'':'<button class="btn danger" data-x="tldel" style="margin-right:auto">删除</button>')+'<button class="btn" data-x="no">取消</button><button class="btn primary" data-x="ok">保存</button></div></div>');
  const m=modal(sheet);
  sheet.querySelector('#tl-date').value=rec.tlDate||todayKey();
  sheet.querySelector('#tl-time').value=rec.tlTime||'';
  sheet.querySelector('#tl-text').value=rec.text||'';
  // 标签：每条记录可加标签，历史池按项目（bucket）独立存放，互不互通；固定标签项目（如投资自己）只能点选预设标签
  const tsel=(rec.tags||[]).filter(Boolean);
  const tKey='tltag_'+K.bucket;

  function drawTags(){

    if(K.statTags){ // 固定五标签点选，无输入框、无历史池
      K.statTags.forEach(t=>{
        const on=tsel.indexOf(t)>=0;
        const c=h('<button type="button" class="tagchip'+(on?' on':'')+'"></button>');c.textContent=t;
        c.onclick=()=>{const i=tsel.indexOf(t);if(i>=0)tsel.splice(i,1);else tsel.push(t);drawTags();};

      selB.appendChild(c);
    });
    const hB=sheet.querySelector('#tl-thist');hB.innerHTML='';
    const avail=tHist.filter(t=>tsel.indexOf(t)<0);
    if(!avail.length)hB.appendChild(h('<span style="font-size:12px;color:var(--ink2)">该项目暂无历史标签，在下方输入新建</span>'));
    avail.forEach(t=>{
      const c=h('<button type="button" class="tagchip"></button>');c.textContent=t;
      c.onclick=()=>{if(tsel.indexOf(t)<0)tsel.push(t);drawTags();};
      hB.appendChild(c);
    });
  }
  const taginp=sheet.querySelector('#tl-taginp');
  if(taginp)taginp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      const q=e.target.value.trim();
      if(q&&tsel.indexOf(q)<0)tsel.push(q);
      e.target.value='';drawTags();
    }
  });
  if(K.statTags)drawTags();
  else DB.getSetting(tKey,[]).then(v=>{tHist=Array.isArray(v)?v:[];drawTags();});
  if(!K.statTags)drawTags();
  if(K.count)sheet.querySelector('#tl-fee').value=rec.fee!==''&&rec.fee!=null?rec.fee:'';
  const delBtn=sheet.querySelector('[data-x=tldel]');
  if(delBtn)delBtn.onclick=async()=>{
    const y=await confirmBox('删除这条'+K.name+'记录？',{danger:true,okText:'删除'});
    if(y){await DB.del('entries',rec.id);closeModal(m);toast('已删除');Router.refresh();}
  };
  sheet.querySelector('[data-x=no]').onclick=()=>closeModal(m);
  sheet.querySelector('[data-x=ok]').onclick=async()=>{
    const tlDate=sheet.querySelector('#tl-date').value||todayKey();
    const tlTime=sheet.querySelector('#tl-time').value||'';
    const text=sheet.querySelector('#tl-text').value.trim();
    let fee='';
    if(K.count){
      fee=sheet.querySelector('#tl-fee').value;
      if(fee!==''&&isNaN(parseFloat(fee))){toast(K.feeLabel.replace(/（.*）/,'')+'请填数字');return;}
    }
    if(!text&&!(fee!==''&&!isNaN(parseFloat(fee)))){toast('至少写点什么');return;}
    const out={id:rec.id,bucket:K.bucket,title:rec.title||'',text,fee,tlDate,tlTime,imageIds:[...(rec.imageIds||[])],tags:tsel.slice(),createdAt:rec.createdAt||Date.now()};
    if(!K.statTags){ // 固定标签项目不写标签池
      const tpool=await DB.getSetting(tKey,[]);
      let tch=false;
      for(const t of tsel){if(t&&tpool.indexOf(t)<0){tpool.push(t);tch=true;}}
      if(tch)await DB.setSetting(tKey,tpool); // 标签写入本项目池（各项目独立）
    }
    await DB.put('entries',out);
    closeModal(m);
    toast(isNew?'已记录':'已保存');
    Router.refresh();
  };
}
Pages.timelineHub={ // 时间轴首页：反思集 / 工资条 两个项目（风格同图鉴列表）
  async render(){
    await ensureSelfTags(); // 「投资自己」迁移：固定五标签并清旧标签记录
    const el=h('<div><div class="topbar stack"><h1 class="hand" style="font-size:19px">“把日子过成一条线”</h1><div class="tb-tools"><span class="sp"></span><button class="iconbtn" data-x="settings" title="设置">⚙</button></div></div><div class="homeviewlist" id="tlhub-list" style="padding-top:6px"></div></div>');
    el.querySelector('.topbar').after(hinvTabs('tl'));
    el.querySelector('[data-x=settings]').onclick=()=>Router.go('settings');
    const list=el.querySelector('#tlhub-list');
    const reflectAll=await DB.byIndex('entries','bucket','tl-reflect');
    const salaryAll=await DB.byIndex('entries','bucket','tl-salary');
    const ym=todayKey().slice(0,7);
    const monthFee=salaryAll.reduce((s,e)=>{return (e.tlDate||'').indexOf(ym)===0?s+(parseFloat(e.fee)||0):s;},0);
    // 自定义时间轴项目（计数/不计数）
    const customs=(await DB.all('items')).filter(it=>it.kind==='timeline').sort((a,b)=>(a.order||0)-(b.order||0));
    const rows=[
      {key:'reflect',name:'反思集',sub:reflectAll.length+' 条记录',c:'mist',go:()=>Router.go('timeline',{kind:'reflect'}),menu:null},
      {key:'salary',name:'工资条',sub:'本月工资 ¥'+monthFee.toFixed(2).replace(/\.00$/,''),c:'bean',go:()=>Router.go('timeline',{kind:'salary'}),menu:null}
    ];
    for(const it of customs){
      const allE=await DB.byIndex('entries','bucket','tlc-'+it.id);
      let sub;
      if(it.statTags){
        const monthE=allE.filter(e=>(e.tlDate||'').indexOf(ym)===0);
        const sum=monthE.reduce((s,e)=>s+(parseFloat(e.fee)||0),0);
        sub='本月投资自己合计 '+sum.toFixed(2).replace(/\.00$/,'');
      }else if(it.tlKind==='count'){
        const sum=allE.reduce((s,e)=>{return (e.tlDate||'').indexOf(ym)===0?s+(parseFloat(e.fee)||0):s;},0);
        sub='本月合计 '+sum.toFixed(2).replace(/\.00$/,'');
      }else sub=allE.length+' 条记录';
      rows.push({key:it.id,name:it.name,sub,c:(it.tlKind==='count'?'bean':'mist'),go:()=>Router.go('timeline',{kind:it.id}),
        menu:()=>{ // 长按不动弹菜单：删除项目及其全部记录
          const s2=h('<div class="sheet"><h3>'+esc(it.name)+'</h3><div style="display:flex;flex-direction:column;gap:10px"><button class="btn danger" data-m="del">🗑 删除项目</button><button class="btn" data-m="no">取消</button></div></div>');
          const m2=modal(s2);
          s2.querySelector('[data-m=no]').onclick=()=>closeModal(m2);
          s2.querySelector('[data-m=del]').onclick=async()=>{
            closeModal(m2);
            const y=await confirmBox('删除「'+it.name+'」及其全部记录？',{danger:true,okText:'删除'});
            if(!y)return;
            for(const e of await DB.byIndex('entries','bucket','tlc-'+it.id))await DB.del('entries',e.id);
            await DB.del('items',it.id);
            toast('已删除');
            Router.refresh();
          };
        }});
    }
    const savedOrder=await DB.getSetting('tlhub_order',[]);
    if(savedOrder.length){ // 按保存顺序排列，未记录的按默认顺序追加在后
      rows.sort((a,b)=>{const ia=savedOrder.indexOf(a.key),ib=savedOrder.indexOf(b.key);return (ia<0?1000+rows.indexOf(a):ia)-(ib<0?1000+rows.indexOf(b):ib);});
    }
    // 长按拖动排序：长按约450ms抬起卡片→移动换位→松手保存顺序；长按未动=弹菜单（自定义项）
    const rowMenus={};for(const r of rows)rowMenus[r.key]=r.menu;
    let tdrag=null,tsuppress=false;
    list.addEventListener('touchmove',e=>{if(tdrag&&tdrag.lifted)e.preventDefault();},{passive:false});
    list.addEventListener('pointerdown',e=>{
      const card=e.target.closest('.invhubrow');
      if(!card||!list.contains(card))return;
      tdrag={card,sx:e.clientX,sy:e.clientY,moved:false,lifted:false,menu:rowMenus[card.dataset.key],
        lpT:setTimeout(()=>{if(!tdrag)return;tdrag.lifted=true;tdrag.card.classList.add('dragging');try{tdrag.card.setPointerCapture(e.pointerId);}catch(err){}if(navigator.vibrate)navigator.vibrate(20);},450)};
    });
    list.addEventListener('pointermove',e=>{
      if(!tdrag)return;
      if(!tdrag.lifted){ // 未长按就大幅移动：视为滚动，取消拖动
        if(Math.hypot(e.clientX-tdrag.sx,e.clientY-tdrag.sy)<8)return;
        clearTimeout(tdrag.lpT);tdrag=null;return;
      }
      if(!tdrag.moved){
        if(Math.hypot(e.clientX-tdrag.sx,e.clientY-tdrag.sy)<6)return;
        tdrag.moved=true;
      }
      const over=document.elementFromPoint(e.clientX,e.clientY);
      const target=over&&over.closest?over.closest('#tlhub-list .invhubrow'):null;
      if(target&&target!==tdrag.card&&list.contains(target)){
        const rect=target.getBoundingClientRect();
        list.insertBefore(tdrag.card,e.clientY<rect.top+rect.height/2?target:target.nextSibling);
      }
    });
    const endTlDrag=()=>{
      if(!tdrag)return;
      const d=tdrag;tdrag=null;clearTimeout(d.lpT);
      d.card.classList.remove('dragging');
      if(d.moved){ // 松手保存新顺序
        tsuppress=true;setTimeout(()=>{tsuppress=false;},400); // 兜底复位，避免吞掉后续点击
        DB.setSetting('tlhub_order',[...list.querySelectorAll('.invhubrow')].map(c=>c.dataset.key).filter(Boolean));
      }else if(d.lifted&&d.menu){ // 长按未动：弹菜单
        tsuppress=true;setTimeout(()=>{tsuppress=false;},400);
        d.menu();
      }
    };
    list.addEventListener('pointerup',endTlDrag);
    list.addEventListener('pointercancel',endTlDrag);
    for(const r of rows){
      const li=h('<div class="invhubrow" data-key="'+r.key+'" style="--c:var(--'+r.c+')"><div class="ih-main"><div class="ih-name hand">'+esc(r.name)+'</div><div class="ih-sub">'+r.sub+'</div></div><span class="ih-arrow">›</span></div>');
      li.onclick=()=>{if(tsuppress){tsuppress=false;return;}r.go();};
      list.appendChild(li);
    }
    const add=h('<button class="addtile">＋ 新增项目</button>');
    add.onclick=async()=>{
      const v=await promptBox('新增项目名称','',{placeholder:'如 运动里程、读书页数'});
      if(!v)return;
      const k=await chooseTlKind();
      if(!k)return;
      await DB.put('items',{id:uid(),name:v,kind:'timeline',tlKind:k,color:'sand',order:Date.now(),builtin:false});
      toast('已创建「'+v+'」');
      Router.refresh();
    };
    list.appendChild(add);
    // 右滑返回打卡页
    bindSwipeRight(el,()=>Router.go('home'));
    return el;
  }
};
Pages.timeline={ // 时间轴详情：左侧时间 + 竖向轴线 + 右侧内容；计数项目页顶显示本月合计
  async render(p){
    await ensureSelfTags(); // 「投资自己」迁移：固定五标签并清旧标签记录
    let K=await getTlCfg(p&&p.kind);
    if(!K)K=TL_KINDS.reflect;
    const el=h('<div><div class="topbar"><button class="iconbtn" data-act="back">←</button><h1 class="hand">'+esc(K.name)+'</h1></div></div>');
    let all=(await DB.byIndex('entries','bucket',K.bucket));
    all=all.sort((a,b)=>{
      const ka=(a.tlDate||'')+'T'+(a.tlTime||'')+'_'+(a.createdAt||0);
      const kb=(b.tlDate||'')+'T'+(b.tlTime||'')+'_'+(b.createdAt||0);
      return kb.localeCompare(ka); // 新的在上，上下滑动查看
    });
    if(K.count){
      const ym=todayKey().slice(0,7);
      const monthE=all.filter(e=>(e.tlDate||'').indexOf(ym)===0);
      let stat;
      if(K.statTags){ // 按标签分别统计：合计+各标签分项，加分绿/减分红
        const total=monthE.reduce((s,e)=>s+(parseFloat(e.fee)||0),0);
        const parts=K.statTags.map(t=>{
          const v=monthE.filter(e=>(e.tags||[]).indexOf(t)>=0).reduce((s,e)=>s+(parseFloat(e.fee)||0),0);
          return esc(t)+fmtSigned(v);
        }).join('，');
        stat=h('<div class="tl-stat" style="flex-wrap:wrap"><div class="lab" style="font-size:13px;line-height:2">本月'+esc(K.name)+'合计 '+fmtSigned(total)+'，其中 '+parts+'</div></div>');
      }else{
        const monthFee=monthE.reduce((s,e)=>s+(parseFloat(e.fee)||0),0);
        stat=h('<div class="tl-stat"><div class="lab">'+K.statLabel+'</div><div class="val">'+K.statPrefix+monthFee.toFixed(2).replace(/\.00$/,'')+'</div><span style="font-size:11.5px;color:var(--ink2)">'+K.statHint+'</span></div>');
      }
      el.appendChild(stat);
    }
    const list=h('<div class="tl-list"></div>');
    if(!all.length)list.appendChild(h('<div class="empty" style="padding:30px 10px">还没有'+esc(K.name)+'记录<br>点右下角 ＋ 快速添加</div>'));
    for(const e of all){
      const d=e.tlDate||'';
      const time=e.tlTime||'';
      const feeHtml=K.statTags
        ?((parseFloat(e.fee)||0)!==0?'<div class="tl-fee">'+fmtSigned(parseFloat(e.fee))+'</div>':'')
        :(K.count&&parseFloat(e.fee)>0?'<div class="tl-fee">'+K.statPrefix+(Math.round(parseFloat(e.fee)*100)/100)+'</div>':'');
      const item=h('<div class="tl-item"><div class="tl-time"><b></b><span></span></div><div class="tl-mid"><div class="tl-dot"></div></div><div class="tl-body"><span></span>'+feeHtml+'</div></div>');
      item.querySelector('.tl-time b').textContent=d?d.slice(5):'';
      item.querySelector('.tl-time span').textContent=(d?d.slice(0,4):'')+(time?' '+time:'');
      item.querySelector('.tl-body span').textContent=e.text||'（无内容）';
      item.onclick=()=>openTlForm(K,e);
      const timeBox=item.querySelector('.tl-time'); // 双击时间区域：直接复制该条到今天，日期与时间均改为当前时间；单击时间区域不打开编辑
      timeBox.title='双击复制该条（改为当前时间）';
      timeBox.onclick=ev=>ev.stopPropagation();
      const copyToNow=()=>{
        const now=new Date();
        const hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
        const c={id:uid(),bucket:K.bucket,title:e.title||'',text:e.text||'',fee:e.fee||'',tlDate:todayKey(),tlTime:hm,imageIds:[],tags:[...(e.tags||[])],createdAt:Date.now()};
        DB.put('entries',c).then(()=>{toast('已复制到今天 '+hm);Router.refresh();});
      };
      timeBox.ondblclick=ev=>{ev.stopPropagation();copyToNow();};
      let tlLastTap=0; // 移动端双击兜底（部分浏览器双击缩放会吞 dblclick）
      timeBox.addEventListener('touchend',ev=>{
        const t=Date.now();
        if(t-tlLastTap<350){ev.preventDefault();ev.stopPropagation();copyToNow();}
        tlLastTap=t;
      });
      bindLongPress(item,()=>{ // 长按记录弹菜单：编辑 / 复制到今天 / 删除
        const s2=h('<div class="sheet"><h3>'+esc(K.name)+'记录</h3><div style="display:flex;flex-direction:column;gap:10px"><button class="btn" data-m="edit">✏ 编辑</button><button class="btn" data-m="copy">📋 复制到今天</button><button class="btn danger" data-m="del">🗑 删除</button><button class="btn" data-m="no">取消</button></div></div>');
        const m2=modal(s2);
        s2.querySelector('[data-m=no]').onclick=()=>closeModal(m2);
        s2.querySelector('[data-m=edit]').onclick=()=>{closeModal(m2);openTlForm(K,e);};
        s2.querySelector('[data-m=copy]').onclick=async()=>{
          closeModal(m2);
          const c={id:uid(),bucket:K.bucket,title:e.title||'',text:e.text||'',fee:e.fee||'',tlDate:todayKey(),tlTime:e.tlTime||'',imageIds:[],tags:[...(e.tags||[])],createdAt:Date.now()};
          await DB.put('entries',c); // 快速复制：仅日期改为今天，其余（时间/内容/数值）不变
          toast('已复制到今天，可点击编辑调整内容');
          Router.refresh();
        };
        s2.querySelector('[data-m=del]').onclick=async()=>{
          closeModal(m2);
          const y=await confirmBox('删除这条'+K.name+'记录？',{danger:true,okText:'删除'});
          if(y){await DB.del('entries',e.id);toast('已删除');Router.refresh();}
        };
      });
      list.appendChild(item);
    }
    el.appendChild(list);
    const fab=h('<button class="fab" title="快速添加">＋</button>');
    fab.onclick=()=>openTlForm(K,null);
    el.appendChild(fab);
    return el;
  }
};

Pages.settings={
  async render(){
    const st=await Cloud.status();
    const cfg=Cloud.config()||{};
    const statusTxt=!st.enabled?'未配置（离线模式，数据仅存本机）'
      :('已启用 · '+(st.mode==='gh'?('GitHub · '+st.repo):st.base.replace(/^https?:\/\//,'').slice(0,34)+'…')
        +(st.lastErr?(' · 最近错误：'+st.lastErr):'')
        +(st.pending?(' · 待推送 '+st.pending+' 条'):' · 已全部同步'));
    const urlVal=cfg.mode==='gh'?(cfg.token||''):(cfg.base||'');
    const repoVal=cfg.mode==='gh'?(cfg.repo||''):'';
    const el=h('<div><div class="topbar"><button class="iconbtn" data-act="back">←</button><h1 class="hand">设置</h1></div><div style="padding:16px;display:flex;flex-direction:column;gap:12px"><button class="btn primary" id="s-export">📦 导出备份</button><button class="btn" id="s-import">📥 导入备份</button><button class="btn" id="s-merge">🧹 合并重复事项</button><button class="btn danger" id="s-clear">🗑 清空所有数据</button><input type="file" id="s-file" accept=".zip" style="display:none"></div><div style="padding:0 16px 16px" id="s-cloud-box"><div style="font-weight:700;margin-bottom:8px">☁ 云同步</div><div id="s-cloud-status" style="font-size:12px;color:var(--ink2);margin-bottom:8px;line-height:1.6">'+esc(statusTxt)+'</div><input id="s-cloud-url" placeholder="GitHub Token（ghp_…）或云端链接（https://…）" style="width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #d8cfc0;border-radius:8px;font-size:13px;background:#fff" value="'+esc(urlVal)+'"><input id="s-cloud-repo" placeholder="数据仓库名（如 yourname/journal-data）" style="width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #d8cfc0;border-radius:8px;font-size:13px;background:#fff;margin-top:8px;display:none" value="'+esc(repoVal)+'"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" id="s-cloud-save">保存配置</button><button class="btn primary" id="s-cloud-push">⬆ 上传全部到云端</button><button class="btn" id="s-cloud-pull">⬇ 从云端拉取合并</button></div><div style="font-size:11px;color:var(--ink2);margin-top:8px;line-height:1.6">两种云端方式任选其一：① 粘贴 GitHub Token（ghp_ 或 github_pat_ 开头）并填写数据仓库名，数据保存到你自己的 GitHub 私有仓库；② 粘贴 Worker 秘密链接（https 开头）。多设备配置同一云端即可互相同步历史数据。</div></div><div style="padding:0 16px 16px;color:var(--ink2);font-size:12px;line-height:1.7">导出会将所有数据打包为 ZIP 文件，图片以二进制保存。<br>导入时支持「覆盖」和「合并」两种模式。<br>清空会删除所有数据，请谨慎操作。</div></div>');
    el.querySelector('#s-export').onclick=async()=>{await exportAll();toast('已导出');};
    el.querySelector('#s-import').onclick=()=>{el.querySelector('#s-file').click();};
    el.querySelector('#s-file').onchange=async e=>{
      const f=e.target.files[0];if(!f)return;
      const mode=await promptBox('导入模式（输入 overwrite=覆盖 / merge=合并）','merge');
      if(!mode)return;
      const y=await confirmBox('确定导入？这可能会影响现有数据',{danger:true});if(!y)return;
      try{await importAll(f,mode);toast('导入完成');Router.refresh();}
      catch(err){toast('导入失败：'+err.message);}
    };
    el.querySelector('#s-merge').onclick=async()=>{
      const items=(await DB.all('items')).sort((a,b)=>a.order-b.order);
      const groups={};
      for(const it of items){const k=(it.name||'').trim();if(!k)continue;if(!groups[k])groups[k]=[];groups[k].push(it);}
      const dups=Object.keys(groups).filter(k=>groups[k].length>1);
      if(!dups.length){toast('没有发现重复事项');return;}
      let total=0;
      for(const k of dups){
        const g=groups[k];
        g.sort((a,b)=>(b.builtin?1:0)-(a.builtin?1:0)||a.order-b.order||(a.createdAt||0)-(b.createdAt||0));
        const keep=g[0];
        const drop=g.slice(1);
        const y=await confirmBox('「'+k+'」有 '+g.length+' 条重复事项。将保留一条，把其余 '+drop.length+' 条的打卡记录与物品迁移过去并删除。继续？',{okText:'合并'});
        if(!y)continue;
        for(const d of drop){
          const recs=await DB.byIndex('records','itemId',d.id);
          for(const r of recs){
            const ex=await DB.byIndex('records','item_date',[keep.id,r.date]);
            if(ex.length)await DB.del('records',r.id);
            else{r.itemId=keep.id;await DB.put('records',r);}
          }
          const invs=await DB.byIndex('inventory','itemId',d.id);
          for(const o of invs){o.itemId=keep.id;await DB.put('inventory',o);}
          await DB.del('items',d.id);
          total++;
        }
      }
      toast(total?('已合并删除 '+total+' 条重复事项'):'已取消');
      Router.refresh();
    };
    el.querySelector('#s-clear').onclick=async()=>{
      const y1=await confirmBox('⚠ 确定要清空所有数据吗？此操作不可恢复！',{danger:true,okText:'确认清空'});if(!y1)return;
      const y2=await confirmBox('请再次确认：所有打卡记录、图片、阅读、体重等数据都会被删除！',{danger:true,okText:'再次确认清空'});if(!y2)return;
      await clearAllDB();
      toast('已清空所有数据');
      Router.refresh();
    };
    // 云同步
    const refreshStatus=async()=>{
      const s=await Cloud.status();
      el.querySelector('#s-cloud-status').textContent=!s.enabled?'未配置（离线模式，数据仅存本机）'
        :('已启用 · '+(s.mode==='gh'?('GitHub · '+s.repo):s.base.replace(/^https?:\/\//,'').slice(0,34)+'…')
          +(s.lastErr?(' · 最近错误：'+s.lastErr):'')
          +(s.pending?(' · 待推送 '+s.pending+' 条'):' · 已全部同步'));
    };
    const urlInp=el.querySelector('#s-cloud-url');
    const repoInp=el.querySelector('#s-cloud-repo');
    const syncRepoVis=()=>{repoInp.style.display=/^ghp_|^github_pat_/.test(urlInp.value.trim())?'':'none';};
    urlInp.addEventListener('input',syncRepoVis);syncRepoVis();
    el.querySelector('#s-cloud-save').onclick=()=>{
      const v=urlInp.value.trim();

      if(/^ghp_|^github_pat_/.test(v)){

        if(!/^[^\s/]+\/[^\s/]+$/.test(repo)){toast('请填写数据仓库名，格式：用户名/仓库名');return;}
        Cloud.setCfg({mode:'gh',token:v,repo:repo});
      }else if(/^https?:\/\//i.test(v)){
        Cloud.setCfg({mode:'worker',base:v.replace(/\/+$/,'')});
      }else{toast('无法识别：请粘贴 GitHub Token 或 https:// 云端链接');return;}
      Cloud.init();refreshStatus();
      toast('云同步配置已保存');
    };
    el.querySelector('#s-cloud-push').onclick=async()=>{
      if(!Cloud.enabled()){toast('请先保存云端地址');return;}
      const y=await confirmBox('把本机全部数据上传到云端？云端将被本机数据覆盖（合并时间戳 newer-wins）。',{okText:'开始上传'});

      catch(e){toast('上传失败：'+(e&&e.message||e));}
    };
    el.querySelector('#s-cloud-pull').onclick=async()=>{
      if(!Cloud.enabled()){toast('请先保存云端地址');return;}
      const y=await confirmBox('从云端拉取全部数据并与本机合并？（两边都有时保留较新记录）',{okText:'开始拉取'});

      catch(e){toast('拉取失败：'+(e&&e.message||e));}
    };
    return el;
  }
};

Pages.weekStat={
  async render(p){
    // 本周一为起点
    let wkStart=weekStart(todayKey());
    const item=p&&p.itemId?await DB.get('items',p.itemId):null;
    const itemId=item?item.id:null;
    const el=h('<div><div class="topbar"><button class="iconbtn" data-act="back">←</button><button class="iconbtn" data-x="prev">‹</button><h1 class="hand">'+(item?esc(item.name)+' · ':'')+'本周统计</h1><button class="iconbtn" data-x="next">›</button></div><div id="wk-body"></div></div>');
    const body=el.querySelector('#wk-body');
    async function redraw(){
      body.innerHTML='';
      const weekDays=[];
      for(let i=0;i<7;i++)weekDays.push(addDays(wkStart,i));
      const items=[]; // 本周食材标签去重
      for(let i=0;i<7;i++){
        const d=weekDays[i];
        let meals=await DB.byIndex('meals','date',d);
        if(itemId)meals=meals.filter(m=>m.itemId===itemId);
        const bySlot={};for(const m of meals)bySlot[m.slot]=m;
        const card=h('<div class="wcard"><div class="wday">'+cnDay(d)+'（'+['一','二','三','四','五','六','日'][i]+'）</div></div>');
        const dayTags=new Set();
        for(const [slot,label] of MEAL_SLOTS){
          const m=bySlot[slot];
          const ds=m?mealDishes(m):[];
          const txt=ds.length?ds.map(d=>{
            const tags=(d.ing||[]).filter(Boolean);
            return d.name+(tags.length?'（'+tags.join('、')+'）':'');
          }).join('、'):'—';
          if(ds.length){
            for(const dd of ds){
              const tags=(dd.ing||[]).filter(Boolean);
              if(tags.length)tags.forEach(t=>dayTags.add(t));
              else if(dd.name)dayTags.add(dd.name);
            }
          }
          card.appendChild(h('<div class="wmeal">'+label+'：'+esc(txt)+'</div>'));
        }
        dayTags.forEach(t=>{if(!items.includes(t))items.push(t);});
        card.appendChild(h('<div class="wcnt">食材 '+dayTags.size+' 种</div>'));
        body.appendChild(card);
      }
      // 本周食材去重清单
      if(items.length){
        const box=h('<div class="wcard"><div class="wday">本周食材清单（去重）</div></div>');
        box.appendChild(h('<div class="wmeal">'+esc(items.join('、'))+'</div>'));
        body.appendChild(box);
      }else{
        body.appendChild(h('<div class="empty">本周还没有饮食记录</div>'));
      }
    }
    await redraw();
    el.querySelector('[data-x=prev]').onclick=()=>{wkStart=addDays(wkStart,-7);redraw();};
    el.querySelector('[data-x=next]').onclick=()=>{wkStart=addDays(wkStart,7);redraw();};
    return el;
  }
};

  const sheet=h('<div class="sheet"><h3>记一笔食材</h3>'

    +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">总价（元，支持 + - * /，如 12.5+3*2）</label><input class="input" id="gr-total" inputmode="decimal" placeholder="如 15.8 或 12.5+3*2"></div>'
    +'<div style="display:flex;gap:10px;margin:10px 0"><div style="flex:1"><label id="gr-qty-lab" style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">数量（kg）</label><input type="number" step="0.01" min="0" class="input" id="gr-qty" placeholder="如 2"></div>'

    +'<div style="display:flex;gap:10px"><div style="flex:1;margin:10px 0"><label id="gr-price-lab" style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">单价（元/kg，自动算，可改）</label><input type="number" step="0.0001" min="0" class="input" id="gr-price" placeholder="自动计算"></div>'
    +'<div style="flex:1;margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">时间</label><input type="date" class="input" id="gr-date"></div></div>'
    +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">备注</label><input class="input" id="gr-note" placeholder="选填"></div>'

  const tIn=sheet.querySelector('#gr-total'),qIn=sheet.querySelector('#gr-qty'),pIn=sheet.querySelector('#gr-price'),uSel=sheet.querySelector('#gr-unit');
  function exprVal(s){ // 安全计算四则表达式：只允许数字与 + - * / ( ) 和空格
    s=(s||'').trim();

  }

  }
  uSel.onchange=updUnitLab;
  function autoPrice(){ // 总价÷数量 自动填单价
    const t=exprVal(tIn.value),q=parseFloat(qIn.value);
    if(!isNaN(t)&&!isNaN(q)&&q>0)pIn.value=+((t/q).toFixed(4));

    const rec={id:uid(),itemId:itemId||null,name:name,
      total:isNaN(total)?null:+total.toFixed(4),
      qty:qIn.value===''?null:parseFloat(qIn.value),

      unit:uSel.value,
      date:sheet.querySelector('#gr-date').value||todayKey(),
      note:sheet.querySelector('#gr-note').value.trim()};
    await DB.put('groceries',rec);
    closeModal(m);
    toast('已记录');
    onSaved&&onSaved();
  };
}

const FRIDGE_CATS=[['绿叶类',3],['瓜茄类',5],['根茎类',10],['菌菇类',4],['鸡蛋',45],['牛奶',7],['水果类',5]]; // 冷藏类别默认保质期（天）
const FRIDGE_COLORS=['#A98467','#C97B7B','#7A93AC','#8FA68A','#C2A27C','#B08BB5','#7FA0A8','#B5835A','#8A9A7B','#C99A6B'];
function fridgeColor(name){let s=0;for(const ch of String(name||''))s=(s*31+ch.charCodeAt(0))>>>0;return FRIDGE_COLORS[s%FRIDGE_COLORS.length];}
function fmtFrac(v){ // 小数→分数显示：0.5→1/2、0.25→1/4、0.75→3/4
  if(Math.abs(v-Math.round(v))<1e-9)return String(Math.round(v));
  for(const d of [2,3,4,8]){const n=v*d;if(Math.abs(n-Math.round(n))<1e-9)return Math.round(n)+'/'+d;}
  return String(+v.toFixed(2));
}
function parseFrac(s){ // '1/2'→0.5，支持普通数字
  s=String(s||'').trim();
  if(/^\d+\/\d+$/.test(s)){const p=s.split('/');return (+p[1])?(+p[0])/(+p[1]):NaN;}
  const v=parseFloat(s);return isNaN(v)?NaN:v;
}
function fridgeQtyStr(r){return r.qtyUnit==='份'?(fmtFrac(r.qty||0)+' 份'):((r.qty||0)+(r.qtyUnit==='g'?'g':'个'));}
function fridgeEffStatus(r){ // 待消耗且已过保质期 → 自动显示已过期
  if((r.status||'待消耗')==='待消耗'&&r.expireDate&&r.expireDate<todayKey())return '已过期';
  return r.status||'待消耗';
}

    +'<div style="flex:1"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">保质期（天）</label><input type="number" min="1" class="input" id="fd-shelf"></div></div>'
    +'<div style="display:flex;gap:10px;align-items:flex-end;margin:10px 0"><div style="flex:1"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">数量</label><div style="display:flex;gap:6px;align-items:center"><button type="button" class="btn" id="fd-minus" style="padding:6px 12px">−</button><input class="input" id="fd-qty" style="flex:1;text-align:center" inputmode="decimal"><button type="button" class="btn" id="fd-plus" style="padding:6px 12px">＋</button></div></div>'
    +'<div style="flex:none;width:80px"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">单位</label><select class="input" id="fd-unit"><option value="个">个</option><option value="g">g</option><option value="份">几分之一</option></select></div></div>'
    +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">搭配</label><div style="display:flex;gap:8px"><select class="input" id="fd-pair-sel" style="flex:1"></select></div><input class="input" id="fd-pair" placeholder="自定义搭配（选了菜品会自动填入，可改）" style="margin-top:6px"></div>'
    +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">当前状态</label><select class="input" id="fd-status"><option>待消耗</option><option>已用完</option><option>已过期</option><option>已损坏</option></select></div>'
    +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">保存方法</label><input class="input" id="fd-saveway" placeholder="自定义填写，如 密封冷藏、真空包装"></div>'
    +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">处理方式</label><input class="input" id="fd-process" placeholder="自定义填写，如 清洗切段、分装冷冻"></div>'
    +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">做法（可添加多条）</label><div id="fd-ways"></div><button type="button" class="btn" id="fd-addway" style="margin-top:6px">＋ 添加做法</button></div>'
    +(isNew?'':'<div style="font-size:12px;color:var(--ink2)">到期日：'+esc(rec.expireDate||'')+' · 现状态：'+esc(fridgeEffStatus(rec))+'</div>')
    +'<div class="row">'+(isNew?'':'<button class="btn danger" id="fd-del" style="margin-right:auto">删除</button>')+'<button class="btn" data-x="no">取消</button><button class="btn primary" data-x="ok">保存</button></div></div>');
  const m=modal(sheet);
  let curZone=zone;
  const zoneBtns=sheet.querySelectorAll('[data-z]');
  function drawZone(){
    zoneBtns.forEach(b=>b.classList.toggle('on',b.dataset.z===curZone));
    // 冷藏显示类别下拉（含默认天数），冷冻只有自定义
    const catSel=sheet.querySelector('#fd-cat');
    if(curZone==='cold'){
      catSel.innerHTML='<option value="">自定义</option>'+FRIDGE_CATS.map(c=>'<option value="'+c[0]+'" data-days="'+c[1]+'">'+c[0]+'（'+c[1]+'天）</option>').join('');
      sheet.querySelector('#fd-cat-box').style.display='';
    }else{
      sheet.querySelector('#fd-cat-box').style.display='none';
    }
  }
  sheet.querySelector('#fd-name').value=rec.name;
  sheet.querySelector('#fd-added').value=rec.addedDate||todayKey();
  sheet.querySelector('#fd-shelf').value=rec.shelfDays||3;
  sheet.querySelector('#fd-unit').value=rec.qtyUnit||'个';
  sheet.querySelector('#fd-qty').value=rec.qtyUnit==='份'?fmtFrac(rec.qty||0):String(rec.qty!=null?rec.qty:1);
  sheet.querySelector('#fd-pair').value=rec.pair||'';
  sheet.querySelector('#fd-status').value=rec.status||'待消耗';
  sheet.querySelector('#fd-saveway').value=rec.saveWay||'';
  sheet.querySelector('#fd-process').value=rec.process||'';
  // 做法列表：多条自由文本，可增删
  const waysBox=sheet.querySelector('#fd-ways');
  let ways=(rec.ways||[]).slice();
  function drawWays(){
    waysBox.innerHTML='';
    if(!ways.length){waysBox.appendChild(h('<div style="font-size:12px;color:var(--ink2)">暂无做法，点下方按钮添加</div>'));return;}
    ways.forEach((w,i)=>{
      const row=h('<div style="display:flex;gap:6px;margin-bottom:6px"><input class="input fd-way-inp" style="flex:1;min-width:0" placeholder="做法步骤，如 焯水后清蒸"><button type="button" class="btn fd-way-del" style="flex:none;padding:6px 10px;color:var(--danger)">×</button></div>');
      row.querySelector('.fd-way-inp').value=w;
      row.querySelector('.fd-way-inp').addEventListener('input',e=>{ways[i]=e.target.value;});
      row.querySelector('.fd-way-del').onclick=()=>{ways.splice(i,1);drawWays();};
      waysBox.appendChild(row);
    });
  }
  drawWays();
  sheet.querySelector('#fd-addway').onclick=()=>{
    waysBox.querySelectorAll('.fd-way-inp').forEach((inp,i)=>{ways[i]=inp.value;});
    ways.push('');
    drawWays();
    const inps=waysBox.querySelectorAll('.fd-way-inp');
    if(inps.length)inps[inps.length-1].focus();
  };
  drawZone();
  if(rec.cat){const cs=sheet.querySelector('#fd-cat');if(curZone==='cold'&&[...cs.options].some(o=>o.value===rec.cat))cs.value=rec.cat;}
  const qtyIn=sheet.querySelector('#fd-qty'),unitSel=sheet.querySelector('#fd-unit');
  function qtyStep(){return unitSel.value==='个'?1:(unitSel.value==='g'?50:0.5);}
  function showQty(v){qtyIn.value=unitSel.value==='份'?fmtFrac(v):String(Math.round(v*100)/100);}
  function curQty(){const v=parseFrac(qtyIn.value);return isNaN(v)?0:v;}
  sheet.querySelector('#fd-minus').onclick=()=>showQty(Math.max(0,curQty()-qtyStep()));
  sheet.querySelector('#fd-plus').onclick=()=>showQty(curQty()+qtyStep());
  unitSel.onchange=()=>{showQty(curQty());};
  sheet.querySelector('#fd-cat').onchange=e=>{
    const opt=e.target.selectedOptions[0];
    if(opt&&opt.dataset.days)sheet.querySelector('#fd-shelf').value=opt.dataset.days;
  };
  const pairSel=sheet.querySelector('#fd-pair-sel');
  pairSel.innerHTML='<option value="">选择待做菜品…</option><option value="__custom">✎ 自定义</option>'+dishes.map(d=>'<option>'+esc(d)+'</option>').join('');
  pairSel.onchange=()=>{if(pairSel.value&&pairSel.value!=='__custom')sheet.querySelector('#fd-pair').value=pairSel.value;};
  zoneBtns.forEach(b=>b.onclick=()=>{curZone=b.dataset.z;drawZone();});
  sheet.querySelector('[data-x=no]').onclick=()=>closeModal(m);
  const delBtn=sheet.querySelector('#fd-del');
  if(delBtn)delBtn.onclick=async()=>{
    const y=await confirmBox('删除食材「'+esc(rec.name||'未命名')+'」？',{danger:true,okText:'删除'});
    if(y){await DB.del('fridge',rec.id);closeModal(m);toast('已删除');onSaved&&onSaved();}
  };
  sheet.querySelector('[data-x=ok]').onclick=async()=>{
    const name=sheet.querySelector('#fd-name').value.trim();
    if(!name){toast('请填写食材名称');return;}
    waysBox.querySelectorAll('.fd-way-inp').forEach((inp,i)=>{if(ways[i]!=null)ways[i]=inp.value;});
    const waysOut=ways.map(t=>(t||'').trim()).filter(Boolean);
    const added=sheet.querySelector('#fd-added').value||todayKey();
    const shelf=parseInt(sheet.querySelector('#fd-shelf').value,10);
    if(!shelf||shelf<1){toast('请填写保质期天数');return;}
    const out={id:rec.id,itemId,zone:curZone,name,cat:curZone==='cold'?sheet.querySelector('#fd-cat').value:'',
      addedDate:added,shelfDays:shelf,expireDate:addDays(added,shelf),
      qty:Math.max(0,curQty()),qtyUnit:unitSel.value,
      pair:sheet.querySelector('#fd-pair').value.trim(),status:sheet.querySelector('#fd-status').value,
      saveWay:sheet.querySelector('#fd-saveway').value.trim(),process:sheet.querySelector('#fd-process').value.trim(),
      ways:waysOut};
    await DB.put('fridge',out);
    closeModal(m);
    toast(isNew?'已放入'+(ZONE_LAB[curZone]||'食材库'):'已保存');
    onSaved&&onSaved();
  };
}
Pages.fridge={
  async render(p){
    const item=p&&p.itemId?await DB.get('items',p.itemId):null;
    const itemId=item?item.id:null;
    const el=h('<div><div class="topbar"><button class="iconbtn" data-act="back">←</button><h1 class="hand">食材库</h1><button class="iconbtn" data-x="add">＋</button></div><div id="fd-body" style="padding:4px 16px 30px"></div></div>');
    const body=el.querySelector('#fd-body');
    async function drawZoneBox(zone,label,ic){
      let list=(await DB.byIndex('fridge','itemId',itemId)).filter(r=>{
        if(zone==='hist')return (r.status||'待消耗')!=='待消耗'; // 历史区：已用完/已过期/已损坏（非待消耗）
        return (r.zone||'cold')===zone&&(r.status||'待消耗')==='待消耗'; // 四区只显示待消耗（其余进历史区）
      });
      // 排序：待消耗/已过期按到期日升序（最快到期在前），已用完/已损坏沉底
      list=list.sort((a,b)=>{
        const sa=fridgeEffStatus(a),sb=fridgeEffStatus(b);
        const da=(sa==='已用完'||sa==='已损坏')?1:0;
        const db=(sb==='已用完'||sb==='已损坏')?1:0;
        if(da!==db)return da-db;
        const ea=a.expireDate||'9999-12-31',eb=b.expireDate||'9999-12-31';
        return ea.localeCompare(eb)||(a.name||'').localeCompare(b.name||'');
      });
      const box=h('<div class="cal" style="margin:0 0 14px"><div class="cal-head"><div class="cal-title">'+ic+' '+label+'</div><button class="btn" style="padding:5px 12px;font-size:12.5px">添加</button></div><div class="fd-tags" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"></div></div>');
      box.querySelector('.btn').onclick=()=>openFridgeForm(itemId,zone==='hist'?'cold':zone,null,zone==='hist'?{status:'已用完'}:{},draw); // 历史区添加默认状态已用完
      const tags=box.querySelector('.fd-tags');
      if(!list.length)tags.appendChild(h('<div style="font-size:12.5px;color:var(--ink2)">暂无食材</div>'));
      for(const r of list){
        const tag=h('<button type="button" style="max-width:100%;padding:6px 12px;border-radius:999px;color:#fff;text-align:left;box-shadow:var(--shadow)"><span style="font-weight:700"></span></button>');
        tag.querySelector('span').textContent=r.name||'未命名'; // 各区标签只显示名称，单击查看详情，快速点两下进编辑
        tag.style.background=fridgeColor(r.name);
        tag.onclick=()=>openFridgeDetail(r,()=>openFridgeForm(itemId,zone,r,{},draw));
        tags.appendChild(tag);
      }
      body.appendChild(box);
    }
    async function draw(){
      body.innerHTML='';
      await drawZoneBox('cold','冷藏','🧊');
      await drawZoneBox('frozen','冷冻','❄️');
      await drawZoneBox('condiment','调味品','🧂');
      await drawZoneBox('box','纸箱','📦');
      await drawZoneBox('hist','历史','🕘'); // 历史区：消耗过/过期/损坏的食材
    }
    el.querySelector('[data-x=add]').onclick=()=>openFridgeForm(itemId,'cold',null,{},draw);
    await draw();
    return el;
  }
};

Pages.bodyMetrics={
  async render(p){
    const item=p&&p.itemId?await DB.get('items',p.itemId):null;
    const itemId=item?item.id:null;
    const el=h('<div><div class="topbar"><button class="iconbtn" data-act="back">←</button><h1 class="hand">'+(item?esc(item.name)+' · ':'')+'体重三围</h1><button class="iconbtn" data-x="add">＋</button></div><div id="bm-body"></div></div>');
    const body=el.querySelector('#bm-body');
    async function redraw(){
      body.innerHTML='';
      let list=await DB.all('bodyMetrics');
      if(itemId)list=list.filter(x=>x.itemId===itemId);
      list=list.sort((a,b)=>b.date.localeCompare(a.date));
      // 新增表单
      const form=h('<div class="bmform"><div class="field"><label>日期</label><input class="input" id="bm-date"></div><div class="field"><label>体重（kg）</label><input class="input" id="bm-weight" type="number" step="0.1"></div><div class="field"><label>腰围（cm）</label><input class="input" id="bm-waist" type="number" step="0.1"></div><div class="field"><label>胸围（cm）</label><input class="input" id="bm-chest" type="number" step="0.1"></div><div class="field"><label>臀围（cm）</label><input class="input" id="bm-hip" type="number" step="0.1"></div><div class="field"><label>备注</label><input class="input" id="bm-note"></div><div class="btnrow"><button class="btn primary" id="bm-save">保存</button></div></div>');
      form.querySelector('#bm-date').value=todayKey();
      form.querySelector('#bm-save').onclick=async()=>{
        const d=form.querySelector('#bm-date').value;
        if(!d){toast('请填写日期');return;}
        const w=parseFloat(form.querySelector('#bm-weight').value)||0;
        const waist=parseFloat(form.querySelector('#bm-waist').value)||0;
        const chest=parseFloat(form.querySelector('#bm-chest').value)||0;
        const hip=parseFloat(form.querySelector('#bm-hip').value)||0;
        const note=form.querySelector('#bm-note').value;
        // 同日覆盖（只覆盖当前模块自己的记录）
        const existing=await DB.byIndex('bodyMetrics','date',d);
        for(const e of existing){if(!itemId||e.itemId===itemId)await DB.del('bodyMetrics',e.id);}
        await DB.put('bodyMetrics',{id:uid(),itemId:itemId||null,date:d,weight:w,waist,chest,hip,note});
        toast('已保存');redraw();
      };
      body.appendChild(form);
      // 历史记录
      if(!list.length){
        body.appendChild(h('<div class="empty">还没有记录</div>'));
      }else{
        for(const r of list){
          const row=h('<div class="bmrow"><div><div class="bmdate"></div><div></div></div><button class="xdel" style="font-size:12px;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--danger)">删除</button></div>');
          row.querySelector('.bmdate').textContent=r.date;
          const parts=[];
          if(r.weight)parts.push(''+r.weight+'kg');
          if(r.waist)parts.push('腰'+r.waist);
          if(r.chest)parts.push('胸'+r.chest);
          if(r.hip)parts.push('臀'+r.hip);
          if(r.note)parts.push(r.note);
          row.querySelector('div>div:last-child').textContent=parts.join(' · ');
          row.querySelector('button').onclick=async()=>{const y=await confirmBox('删除这条记录？',{danger:true});if(y){await DB.del('bodyMetrics',r.id);redraw();}};
          body.appendChild(row);
        }
      }
    }
    await redraw();
    return el;
  }
};

/* ===== J11 书架页 ===== */
Pages.readShelf={
  async render(p){
    const item=p&&p.itemId?await DB.get('items',p.itemId):null;
    const itemId=item?item.id:null;
    const shelfTitle=item&&item.kind==='custom'?('我的'+item.name):'我的书架';
    let tab='reading';
    let shelfTag='全部';
    const el=h('<div><div class="topbar"><button class="iconbtn" data-act="back">←</button><h1 class="hand">'+esc(shelfTitle)+'</h1><button class="iconbtn plain" id="shelf-mng">管理</button></div><div style="padding:0 16px 8px"><div class="seg" id="shelf-tabs"><button data-t="reading" class="on">在读</button><button data-t="read">已看</button><button data-t="want">想看</button></div></div><div id="shelf-tags" style="padding:0 16px 10px;display:none;gap:8px;flex-wrap:wrap"></div>'+(item&&item.kind==='custom'?'':'<div class="cal" id="excerpt-card" style="margin:0 16px 12px"><div class="cal-head"><div class="cal-title hand">摘抄</div><div id="ex-date" style="font-size:13px;color:var(--ink2)"></div></div><div id="ex-body" style="font-size:14px;line-height:1.8"></div></div>')+'<div class="shelf" id="shelf"></div></div>');
    const shelf=el.querySelector('#shelf');
    const tabs=el.querySelector('#shelf-tabs');
    let shelfManage=false,suppressClick=false;
    // 管理模式：长按拖拽排序 + 隐藏/恢复
    el.querySelector('#shelf-mng').onclick=()=>{shelfManage=!shelfManage;redraw();};
    let sdrag=null;
    shelf.addEventListener('pointerdown',e=>{
      if(!shelfManage)return;
      const card=e.target.closest('.bk');
      if(!card||card.classList.contains('add')||e.target.closest('[data-op=hide]'))return;
      sdrag={card,sx:e.clientX,sy:e.clientY,moved:false};
      try{card.setPointerCapture(e.pointerId);}catch(err){}
    });
    shelf.addEventListener('pointermove',e=>{
      if(!sdrag)return;
      if(!sdrag.moved){
        if(Math.hypot(e.clientX-sdrag.sx,e.clientY-sdrag.sy)<6)return;
        sdrag.moved=true;sdrag.card.classList.add('dragging');
      }
      const over=document.elementFromPoint(e.clientX,e.clientY);
      const t=over&&over.closest?over.closest('.bk'):null;
      if(t&&t!==sdrag.card&&shelf.contains(t)&&!t.classList.contains('add')&&!t.classList.contains('bk-hidden-sec')){
        const r=t.getBoundingClientRect();
        shelf.insertBefore(sdrag.card,e.clientY<r.top+r.height/2?t:t.nextSibling);
      }
    });
    const endShelfDrag=()=>{
      if(!sdrag)return;
      const d=sdrag;sdrag=null;
      d.card.classList.remove('dragging');
      if(!d.moved)return;
      suppressClick=true;setTimeout(()=>suppressClick=false,80);
      persistShelfOrder();
    };
    shelf.addEventListener('pointerup',endShelfDrag);
    shelf.addEventListener('pointercancel',endShelfDrag);
    async function persistShelfOrder(){
      const ids=[...shelf.querySelectorAll('.bk')].filter(c=>!c.classList.contains('add')&&c.dataset.id).map(c=>c.dataset.id);
      for(let i=0;i<ids.length;i++){
        const b=await DB.get('books',ids[i]);
        if(b&&b.order!==i){b.order=i;await DB.put('books',b);}
      }
    }
    tabs.addEventListener('click',e=>{
      const b=e.target.closest('button[data-t]');if(!b)return;
      tab=b.dataset.t;
      tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
      redraw();
    });
    /* ===== 摘抄卡片（仅固定书架）：全部书籍阅读记录的摘抄，按日期为种子每天随机显示一条 ===== */
    const exCard=el.querySelector('#excerpt-card');
    if(exCard){
    (async function drawExcerpt(){
      const tk=todayKey();
      let seed=0;for(const ch of tk)seed=(seed*31+ch.charCodeAt(0))>>>0;
      const all=(await DB.all('records')).filter(r=>r.excerpt);
      exCard.querySelector('#ex-date').textContent=tk.replace(/-/g,'/');
      const body=exCard.querySelector('#ex-body');
      body.innerHTML='';
      if(!all.length){
        body.appendChild(h('<div style="font-size:12.5px;color:var(--ink2)">暂无摘抄 · 打开在读书籍，在「今日阅读」里可以记录摘抄</div>'));
        return;
      }
      const pick=all[seed%all.length];
      let bname='';
      if(pick.bookId){const b=await DB.get('books',pick.bookId);if(b)bname=b.title;}
      const q=h('<div><div class="ex-text" style="color:var(--ink)"></div><div style="margin-top:6px;font-size:12.5px;color:var(--ink2);text-align:right"></div></div>');
      q.querySelector('.ex-text').textContent='「'+pick.excerpt+'」';
      q.querySelector('div:last-child').textContent=(bname?'——《'+bname+'》':'')+(pick.date?(' · '+pick.date):'');
      body.appendChild(q);
    })();
    }
    async function redraw(){
      shelf.innerHTML='';
      if(shelfManage)shelf.appendChild(h('<div style="grid-column:1/-1;font-size:12.5px;color:var(--ink2);padding:2px 2px 0">长按拖动卡片调整顺序，点 ✕ 隐藏</div>'));
      // 摘抄卡片仅在「在读」tab 显示（自定义模块无此卡片）
      if(exCard)exCard.style.display=tab==='reading'?'':'none';
      let allBooks=await DB.all('books');
      if(itemId)allBooks=allBooks.filter(b=>b.itemId===itemId);
      // 排序：order 优先（管理态长按拖拽写入），未设置的按创建时间倒序；隐藏书不在书架显示
      const tabBooks=allBooks.filter(b=>(b.status||'read')===tab&&!b.hidden).sort((a,b)=>((a.order??1e12)-(b.order??1e12))||((b.createdAt||0)-(a.createdAt||0)));
      // 旧数据迁移：首次补 order，保持现有先后
      if(tabBooks.some(b=>b.order==null)){
        tabBooks.forEach((b,i)=>{b.order=i;});
        for(const b of tabBooks)await DB.put('books',b);
      }
      let books=tabBooks;
      if(shelfTag!=='全部')books=tabBooks.filter(b=>(b.tags||[]).includes(shelfTag));

    }

  }
};

/* 解析粘贴的图书信息（支持豆瓣等格式）：作者/译者/出版社/页数/定价/简介 */
function parseBookInfo(text){
  const out={};
  const re=/^[ \t]*(作者|译者|编者|出版社|出品方|出版年|页数|定价|字数|ISBN)[ \t]*[:：][ \t]*(.*)$/gm;
  let m;
  while((m=re.exec(text))){
    const k=m[1],v=(m[2]||'').trim();
    if(!v)continue;
    if(k==='作者'&&!out.author)out.author=v;
    else if((k==='译者'||k==='编者')&&!out.translator)out.translator=v;
    else if(k==='出版社'&&!out.publisher)out.publisher=v;
    else if(k==='页数'&&!out.pages){const n=(v.match(/\d+/)||[])[0];if(n)out.pages=parseInt(n,10);}
    else if(k==='定价'&&!out.price){const n=(v.match(/[\d.]+/)||[])[0];if(n)out.price=parseFloat(n);}
  }
  // 简介：「简介」标题行之后、遇到分隔线或下一个栏目标题前的正文
  const lines=text.split(/\r?\n/);
  const idx=lines.findIndex(l=>/简\s*介/.test(l));
  if(idx>=0){
    const buf=[];
    for(let i=idx+1;i<lines.length;i++){
      const l=lines[i].trim();
      if(!l){if(buf.length&&!buf[buf.length-1])buf.push('');continue;}
      if(/^·( ?·)+/.test(l)||/^(作者|译者|编者|出版社|出品方|出版年|页数|定价|字数|ISBN|目录|豆瓣)[ \t]*[:：]/.test(l))break;
      buf.push(l);
    }
    const s=buf.join('\n').replace(/\n{2,}/g,'\n\n').trim();
    if(s)out.intro=s;
  }
  return out;
}

function dueDaysLeft(due){ // 借阅到期日 'YYYY-MM-DD' → 剩余天数（0=今天到期，负数=已逾期）
  if(!due)return null;
  const d=new Date(due+'T00:00:00');
  const t=new Date(todayKey()+'T00:00:00');
  return Math.round((d-t)/86400000);
}
function dueLabel(due){ // 到期日 → 角标文案
  const n=dueDaysLeft(due);
  if(n===null)return '';
  return n>0?('剩余'+n+'天'):n===0?'今天到期':'已逾期'+(-n)+'天';
}

      drawHistory();
    }
    async function drawHistory(){ // 阅读记录：该书籍历史上每天汇总（日期+当日总时长+读到页数），最近在最上
      const box=bdRtCard.querySelector('#bd-history');
      const rs=(await DB.all('records')).filter(r=>r.bookId===book.id&&r.minutes);
      const byDay={};
      for(const r of rs){
        const d=byDay[r.date]=byDay[r.date]||{m:0,page:null};
        d.m+=r.minutes||0;
        if(r.page&&(!d.page||r.page>d.page))d.page=r.page;
      }
      const days=Object.keys(byDay).sort((a,b)=>b.localeCompare(a));
      box.innerHTML='';
      box.appendChild(h('<div style="font-size:13px;color:var(--ink2);margin-bottom:4px">阅读记录 · 共 '+days.length+' 天</div>'));
      if(!days.length){box.appendChild(h('<div style="font-size:12.5px;color:var(--ink2)">还没有阅读记录</div>'));return;}
      for(const d of days.slice(0,60)){
        const row=h('<div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0"></div>');
        const t1=h('<span style="flex:none"></span>');t1.textContent=d;
        const t2=h('<span style="color:var(--ink2);text-align:right;min-width:0"></span>');
        t2.textContent=byDay[d].m+' 分钟'+(byDay[d].page?(' · 读到第 '+byDay[d].page+' 页'):'');
        row.appendChild(t1);row.appendChild(t2);
        box.appendChild(row);
      }
      if(days.length>60)box.appendChild(h('<div style="font-size:12px;color:var(--ink2)">仅显示最近 60 天</div>'));
    }
    bdRtCard.querySelector('#bd-rt-start').onclick=()=>{
      const btn=bdRtCard.querySelector('#bd-rt-start');
      if(bdRtStart){
        const sec=Math.round((Date.now()-bdRtStart)/1000);
        clearInterval(bdRtTick);bdRtStart=null;bdRtTick=null;
        btn.textContent='开始计时';btn.classList.add('primary');
        bdSaveRead(Math.max(1,Math.round(sec/60)),'计时');
      }else{
        bdRtStart=Date.now();
        btn.classList.remove('primary');
        btn.textContent='结束 '+bdRtFmt(0);
        bdRtTick=setInterval(()=>{
          if(!document.contains(btn)){clearInterval(bdRtTick);bdRtStart=null;bdRtTick=null;return;}
          btn.textContent='结束 '+bdRtFmt(Math.floor((Date.now()-bdRtStart)/1000));
        },1000);
      }
    };
    bdRtCard.querySelector('#bd-rt-add').onclick=async()=>{
      const v=await promptBox('补录时长（分钟）','',{placeholder:'如 30'});
      const n=parseInt(v,10);
      if(!n||n<=0)return;
      bdSaveRead(Math.min(n,1440),'补录');
    };
    // 今日摘抄：与阅读记录同库存储（excerpt 字段），书架「摘抄」卡片每日随机展示
    bdRtCard.querySelector('#bd-excerpt-save').onclick=async()=>{
      const v=bdRtCard.querySelector('#bd-excerpt').value.trim();
      if(!v){toast('请先输入摘抄内容');return;}
      await DB.put('records',{id:uid(),itemId:book.itemId||null,bookId:book.id,date:todayKey(),text:'摘抄',excerpt:v,imageIds:[],minutes:null,createdAt:Date.now(),updatedAt:Date.now()});
      bdRtCard.querySelector('#bd-excerpt').value='';
      const sv=bdRtCard.querySelector('#bd-ex-saved');sv.classList.add('show');setTimeout(()=>sv.classList.remove('show'),1500);
      toast('已保存摘抄');
    };
    // 读到第几页（累计进度，随记录保存）
    const pageInp=el.querySelector('#bd-page');
    pageInp.value=book.currentPage||'';
    el.querySelector('#bd-page-save').onclick=async()=>{
      const n=parseInt(pageInp.value,10);
      if(!n||n<=0){toast('请填写页数');return;}
      book.currentPage=n;await DB.put('books',book);
      const sv=el.querySelector('#bd-page-saved');sv.classList.add('show');setTimeout(()=>sv.classList.remove('show'),1500);
    };
    // 读到第几章 / 章节名称（存 book.currentChapter，位于保存页数行下方）
    const chapInp=el.querySelector('#bd-chapter');
    chapInp.value=book.currentChapter||'';
    el.querySelector('#bd-chapter-save').onclick=async()=>{
      const v=chapInp.value.trim();
      book.currentChapter=v;
      await DB.put('books',book);
      const sv=el.querySelector('#bd-chapter-saved');sv.classList.add('show');setTimeout(()=>sv.classList.remove('show'),1500);
      toast(v?'已保存章节':'已清空章节');
    };
    bdRtRedraw();
    // 图书信息字段：默认仅 作者/完成日期；可自定义添加字段，字段可重命名/删除
    function bdFields(){
      if(!Array.isArray(book.fields)){
        // 旧数据迁移：译者/出版社/页数/定价有值转为自定义字段（沿用旧 key），空的丢弃
        const extra=[];
        for(const [k,lab] of [['translator','译者'],['publisher','出版社'],['pages','页数'],['price','定价']]){
          const v=book[k];
          if(v!==undefined&&v!==null&&v!=='')extra.push({key:k,label:lab,type:'text'});
        }
        book.fields=[{key:'author',label:'作者',type:'text'},{key:'finishDate',label:'完成日期',type:'date'},...extra];
        delete book.bdHidden;
        DB.put('books',book);
      }
      return book.fields;
    }
    const fieldsBox=el.querySelector('#bd-fields');
    function drawFields(){
      fieldsBox.innerHTML='';
      for(const f of bdFields()){
        const row=h('<div class="bd-frow" style="display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer"><span class="bd-flab" title="点击重命名" style="font-size:13px;color:var(--ink2);flex:none;min-width:60px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><span class="bd-fval" style="flex:1;min-width:0;font-size:14px;color:var(--ink2)"></span><span data-op="del" title="删除字段" style="color:var(--ink2);font-size:13px;flex:none;padding:0 4px">✕</span></div>');
        row.querySelector('.bd-flab').textContent=f.label;
        const val=row.querySelector('.bd-fval');
        const v=book[f.key];
        if(v){val.textContent=v;val.style.color='var(--ink)';}else val.textContent='未填写';
        row.querySelector('[data-op=del]').onclick=async e=>{
          e.stopPropagation();
          const y=await confirmBox('删除「'+f.label+'」字段及其内容？',{danger:true,okText:'删除'});
          if(y){book.fields=bdFields().filter(x=>x.key!==f.key);delete book[f.key];await DB.put('books',book);drawFields();}
        };
        row.querySelector('.bd-flab').onclick=e=>{e.stopPropagation();renameField(f);};
        row.onclick=()=>editBookField(f);
        fieldsBox.appendChild(row);
      }
      // 添加信息行：输入自定义字段名
      const add=h('<div id="bd-addfield" style="display:flex;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--coffee);font-size:13.5px"></div>');
      add.textContent='＋ 添加信息';
      add.onclick=async()=>{
        const v=await promptBox('字段名称','',{placeholder:'如 译者、出版社'});
        if(!v)return;
        if(bdFields().some(x=>x.label===v)){toast('已有同名字段');return;}
        book.fields=bdFields().concat([{key:'f_'+uid(),label:v,type:'text'}]);
        await DB.put('books',book);
        drawFields();
      };
      fieldsBox.appendChild(add);
    }
    async function renameField(f){
      const v=await promptBox('重命名字段',f.label);
      if(!v||v===f.label)return;
      f.label=v;await DB.put('books',book);drawFields();
    }
    function editBookField(f){
      const isDate=f.type==='date';
      const s=h('<div class="sheet"><h3>'+esc(f.label)+'</h3><div style="margin:10px 0">'+(isDate?'<input type="date" class="input" id="bd-finp">':'<input class="input" id="bd-finp" placeholder="填写'+esc(f.label)+'…">')+'</div><div class="row"><button class="btn" data-x="no">清除</button><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存</button></div></div>');
      const inp=s.querySelector('#bd-finp');
      inp.value=(book[f.key]==null?'':book[f.key]);
      const m=modal(s);
      s.querySelector('[data-x=cancel]').onclick=()=>closeModal(m);
      s.querySelector('[data-x=no]').onclick=async()=>{delete book[f.key];await DB.put('books',book);closeModal(m);drawFields();};
      s.querySelector('[data-x=ok]').onclick=async()=>{
        const v=(inp.value||'').trim();
        if(!v)delete book[f.key];
        else book[f.key]=v;
        await DB.put('books',book);
        closeModal(m);
        drawFields();
      };
    }
    drawFields();
    // 标签（自由标签，书架可按标签筛选）
    const tagsBox=el.querySelector('#bd-tags');
    function drawTags(){
      tagsBox.innerHTML='';
      const tags=book.tags||[];
      tags.forEach(t=>{
        const c=h('<button class="btn" style="padding:5px 12px;font-size:13px"></button>');
        c.textContent='🏷 '+t;
        c.onclick=()=>openTagEditor();
        tagsBox.appendChild(c);
      });
      const add=h('<button class="btn" style="padding:6px 12px;font-size:13px;color:var(--ink2);box-shadow:none;background:var(--bg)"></button>');
      add.textContent=tags.length?'＋':'🏷 添加标签';
      add.onclick=()=>openTagEditor();
      tagsBox.appendChild(add);
    }
    async function openTagEditor(){
      const all=(await DB.all('books')).filter(b=>b.itemId===book.itemId).flatMap(b=>b.tags||[]);
      const poolArr=[...new Set(all)].sort();
      const cur=new Set(book.tags||[]);
      const s=h('<div class="sheet"><h3>标签</h3><div id="tg-pool" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"></div><div style="margin-bottom:4px"><input class="input" id="tg-inp" placeholder="新标签，如 小说"></div><div class="row"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">完成</button></div></div>');
      const pool=s.querySelector('#tg-pool');
      function drawPool(){
        pool.innerHTML='';
        if(!poolArr.length){pool.appendChild(h('<span style="font-size:12.5px;color:var(--ink2)">暂无历史标签，可输入新标签</span>'));return;}
        poolArr.forEach(t=>{
          const on=cur.has(t);
          const c=h('<button class="btn" style="padding:5px 12px;font-size:13px"></button>');
          c.textContent=t+(on?' ✓':'');
          if(on){c.style.background='var(--coffee)';c.style.color='#fff';}
          c.onclick=()=>{if(on)cur.delete(t);else cur.add(t);drawPool();};
          pool.appendChild(c);
        });
      }
      function addNew(){
        const v=(s.querySelector('#tg-inp').value||'').trim();
        if(!v)return;
        if(!poolArr.includes(v))poolArr.push(v);
        cur.add(v);
        s.querySelector('#tg-inp').value='';
        drawPool();
      }
      s.querySelector('#tg-inp').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addNew();}};
      drawPool();
      const m=modal(s);
      s.querySelector('[data-x=cancel]').onclick=()=>closeModal(m);
      s.querySelector('[data-x=ok]').onclick=async()=>{
        addNew();
        book.tags=[...cur];
        await DB.put('books',book);
        closeModal(m);
        drawTags();
        toast('标签已保存');
      };
    }
    drawTags();
    // 简介 autosave
    const introTa=el.querySelector('#bd-intro');
    introTa.value=book.intro||'';
    bindAutosave(introTa,async v=>{book.intro=v;await DB.put('books',book);});
    // 粘贴识别：解析后自动填充，识别出的字段无对应则自动创建同名字段
    el.querySelector('#bd-parse').onclick=async()=>{
      const txt=el.querySelector('#bd-paste').value.trim();
      if(!txt){toast('请先粘贴图书信息');return;}
      const info=parseBookInfo(txt);
      const names={author:'作者',translator:'译者',publisher:'出版社',pages:'页数',price:'定价',intro:'简介'};
      const hits=Object.keys(names).filter(k=>info[k]);
      if(!hits.length){toast('未识别到图书信息，请检查内容');return;}
      for(const k of hits){
        if(k==='intro')continue;
        let f=bdFields().find(x=>x.key===k||x.label===names[k]);
        if(!f){f={key:k,label:names[k],type:'text'};book.fields=bdFields().concat([f]);}
        book[f.key]=info[k];
      }
      await DB.put('books',book);
      drawFields();
      if(info.intro)introTa.value=info.intro;
      el.querySelector('#bd-paste').value='';
      toast('已识别并填充：'+hits.map(k=>names[k]).join('、'));
    };
    // 读后感 autosave
    const ta=el.querySelector('#bd-review');
    ta.value=book.review||'';
    bindAutosave(ta,async v=>{book.review=v;await DB.put('books',book);});
    // 标题编辑
    el.querySelector('#bd-title').style.cursor='pointer';
    el.querySelector('#bd-title').onclick=async()=>{const v=await promptBox('书名',book.title);if(v&&v!==book.title){book.title=v;el.querySelector('#bd-title').textContent=v;await DB.put('books',book);}};
    // 删除
    el.querySelector('#bd-del').onclick=async()=>{
      const y=await confirmBox('删除「'+book.title+'」？',{danger:true});
      if(y){
        if(book.coverId)await DB.del('images',book.coverId);
        await DB.del('books',book.id);
        Router.back();
      }
    };
    return el;
  }
};

/* ===== J15 播种与启动 ===== */
const SEED=[
  {name:'饮食',kind:'eat',color:'bean'},
  {name:'缝纫',kind:'sew',color:'coffee'},
  {name:'运动',kind:'sport',color:'mist'},
  {name:'阅读',kind:'read',color:'sand'},
  {name:'技能',kind:'skill',color:'sage'},
];
async function seedIfEmpty(){
  if(await DB.count('items')>0)return;
  let o=0;
  for(const s of SEED){
    await DB.put('items',{id:uid(),name:s.name,kind:s.kind,color:s.color,order:o++,
      shortGoal:'',longGoal:'',remindOn:false,remindTime:'21:00',builtin:true});
  }
  await DB.setSetting('schemaVersion',1);
}
async function ensureBuiltin(){ // 固定模块自愈：缺失时优先把同名自定义事项升级为固定模块（保留其记录），否则重新补种
  const items=await DB.all('items');
  const max=items.reduce((m,i)=>Math.max(m,i.order),-1);
  let n=max;
  for(const s of SEED){
    const cands=items.filter(it=>(it.kind==='custom'?(it.specKind||'none'):it.kind)===s.kind);
    if(cands.some(it=>it.builtin))continue;
    const up=cands.find(it=>(it.name||'').trim()===s.name);
    if(up){
      delete up.specKind;up.kind=s.kind;up.builtin=true;up.updatedAt=Date.now();
      await DB.put('items',up);
    }else{
      await DB.put('items',{id:uid(),name:s.name,kind:s.kind,color:s.color,order:++n,shortGoal:'',longGoal:'',remindOn:false,remindTime:'21:00',builtin:true});
    }
  }
}
async function migrateOwnership(){ // 数据归属隔离：历史无 itemId 的共享记录归固定模块，自定义模块数据保持空白
  const items=await DB.all('items');
  const fixed={};for(const it of items)if(it.builtin)fixed[it.kind]=it.id;
  const map={meals:'eat',groceries:'eat',exercises:'sport',bodyMetrics:'sport',books:'read',skills:'skill'};
  for(const [store,kind] of Object.entries(map)){
    if(!fixed[kind])continue;
    for(const r of await DB.all(store)){
      if(!r.itemId){r.itemId=fixed[kind];await DB.put(store,r);}
    }
  }
}
async function purgeDishTodo(){ // 彻底下线「待做饮食」：清理历史文件夹条目数据
  for(const e of await DB.all('entries')){
    if(e.bucket==='dish-todo'||(e.bucket||'').endsWith('-dish-todo'))await DB.del('entries',e.id);
  }
}
async function moveEatFirst(){ // 一次性：打卡页「饮食」调整到第一条（此后仍可在管理模式自由拖动）
  if(await DB.getSetting('eatFirstDone',0))return;
  const items=await DB.all('items');
  const eat=items.find(it=>it.builtin&&it.kind==='eat');
  if(eat){
    const min=items.reduce((m,i)=>Math.min(m,i.order),0);
    if(eat.order!==min){eat.order=min-1;await DB.put('items',eat);}
  }
  await DB.setSetting('eatFirstDone',1);
}
(async function boot(){
  try{await DB.open();}
  catch(e){
    document.body.innerHTML='<div style="padding:40px 24px;text-align:center">浏览器本地存储（IndexedDB）不可用，无法运行。<br>请使用 Chrome / Edge 浏览器打开本文件。</div>';
    return;
  }
  await seedIfEmpty();
  await ensureBuiltin();
  await migrateOwnership();
  await purgeDishTodo();
  await moveEatFirst();
  Router.start();
})();

/* ===== J16 提醒调度器 ===== */
const __lastFired={}; // itemId -> dateString（今日已触发过）
(async function startReminder(){
  try{
    const items=await DB.all('items');
    let notifSupported=('Notification' in window);
    if(notifSupported&&Notification.permission==='default'){
      try{await Notification.requestPermission();}catch(e){}
    }
    setInterval(async()=>{
      try{
        const now=nowHM();
        const today=todayKey();
        const its=await DB.all('items');
        for(const it of its){
          if(!it.remindOn||!it.remindTime)continue;
          if(it.remindTime!==now)continue;
          if(__lastFired[it.id]===today)continue; // 今天已经触发过
          __lastFired[it.id]=today;
          // 触发提醒
          const msg='该打卡了：'+it.name;
          if(notifSupported&&Notification.permission==='granted'){
            try{new Notification('生活手帐',{body:msg});}catch(e){toast(msg);}
          }else{
            toast(msg);
          }
        }
      }catch(e){}
    },30000); // 每30秒检查一次
  }catch(e){}
})();

/* ===== 云同步启动（配置了云端地址才生效）===== */
try{Cloud.init();}catch(e){}

/* ===== 测试钩子（自动化测试用，不影响功能） ===== */
window.__jt={DB,Router,Pages,Cloud,computeStreak,todayKey,addDays,uid,toast,confirmBox,promptBox,seedIfEmpty,esc,persistOrder,deleteItemCascade,Img,getRecord,saveRec,
  makeTestImage:async()=>{const cv=document.createElement('canvas');cv.width=40;cv.height=40;const g=cv.getContext('2d');g.fillStyle='#C97B7B';g.fillRect(0,0,40,40);const blob=await new Promise(r=>cv.toBlob(r,'image/png'));return Img.store(blob);}};
</script>
