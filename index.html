<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>生活手帐</title>
<style>
/* ===== S1 设计令牌与全局 ===== */
:root{
  --bg:#FAF6EF; --card:#FFFFFF; --ink:#4A3F35; --ink2:#9A8A78; --line:#EFE6D9;
  --coffee:#A98467; --bean:#C97B7B; --mist:#7A93AC; --sage:#8FA68A; --sand:#C2A27C;
  --ok:#5F8A5F; --danger:#C05A5A;
  --shadow:0 4px 16px rgba(74,63,53,.08); --shadow2:0 10px 30px rgba(74,63,53,.16);
  --r:16px; --rs:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:var(--ink)}
.hand{font-family:'Kaiti SC','STKaiti','KaiTi','DFKai-SB','楷体','Noto Serif SC',serif}

/* ===== S2 通用组件 ===== */
.topbar{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.topbar h1{font-size:22px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar.stack{display:block}
.topbar.stack h1{flex:none;overflow:visible;text-overflow:clip;white-space:normal;line-height:1.4}
.tb-tools{display:flex;align-items:center;gap:8px;margin-top:8px}
.tb-tools .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--shadow);font-size:16px;flex:none}
.iconbtn:active{transform:scale(.94)}
.iconbtn.plain{background:none;box-shadow:none;width:auto;min-width:38px}
.spec-top{display:flex;gap:6px;align-items:center;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px}
.btn.primary{background:var(--coffee);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.input,.textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--rs);padding:9px 12px;background:#fff;outline:none}
.input:focus,.textarea:focus{border-color:var(--coffee)}
.textarea{resize:vertical;min-height:84px;line-height:1.7}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px}
.mask{position:fixed;inset:0;background:rgba(74,63,53,.38);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;animation:fade .15s}
.sheet{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow2);padding:20px;width:100%;max-width:360px}
.sheet h3{margin:0 0 14px;font-size:17px}
.sheet .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
@keyframes fade{from{opacity:0}}
#toast-root{position:fixed;left:0;right:0;bottom:40px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none}
.toast{background:rgba(74,63,53,.92);color:#fff;padding:8px 16px;border-radius:999px;font-size:13.5px;animation:tin .2s;max-width:86vw}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.empty{color:var(--ink2);text-align:center;padding:30px 10px;font-size:14px}
.saved{font-size:12px;color:var(--ok);opacity:0;transition:opacity .3s;margin-left:8px;flex:none}
.saved.show{opacity:1}
.listitem{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;width:100%;text-align:left}
.listitem .li-main{flex:1;min-width:0}
.listitem .li-title{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listitem .li-sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.seg{display:inline-flex;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:999px;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--coffee);color:#fff}
.fab{position:fixed;right:20px;bottom:26px;width:54px;height:54px;border-radius:50%;background:var(--coffee);color:#fff;font-size:26px;box-shadow:var(--shadow2);display:flex;align-items:center;justify-content:center;z-index:20}
.fab:active{transform:scale(.94)}

/* ===== S3 页面样式 ===== */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:8px 16px 26px}
.hcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 12px;border-top:4px solid var(--c,var(--coffee));text-align:left;width:100%;cursor:pointer}
.hcard:active{transform:scale(.98)}
.hcard .nm{font-size:19px}
.hcard .st{font-size:12.5px;color:var(--ink2);margin-top:6px}
.hcard .st.ok{color:var(--ok)}
.hcard.manage{touch-action:none;cursor:grab}
.hcard .ops{display:none;gap:6px;margin-top:10px}
.hcard.manage .ops{display:flex}
.hcard .ops button{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--bg);box-shadow:var(--shadow)}
.hcard .ops button.xdel{color:var(--danger)}
.hcard.dragging{opacity:.9;transform:scale(1.04);box-shadow:var(--shadow2);position:relative;z-index:5}
.addtile{grid-column:1/-1;border:2px dashed #D8CCBA;border-radius:var(--r);padding:14px;color:var(--ink2);font-size:14px;text-align:center;background:none}
.homeviewlist{display:flex;flex-direction:column;gap:10px;padding:8px 16px 26px}
.hlistitem{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;border-left:4px solid var(--c,var(--coffee))}
.hlistitem .licheck{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px}
.hlistitem .licheck.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.hlistitem .libody{flex:1;min-width:0}
.hlistitem .liname{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hlistitem .list{font-size:12.5px;color:var(--ink2);margin-top:3px}
.hlistitem .list.ok{color:var(--ok)}
.grid.managing{gap:14px}
.goals{display:grid;gap:10px;padding:0 16px 14px}
.goal{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 14px;position:relative;overflow:hidden;transition:transform .2s}
.goal .ghead{display:flex;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:0}
.goal .goal-row{display:flex;align-items:center;gap:10px}
.goal .goal-row input{flex:1;border:none;background:none;padding:4px 0;font-size:15px;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal.del{transform:translateX(-100%);opacity:.5}
.goal .ghead label{flex:1}
.goal .textarea{min-height:42px;border:none;padding:2px 0;background:none;resize:none}
.goal .textarea:focus{border:none}
.goal .gtext{flex:1;min-width:0;font-size:15px;line-height:1.6;word-break:break-word}
.gleft{flex:none;font-size:12.5px;color:var(--ink2);white-space:nowrap;margin-left:8px}
.gleft b{font-weight:800;color:var(--ink);font-size:14px}
.cal{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin:0 16px 14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-title{font-size:16.5px}
.cal-nav{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:18px}
.cal-weekrow,.cal-days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal-weekrow span{font-size:12px;color:var(--ink2);padding:4px 0}
.cal-days button{position:relative;height:40px;font-size:14.5px;border-radius:10px}
.cal-days button:active{background:var(--bg)}
.cal-days button.mk{color:var(--bean);font-weight:600}
.cal-days button.today{font-weight:700}
.cal-days .cic{display:flex;justify-content:center;line-height:0;color:#C9BBA8;margin-top:1px}
.cal-days .cic svg{width:13px;height:13px}
.spec{padding:0 16px 30px}
.spec .cal{margin-left:0;margin-right:0}
.spec-head{display:flex;align-items:center;gap:8px;margin:4px 0 10px;flex-wrap:wrap}
.spec-head .sp{flex:1;font-size:15px}
.daybody{padding:0 16px 30px}
.imggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.imgcell{position:relative;aspect-ratio:1;border-radius:var(--rs);overflow:hidden;background:var(--bg);box-shadow:var(--shadow)}
.imgcell img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.imgcell.add{display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:24px;border:2px dashed #D8CCBA;background:none;box-shadow:none;cursor:pointer}
.imgdel{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(74,63,53,.75);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2}
.viewer{position:fixed;inset:0;background:rgba(30,25,20,.93);z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;animation:fade .15s}
.viewer img{max-width:92vw;max-height:76vh;border-radius:8px}
.viewer .vbar{display:flex;gap:30px;margin-top:16px;color:#fff;font-size:26px;align-items:center}
.viewer .vbar button{color:#fff;font-size:26px}
.viewer .vbar button.close{font-size:15px;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:5px 14px}
/* ===== 文件夹与条目 ===== */
.entlist{padding:4px 16px 100px;display:flex;flex-direction:column;gap:12px}
.ent{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.ent .thumb{width:64px;height:64px;border-radius:var(--rs);background:var(--bg);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:22px}
.ent .thumb img{width:100%;height:100%;object-fit:cover}
.ent .ebody{flex:1;min-width:0}
.ent .etitle{font-size:15.5px;margin-bottom:3px}
.ent .etext{font-size:13px;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ent .eop{display:flex;gap:6px;margin-top:6px}
.ent .eop button{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--bg)}
.ent .eop button.del{color:var(--danger)}
.emptopbar{padding:14px 16px 8px}
.editor{padding:4px 16px 30px}
.editor .btnrow{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
/* ===== 饮食四餐样式 ===== */
.mealrow{background:var(--card);border-radius:var(--rs);box-shadow:var(--shadow);padding:10px 12px;margin-bottom:10px}
.mealrow .mlabel{font-size:13px;color:var(--ink2);margin-bottom:4px}
.mealpic{width:34px;height:34px;border-radius:8px;object-fit:cover;box-shadow:var(--shadow);cursor:pointer}
.picadd{font-size:11.5px;color:var(--coffee);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 8px;line-height:1;white-space:nowrap}
.mealrow textarea{border:none;box-shadow:none;padding:0;resize:none;min-height:50px}
.ksum{background:var(--card);border-radius:var(--rs);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:14px;text-align:center;font-size:14.5px;color:var(--bean)}
/* ===== 饮食菜名与食材标签 ===== */
.mealrow .dishlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.dishchip{background:var(--bg);border-radius:8px;padding:5px 9px;font-size:13.5px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;box-shadow:var(--shadow);text-align:left}
.dishchip .dn{font-size:13.5px;color:var(--ink)}
.dishchip .dtag{font-size:11px;color:var(--ink2)}
.dishchip .dprice{font-size:11px;color:var(--bean)}
/* ===== 饮食开销页 ===== */
.fmonth{text-align:center;font-size:13.5px;color:var(--ink2);margin:10px 0 8px}
.fchead{display:flex;gap:10px;margin-bottom:12px}
.fccard{flex:1;background:var(--card);border-radius:var(--rs);box-shadow:var(--shadow);padding:12px 10px;text-align:center}
.fclabel{font-size:12px;color:var(--ink2);margin-bottom:4px}
.fcnum{font-size:19px;font-weight:700;color:var(--bean)}
.fcrow{display:flex;justify-content:space-between;font-size:13px;padding:7px 2px;border-bottom:1px solid var(--line);color:var(--ink)}
.dishaddbtn{font-size:12.5px;color:var(--coffee);padding:3px 0}
.tagchip{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink2)}
.tagchip.on{background:var(--bean);border-color:var(--bean);color:#fff}
/* ===== 图鉴单独页 ===== */
.invhubrow{background:var(--card);border-radius:var(--rs);box-shadow:var(--shadow);padding:14px 16px;display:flex;align-items:center;gap:10px;border-left:4px solid var(--c)}
.invhubrow .ih-main{flex:1;min-width:0}
.invhubrow .ih-name{font-size:15.5px;font-weight:600;color:var(--ink)}
.invhubrow .ih-sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.invhubrow .ih-arrow{color:var(--ink2);font-size:18px}
/* ===== 打卡⇄图鉴滑动切换开关 ===== */
.hinv-toggle{position:relative;width:78px;height:30px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:space-between;padding:0 9px;flex:none;box-shadow:var(--shadow);cursor:pointer}
.hinv-toggle .ht-lab{font-size:10.5px;color:var(--ink2);line-height:1;user-select:none}
.hinv-toggle .ht-knob{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--bean);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;transition:transform .18s ease;z-index:2}
.hinv-toggle .ht-dot{width:12px;height:12px;border-radius:50%;background:#fff;opacity:.45}
.hinv-toggle.on .ht-knob{transform:translateX(48px)}
.exrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.exrow input{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;outline:none}
.exrow input:focus{border-color:var(--mist)}
.exlist{margin-top:10px}
.exlist .exitem{background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.exlist .exitem button{font-size:12px;color:var(--danger)}
/* ===== 技能大加号添加框 ===== */
.skill-add{width:100%;border:2px dashed #D8CCBA;border-radius:var(--r);padding:24px 14px;margin-top:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink2);font-size:13.5px;background:none}
.skill-add .plus{font-size:38px;line-height:1;color:#C9BBA8}
.skill-add:active{transform:scale(.98)}
/* ===== 书架 ===== */
.shelf{padding:4px 16px 120px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shelf .bk{aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;text-align:left;width:100%}
.shelf .bk img{flex:1;width:100%;object-fit:cover;display:block}
.shelf .bk .bn{padding:5px 6px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelf .bk.add{border:2px dashed #D8CCBA;box-shadow:none;background:none;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:28px;cursor:pointer}
.stars{display:flex;gap:6px;font-size:28px}
.stars button{color:#D8CCBA}
.stars button.on{color:var(--sand)}
/* ===== 物品图鉴 ===== */
.inv-tags{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 2px}
.inv-tags button{flex:none;border:1.5px solid var(--line);border-radius:999px;background:#fff;padding:5px 12px;font-size:13px;color:var(--ink2)}
.inv-tags button.on{background:var(--bean);border-color:var(--bean);color:#fff}
.inv-grid{padding:10px 16px 120px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.inv-slot{display:flex;flex-direction:column;gap:3px;min-width:0}
.inv-slot .sno{font-size:11px;font-weight:700;color:var(--bean)}
.inv-cell{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card);border:2px solid #000;padding:0;cursor:pointer}
.inv-cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.inv-cell .iempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#D8CCBA;font-size:26px}
/* ===== 周统计 ===== */
.wcard{background:var(--card);border-radius:var(--rs);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:10px}
.wcard .wday{font-weight:600;margin-bottom:5px}
.wcard .wmeal{font-size:12.5px;color:var(--ink2);margin:2px 0 2px 10px;white-space:pre-line}
.wcard .wcnt{font-size:12px;color:var(--bean);margin-top:6px}
/* ===== 体重三围 ===== */
.bmrow{background:var(--card);border-radius:var(--rs);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between}
.bmrow .bmdate{font-size:13px;color:var(--ink2)}
.bmform{background:var(--card);border-radius:var(--rs);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.bmform .field{margin-bottom:10px}
.bmform .field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.bmform .field input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
</style>
</head>
<body>
<div id="view"></div>
<div id="modal-root"></div>
<div id="viewer-root"></div>
<div id="banner-root"></div>
<div id="toast-root"></div>
<input type="file" id="file-input" accept="image/*" multiple hidden>

<script>
'use strict';
/* ===== J1 工具层 ===== */
const $=(s,r=document)=>r.querySelector(s);
function h(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}
function bindSwipeRight(box,cb){ // 右滑切换：手机用 touch 事件（pointer 会被滚动 pointercancel 掉），鼠标用 pointer 事件
  let tx=null,ty=0,mx=0,my=0;
  box.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    if(document.querySelector('#modal-root .mask'))return;
    tx=e.touches[0].clientX;ty=e.touches[0].clientY;
  },{passive:true});
  box.addEventListener('touchend',e=>{
    if(tx===null)return;
    const t=(e.changedTouches&&e.changedTouches[0])||null;const sx0=tx;tx=null;
    if(!t||document.querySelector('#modal-root .mask'))return;
    if(t.clientX-sx0>60&&Math.abs(t.clientY-ty)<40&&Math.abs(t.clientX-sx0)<200)cb();
  },{passive:true});
  box.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch'||e.pointerType==='pen')return;
    if(document.querySelector('#modal-root .mask'))return;
    mx=e.clientX;my=e.clientY;
  });
  box.addEventListener('pointerup',e=>{
    if(e.pointerType==='touch'||e.pointerType==='pen')return;
    if(document.querySelector('#modal-root .mask'))return;
    if(e.clientX-mx>60&&Math.abs(e.clientY-my)<40&&Math.abs(e.clientX-mx)<200)cb();
  });
}
function esc(s){return String(s!=null?s:'');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
const pad2=n=>String(n).padStart(2,'0');
function dkey(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
const todayKey=()=>dkey(new Date());
function addDays(key,n){const[y,m,d]=key.split('-').map(Number);return dkey(new Date(y,m-1,d+n));}
function cnDay(key){const[y,m,d]=key.split('-').map(Number);return m+'月'+d+'日';}
function weekStart(key){const[y,m,d]=key.split('-').map(Number);const w=(new Date(y,m-1,d).getDay()+6)%7;return addDays(key,-w);}
function nowHM(){const d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function debounce(fn,ms){let t=null,last=null;const f=(...a)=>{last=a;clearTimeout(t);t=setTimeout(()=>{t=null;fn(...last);},ms);};f.flush=()=>{if(t&&last){clearTimeout(t);t=null;fn(...last);}};return f;}
const flushers=[];
window.addEventListener('pagehide',()=>flushers.forEach(f=>{try{f();}catch(e){}}));
function bindAutosave(el,saveFn,statusEl,ms=1000){
  const d=debounce(async()=>{await saveFn(el.value);if(statusEl){statusEl.classList.add('show');setTimeout(()=>statusEl.classList.remove('show'),1500);}},ms);
  el.addEventListener('input',d);
  flushers.push(()=>d.flush());
}
function toast(msg){const t=h('<div class="toast"></div>');t.textContent=msg;$('#toast-root').appendChild(t);setTimeout(()=>t.remove(),2400);}
function modal(sheet){const m=h('<div class="mask"></div>');m.appendChild(sheet);$('#modal-root').appendChild(m);return m;}
function closeModal(m){if(m)m.remove();}
function confirmBox(msg,{danger=false,okText='确定'}={}){
  return new Promise(res=>{
    const s=h('<div class="sheet"><h3></h3><div class="row"><button class="btn" data-x="no">取消</button><button class="btn '+(danger?'danger':'primary')+'" data-x="ok">'+esc(okText)+'</button></div></div>');
    s.querySelector('h3').textContent=msg;
    s.querySelector('[data-x=no]').onclick=()=>{closeModal(s.closest('.mask'));res(false);};
    s.querySelector('[data-x=ok]').onclick=()=>{closeModal(s.closest('.mask'));res(true);};
    modal(s);
  });
}
function promptBox(title,val='',{multiline=false,placeholder=''}={}){
  return new Promise(res=>{
    const s=h('<div class="sheet"><h3>'+esc(title)+'</h3>'+(multiline?'<textarea class="textarea"></textarea>':'<input class="input">')+'<div class="row"><button class="btn" data-x="no">取消</button><button class="btn primary" data-x="ok">保存</button></div></div>');
    const inp=s.querySelector(multiline?'textarea':'input');
    if(placeholder)inp.placeholder=placeholder;
    inp.value=val;
    const done=v=>{closeModal(s.closest('.mask'));res(v);};
    s.querySelector('[data-x=no]').onclick=()=>done(null);
    s.querySelector('[data-x=ok]').onclick=()=>done(inp.value.trim()||null);
    modal(s);inp.focus();
  });
}
function computeStreak(dateSet){
  let d=todayKey();
  if(!dateSet.has(d))d=addDays(d,-1);
  let n=0;
  while(dateSet.has(d)){n++;d=addDays(d,-1);}
  return n;
}

/* ===== J2 存储层 ===== */
const DB=(()=>{
  const NAME='journal-db';
  const DEFS={
    items:[{n:'order'}],
    records:[{n:'itemId'},{n:'date'},{n:['itemId','date'],as:'item_date'},{n:['itemId','updatedAt'],as:'item_updated'}],
    entries:[{n:'bucket'},{n:'createdAt'}],
    meals:[{n:'date'},{n:['date','slot'],as:'date_slot'}],
    exercises:[{n:'date'}],
    bodyMetrics:[{n:'date'}],
    books:[],
    skills:[{n:'category'}],
    inventory:[{n:'itemId'},{n:'createdAt'}],
    groceries:[{n:'date'}],
    images:[],
    settings:[],
    outbox:[],
  };
  // 数据库版本升级：已有库缺 store 时补建
  let dbp=null;
  function open(){
    if(dbp)return dbp;
    dbp=new Promise((res,rej)=>{
      function buildStores(db){
        for(const[name,idxs]of Object.entries(DEFS)){
          if(db.objectStoreNames.contains(name))continue;
          const st=db.createObjectStore(name,{keyPath:name==='settings'?'key':'id'});
          idxs.forEach(ix=>{
            const nm=ix.as||(Array.isArray(ix.n)?ix.n.join('_'):ix.n);
            st.createIndex(nm,ix.n,{unique:false});
          });
        }
      }
      // 先不带版本号打开（自动取当前版本），避免硬编码版本低于实际版本触发 VersionError
      const rq=indexedDB.open(NAME);
      rq.onupgradeneeded=e=>{buildStores(e.target.result);}; // 全新库：一次性建齐
      rq.onsuccess=()=>{
        const db=rq.result;
        // 检查是否所有 store 都存在，缺则升版本补建
        let missing=false;
        for(const name of Object.keys(DEFS))if(!db.objectStoreNames.contains(name)){missing=true;break;}
        if(missing){
          const v=db.version+1;
          db.close();
          const rq2=indexedDB.open(NAME,v);
          rq2.onupgradeneeded=e=>{buildStores(e.target.result);};
          rq2.onsuccess=()=>res(rq2.result);
          rq2.onerror=()=>rej(rq2.error);
          rq2.onblocked=()=>rej(new Error('数据库升级被其他标签页阻塞'));
        }else res(db);
      };
      rq.onerror=()=>rej(rq.error);
    });
    return dbp;
  }
  function req2p(rq){return new Promise((res,rej)=>{rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
  async function _st(name,mode){const db=await open();return db.transaction(name,mode).objectStore(name);}
  async function putRaw(name,val){return req2p((await _st(name,'readwrite')).put(val));}
  async function delRaw(name,key){return req2p((await _st(name,'readwrite')).delete(key));}
  async function put(name,val){
    if(val&&typeof val==='object'&&!val.updatedAt)val.updatedAt=Date.now();
    const r=await putRaw(name,val);
    try{await Cloud.enqueue(name,val);}catch(e){}
    return r;
  }
  async function get(name,key){return req2p((await _st(name,'readonly')).get(key));}
  async function del(name,key){
    const r=await delRaw(name,key);
    try{await Cloud.enqueue(name,null,key);}catch(e){}
    return r;
  }
  async function all(name){return req2p((await _st(name,'readonly')).getAll());}
  async function byIndex(name,idx,query){return req2p((await _st(name,'readonly')).index(idx).getAll(query));}
  async function count(name){return req2p((await _st(name,'readonly')).count());}
  async function clear(name){return req2p((await _st(name,'readwrite')).clear());}
  async function bulkPut(name,vals){
    const db=await open();
    return new Promise((res,rej)=>{
      const t=db.transaction(name,'readwrite');
      vals.forEach(v=>t.objectStore(name).put(v));
      t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);
    });
  }
  async function clearAll(){for(const n of Object.keys(DEFS))await clear(n);}
  async function getSetting(k,dflt){const v=await get('settings',k);return v===undefined?dflt:v.value;}
  async function setSetting(k,value){return put('settings',{key:k,value});}
  return {open,put,get,del,putRaw,delRaw,all,byIndex,count,clear,bulkPut,clearAll,getSetting,setSetting};
})();

/* ===== 云同步层（双后端：Cloudflare Worker / GitHub 私有仓库；离线仍是事实源）===== */
const Cloud=(()=>{
  const LS_CFG='cloud_config';
  const SYNC_EVERY=300000; // 后台同步间隔 5 分钟
  const STORES=['items','records','entries','meals','exercises','bodyMetrics','books','skills','inventory','groceries','images','settings'];
  const keyOf=(store,val)=>val[store==='settings'?'key':'id'];
  let flushing=false,lastPullOk=0,lastErr='',pulling=false;

  /* ---- 配置：{mode:'gh',token,repo} 或 {mode:'worker',base} ---- */
  function config(){
    try{
      const v=JSON.parse(localStorage.getItem(LS_CFG)||'null');
      if(v&&(v.mode==='gh'||v.mode==='worker'))return v;
    }catch(e){}
    const legacy=localStorage.getItem('cloud_base')||'';
    if(legacy){const c={mode:'worker',base:legacy};localStorage.setItem(LS_CFG,JSON.stringify(c));return c;}
    // 从秘密路径自动识别：形如 /<20位以上随机串>（Worker 部署场景）
    const p=location.pathname.replace(/\/+$/,'');
    if(p&&/^\/[A-Za-z0-9_-]{20,}$/.test(p)){
      const c={mode:'worker',base:location.origin+p};
      localStorage.setItem(LS_CFG,JSON.stringify(c));
      return c;
    }
    return null;
  }
  function setCfg(c){
    if(c)localStorage.setItem(LS_CFG,JSON.stringify(c));
    else localStorage.removeItem(LS_CFG);
    localStorage.removeItem('cloud_base');
  }
  function enabled(){return !!config();}
  function base(){const c=config();return c&&c.mode==='worker'?c.base:'';}
  async function status(){
    if(!enabled())return {enabled:false};
    const c=config();
    return {enabled:true,mode:c.mode,base:c.mode==='worker'?c.base:'',repo:c.mode==='gh'?c.repo:'',
      lastPull:lastPullOk,lastErr,pending:(await DB.count('outbox'))};
  }

  /* ---- Blob <-> base64 ---- */
  async function blobToB64(blob){
    const u=new Uint8Array(await blob.arrayBuffer());
    let s='';const CH=0x8000;
    for(let i=0;i<u.length;i+=CH)s+=String.fromCharCode.apply(null,u.subarray(i,Math.min(i+CH,u.length)));
    return btoa(s);
  }
  async function b64ToBlob(b64){
    const s=atob(b64);const u=new Uint8Array(s.length);
    for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);
    return new Blob([u]);
  }
  // 出站序列化：images 的 Blob 转 base64
  async function serialize(store,val){
    if(val==null)return null;
    if(store==='images'&&val.blob instanceof Blob){
      return {__img:true,id:val.id,createdAt:val.createdAt,updatedAt:val.updatedAt,b64:await blobToB64(val.blob)};
    }
    return JSON.parse(JSON.stringify(val));
  }
  async function deserialize(store,v){
    if(v&&v.__img)return {id:v.id,createdAt:v.createdAt,updatedAt:v.updatedAt,blob:await b64ToBlob(v.b64)};
    return v;
  }

  /* ---- 后端：GitHub 私有仓库（每条记录一个文件 data/<store>/<id>.json）---- */
  const Gh=(()=>{
    function root(c){return (c.api||'https://api.github.com').replace(/\/+$/,'');}
    function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
    function b64d(s){return decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))));}
    async function req(c,method,path,body){
      const r=await fetch(root(c)+path,{method,
        headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
        body:body===undefined?undefined:JSON.stringify(body)});
      if(r.status===404||r.status===204)return null;
      if(!r.ok){
        let msg='GitHub '+r.status;
        try{const j=await r.json();if(j&&j.message)msg+=' · '+j.message;}catch(e){}
        const err=new Error(msg);err.status=r.status;throw err;
      }
      return r.json();
    }
    function fpath(store,id){return 'data/'+encodeURIComponent(store)+'/'+encodeURIComponent(id)+'.json';}
    function parsePath(p){const m=p.match(/^data\/([^/]+)\/(.+)\.json$/);return m?{store:decodeURIComponent(m[1]),id:decodeURIComponent(m[2])}:null;}
    async function push(c,items){
      const shas=(await DB.getSetting('gh_shacache',null))||{};
      let n=0;
      for(const it of items){
        if(it.s==='outbox')continue;
        const p=fpath(it.s,it.id);
        if(it.v==null){ // 墓碑 → 删除远端文件
          let sha=shas[p];
          if(!sha){
            const f=await req(c,'GET','/repos/'+c.repo+'/contents/'+p+'?ref=main');
            sha=f&&f.sha;
          }
          if(sha){
            try{await req(c,'DELETE','/repos/'+c.repo+'/contents/'+p,{message:'sync',sha:sha,branch:'main'});}
            catch(e){
              if(e.status===409||e.status===422){ // sha 过期：刷新后重试一次
                const f=await req(c,'GET','/repos/'+c.repo+'/contents/'+p+'?ref=main');
                if(f&&f.sha)await req(c,'DELETE','/repos/'+c.repo+'/contents/'+p,{message:'sync',sha:f.sha,branch:'main'});
              }else throw e;
            }
          }
          delete shas[p];n++;
          continue;
        }
        const body={message:'sync',content:b64e(JSON.stringify(it.v)),branch:'main'};
        if(shas[p])body.sha=shas[p];
        let r;
        try{r=await req(c,'PUT','/repos/'+c.repo+'/contents/'+p,body);}
        catch(e){
          if(e.status===409||e.status===422){ // sha 过期：刷新后重试一次
            const f=await req(c,'GET','/repos/'+c.repo+'/contents/'+p+'?ref=main');
            if(f&&f.sha){shas[p]=f.sha;body.sha=f.sha;r=await req(c,'PUT','/repos/'+c.repo+'/contents/'+p,body);}
            else throw e;
          }else throw e;
        }
        if(r&&r.content&&r.content.sha)shas[p]=r.content.sha;
        n++;
      }
      await DB.putRaw('settings',{key:'gh_shacache',value:shas});
      return n;
    }
    async function pull(c){
      const cm=await req(c,'GET','/repos/'+c.repo+'/commits/main?per_page=1');
      if(!cm||!cm.sha)return {applied:0,deleted:0};
      const tr=await req(c,'GET','/repos/'+c.repo+'/git/trees/'+cm.sha+'?recursive=1');
      if(!tr||!Array.isArray(tr.tree))return {applied:0,deleted:0};
      const remote={};
      for(const t of tr.tree){
        if(t.type==='blob'&&t.path.indexOf('data/')===0)remote[t.path]=t.sha;
      }
      const shas=(await DB.getSetting('gh_shacache',null))||{};
      let applied=0,deleted=0;
      for(const p of Object.keys(remote)){
        if(shas[p]===remote[p]){
          // 内容未变：仅当本地仍存在该记录时才可跳过（否则新设备/清库后拉不回数据）
          const pp=parsePath(p);
          if(pp&&STORES.indexOf(pp.store)>=0){
            const loc=await DB.get(pp.store,pp.id);
            if(loc)continue;
          }
        }
        const f=await req(c,'GET','/repos/'+c.repo+'/git/blobs/'+remote[p]); // blobs API 无 1MB 大小限制
        shas[p]=remote[p];
        if(!f||!f.content)continue;
        const pp=parsePath(p);if(!pp||STORES.indexOf(pp.store)<0)continue;
        let v;
        try{v=JSON.parse(b64d(f.content));}catch(e){continue;}
        const local=await DB.get(pp.store,pp.id);
        const localTs=(local&&local.updatedAt)||0;
        if((v.updatedAt||0)>=localTs){await DB.putRaw(pp.store,await deserialize(pp.store,v));applied++;}
      }
      for(const p of Object.keys(shas)){ // 缓存有但远端已删 → 本地删除
        if(remote[p])continue;
        const pp=parsePath(p);
        if(pp&&STORES.indexOf(pp.store)>=0){
          if(pp.store==='items'){ // 固定模块不允许被同步误删（云端仓库重置时保护本地数据）
            const loc=await DB.get('items',pp.id);
            if(loc&&loc.builtin){delete shas[p];continue;}
          }
          await DB.delRaw(pp.store,pp.id);deleted++;
        }
        delete shas[p];
      }
      await DB.putRaw('settings',{key:'gh_shacache',value:shas});
      return {applied,deleted};
    }
    return {push,pull};
  })();

  /* ---- 出站推送：按后端分发（同步内部状态不上传）---- */
  async function apiPush(items){
    items=(items||[]).filter(it=>!(it.s==='settings'&&/^(gh_|cloud_)/.test(String(it.id))));
    if(!items.length)return 0;
    const c=config();
    if(c.mode==='gh')return Gh.push(c,items);
    for(let i=0;i<items.length;i+=40){
      const r=await fetch(c.base+'/api/push',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:items.slice(i,i+40)})});
      if(!r.ok)throw new Error('push HTTP '+r.status);
    }
    return items.length;
  }

  /* ---- 出站队列：本地写操作进入 outbox，后台批量推送 ---- */
  async function enqueue(store,val,deletedKey){
    if(!enabled())return;
    const rec={id:uid(),store,ts:Date.now()};
    if(deletedKey!==undefined){rec.del=true;rec.key=deletedKey;rec.value=null;}
    else{rec.key=keyOf(store,val);rec.value=await serialize(store,val);}
    await DB.putRaw('outbox',rec);
    scheduleFlush();
  }
  const scheduleFlush=debounce(()=>{flushOutbox();},3000);
  async function flushOutbox(){
    if(!enabled()||flushing)return;
    flushing=true;
    try{
      const items=await DB.all('outbox');
      if(items.length){
        const payload=items.map(o=>({s:o.store,id:o.key,v:o.value,ts:o.ts}));
        await apiPush(payload);
        for(const o of items)await DB.delRaw('outbox',o.id);
      }
      lastErr='';
    }catch(e){lastErr=String(e&&e.message||e);}
    finally{flushing=false;}
  }

  /* ---- 入站合并：按 updatedAt 最新胜出（LWW），远端缺失视为删除 ---- */
  async function pull(since){
    if(!enabled())return null;
    if(pulling)return {applied:0,deleted:0,skip:true};
    pulling=true;
    try{
      const c=config();
      let res;
      if(c.mode==='gh'){
        res=await Gh.pull(c);
      }else{
        if(since===undefined)since=await DB.getSetting('cloud_last_pull',0);
        const r=await fetch(c.base+'/api/pull?since='+encodeURIComponent(since));
        if(!r.ok)throw new Error('pull HTTP '+r.status);
        const data=await r.json();
        res={applied:0,deleted:0,serverTime:data.serverTime};
        for(const ch of (data.changes||[])){
          if(ch.s==='outbox')continue;
          const local=await DB.get(ch.s,ch.id);
          const localTs=(local&&local.updatedAt)||0;
          if((ch.ts||0)<localTs)continue; // 本地更新，跳过
          if(ch.v==null){await DB.delRaw(ch.s,ch.id);res.deleted++;}
          else{await DB.putRaw(ch.s,await deserialize(ch.s,ch.v));res.applied++;}
        }
        await DB.putRaw('settings',{key:'cloud_last_pull',value:(data.serverTime||Date.now())});
      }
      lastPullOk=Date.now();lastErr='';
      try{await ensureBuiltin();}catch(e){} // 拉取后自愈固定模块
      return res;
    }catch(e){lastErr=String(e&&e.message||e);throw e;}
    finally{pulling=false;}
  }

  /* ---- 一次性迁移：把本地全部数据推上云端（保留本地不动）---- */
  async function fullUpload(){
    if(!enabled())throw new Error('未配置云同步');
    const now=Date.now();const payload=[];
    for(const s of STORES){
      const rows=await DB.all(s);
      for(const v of rows){
        if(!v.updatedAt)v.updatedAt=now;
        await DB.putRaw(s,v);
        payload.push({s,id:keyOf(s,v),v:await serialize(s,v),ts:v.updatedAt});
      }
    }
    await apiPush(payload);
    return {count:payload.length};
  }

  function init(){
    if(!enabled())return;
    if('serviceWorker' in navigator){
      try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
    }
    // 动态注入 PWA 所需的 manifest / 主题色（本地版无这些文件也不受影响）
    try{
      const mf=document.createElement('link');
      mf.rel='manifest';mf.href='manifest.webmanifest';
      document.head.appendChild(mf);
      const th=document.createElement('meta');
      th.name='theme-color';th.content='#FAF6EF';
      document.head.appendChild(th);
    }catch(e){}
    setTimeout(async()=>{
      try{await pull();await flushOutbox();}catch(e){}
    },1500);
    setInterval(async()=>{
      if(flushing||pulling)return;
      try{await pull();await flushOutbox();}catch(e){}
    },SYNC_EVERY);
  }

  return {config,setCfg,base,enabled,status,enqueue,flushOutbox,pull,fullUpload,init,blobToB64,b64ToBlob};
})();

/* ===== J3 图片层 ===== */
const Img=(()=>{
  const urlCache=new Map();
  function pickFiles(){
    return new Promise(res=>{
      const inp=$('#file-input');
      inp.value='';
      inp.onchange=()=>res([...inp.files]);
      inp.click();
    });
  }
  async function compress(file){
    const dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(file);});
    const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=dataUrl;});
    const MAX=1280;
    let w=img.width,ht=img.height;
    if(Math.max(w,ht)>MAX){const k=MAX/Math.max(w,ht);w=Math.round(w*k);ht=Math.round(ht*k);}
    const cv=document.createElement('canvas');cv.width=w;cv.height=ht;
    cv.getContext('2d').drawImage(img,0,0,w,ht);
    const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',.85));
    return blob;
  }
  async function store(blob){
    const id=uid();
    await DB.put('images',{id,blob,createdAt:Date.now()});
    urlCache.set(id,URL.createObjectURL(blob));
    return id;
  }
  async function url(id){
    if(!id)return '';
    if(!urlCache.has(id)){
      const rec=await DB.get('images',id);
      if(!rec)return '';
      urlCache.set(id,URL.createObjectURL(rec.blob));
    }
    return urlCache.get(id);
  }
  async function attach(imgEl,id){const u=await url(id);if(u)imgEl.src=u;}
  function viewer(ids,idx){
    let i=idx;
    const v=h('<div class="viewer"><img alt=""><div class="vbar"><button data-v="prev">‹</button><button data-v="close" class="close">关闭</button><button data-v="next">›</button></div></div>');
    const img=v.querySelector('img');
    const show=()=>attach(img,ids[i]);
    show();
    v.querySelector('[data-v=prev]').onclick=()=>{i=(i-1+ids.length)%ids.length;show();};
    v.querySelector('[data-v=next]').onclick=()=>{i=(i+1)%ids.length;show();};
    v.querySelector('[data-v=close]').onclick=()=>v.remove();
    v.onclick=e=>{if(e.target===v)v.remove();};
    $('#viewer-root').appendChild(v);
  }
  function grid(container,ids,{max=3,onChange=null}={}){
    container.classList.add('imggrid');
    async function render(){
      container.innerHTML='';
      for(const id of ids){
        const c=h('<div class="imgcell"><img alt=""><button class="imgdel" title="删除">×</button></div>');
        attach(c.querySelector('img'),id);
        c.querySelector('img').onclick=()=>viewer(ids,ids.indexOf(id));
        c.querySelector('.imgdel').onclick=async e=>{
          e.stopPropagation();
          const yes=await confirmBox('删除这张图片？',{danger:true,okText:'删除'});
          if(!yes)return;
          const pos=ids.indexOf(id);
          if(pos>-1)ids.splice(pos,1);
          await render();
          onChange&&onChange(id);
        };
        container.appendChild(c);
      }
      const add=h('<button class="imgcell add">＋</button>');
      add.onclick=async()=>{
        if(ids.length>=max){toast('最多 '+max+' 张图片');return;}
        const files=await pickFiles();
        for(const f of files){
          if(ids.length>=max){toast('最多 '+max+' 张图片');break;}
          try{const blob=await compress(f);ids.push(await store(blob));}
          catch(err){toast('图片处理失败');}
        }
        await render();
        onChange&&onChange(null);
      };
      container.appendChild(add);
    }
    render();
    return {ids,redraw:render};
  }
  return {pickFiles,compress,store,url,attach,viewer,grid};
})();

const Pages={};
const Router=(()=>{
  const stack=[];
  let rendering=false;
  async function render(){
    if(rendering)return;rendering=true;
    try{
      const top=stack[stack.length-1];
      const el=await Pages[top.page].render(top.params||{});
      const v=$('#view');
      v.innerHTML='';v.appendChild(el);
      window.scrollTo(0,0);
    }finally{rendering=false;}
  }
  function go(page,params){stack.push({page,params});render();}
  function back(){if(stack.length>1){stack.pop();render();}}
  function replace(page,params){stack.length=0;stack.push({page,params});render();}
  function start(){stack.length=0;stack.push({page:'home'});render();}
  function refresh(){render();}
  return {go,back,replace,start,refresh,stack};
})();

async function collectImageIds(rec){return rec&&Array.isArray(rec.imageIds)?rec.imageIds:[];}
async function deleteImages(ids){for(const id of ids){if(id)await DB.del('images',id);}}
async function deleteItemCascade(item){
  const imgIds=[];
  const recs=await DB.byIndex('records','itemId',item.id);
  for(const r of recs){imgIds.push(...await collectImageIds(r));await DB.del('records',r.id);}
  const ek=item.kind==='custom'?(item.specKind||'none'):item.kind;
  const isCustom=item.kind==='custom';
  // 共享数据（meals/exercises 等）仅在删除默认事项时清空；自定义事项只删自身记录
  if(ek==='sew'&&!isCustom){
    for(const b of ['sew-inspiration','sew-gallery','sew-tips']){
      const es=await DB.byIndex('entries','bucket',b);
      for(const en of es){imgIds.push(...await collectImageIds(en));await DB.del('entries',en.id);}
    }
  }else if(ek==='eat'&&!isCustom){
    for(const m of await DB.all('meals'))await DB.del('meals',m.id);
    for(const b of ['dish-gallery','dish-todo']){
      const es=await DB.byIndex('entries','bucket',b);
      for(const en of es){imgIds.push(...await collectImageIds(en));await DB.del('entries',en.id);}
    }
  }else if(ek==='sport'&&!isCustom){
    for(const x of await DB.all('exercises'))await DB.del('exercises',x.id);
    for(const bm of await DB.all('bodyMetrics'))await DB.del('bodyMetrics',bm.id);
  }else if(ek==='read'&&!isCustom){
    for(const bk of await DB.all('books')){imgIds.push(bk.coverImageId);imgIds.push(...await collectImageIds(bk));await DB.del('books',bk.id);}
  }else if(ek==='skill'&&!isCustom){
    for(const sk of await DB.all('skills'))await DB.del('skills',sk.id);
  }else if(ek==='inventory'){
    for(const o of await DB.byIndex('inventory','itemId',item.id))await DB.del('inventory',o.id);
  }
  await deleteImages(imgIds);
  await DB.del('items',item.id);
}

      if(!card||e.target.closest('[data-op=del]'))return;

    });

      if(!drag)return;
      if(!drag.moved){
        if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;

        const rect=target.getBoundingClientRect();
        grid.insertBefore(drag.card,e.clientY<rect.top+rect.height/2?target:target.nextSibling);

    });

      if(!drag)return;

function buildCalendar(host,state,marked,onPick){
  function draw(){
    const y=state.y,m=state.m;
    const first=new Date(y,m,1);
    const daysInMonth=new Date(y,m+1,0).getDate();
    const startCol=(first.getDay()+6)%7;
    let cells='';
    for(let i=0;i<startCol;i++)cells+='<span></span>';
    const tk=todayKey();
    for(let d=1;d<=daysInMonth;d++){
      const key=y+'-'+pad2(m+1)+'-'+pad2(d);
      const icon=key===tk?IC_TODAY:(marked.has(key)?IC_DONE:IC_NOT);
      cells+='<button data-d="'+key+'" class="'+(marked.has(key)?'mk ':'')+(key===tk?'today':'')+'">'+d+'<span class="cic">'+icon+'</span></button>';
    }
    host.innerHTML='';
    const box=h('<div class="cal"><div class="cal-head"><button class="cal-nav" data-n="-1">‹</button><div class="cal-title hand">'+y+'年'+(m+1)+'月</div><button class="cal-nav" data-n="1">›</button></div><div class="cal-weekrow"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="cal-days">'+cells+'</div></div>');
    box.querySelectorAll('.cal-days [data-d]').forEach(b=>b.onclick=()=>onPick(b.dataset.d));
    box.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{state.m+=+b.dataset.n;if(state.m<0){state.m=11;state.y--;}else if(state.m>11){state.m=0;state.y++;}draw();});
    host.appendChild(box);
  }
  draw();
}

async function saveRec(rec){
  const empty=!rec.text.trim()&&!rec.imageIds.length;
  if(empty){
    if(rec._saved)await DB.del('records',rec.id);
    rec._saved=false;
    return;
  }
  rec.updatedAt=Date.now();
  await DB.put('records',{id:rec.id,itemId:rec.itemId,date:rec.date,text:rec.text,imageIds:[...rec.imageIds],updatedAt:rec.updatedAt});
  rec._saved=true;
}
function mealDishes(m){
  if(Array.isArray(m.dishes))return m.dishes;
  return (m.items||'').split('\n').map(x=>x.trim()).filter(Boolean).map(name=>({name,ing:[]}));
}
async function computeFoodKinds(date){
  const meals=await DB.byIndex('meals','date',date);
  const set=new Set();
  for(const m of meals)for(const d of mealDishes(m)){
    const tags=(d.ing||[]).filter(Boolean);
    if(tags.length)tags.forEach(t=>set.add(t));
    else if(d.name)set.add(d.name);
  }
  return set.size;
}
const MEAL_SLOTS=[['breakfast','早餐'],['lunch','午餐'],['dinner','晚餐'],['snack','加餐']];
async function topMealTags(limit){
  const meals=await DB.all('meals');
  const stat={};
  for(const m of meals)for(const d of mealDishes(m))for(const t of (d.ing||[])){
    const k=(t||'').trim();if(!k)continue;
    if(!stat[k])stat[k]={count:0,last:''};
    stat[k].count++;
    if((m.date||'')>stat[k].last)stat[k].last=m.date;
  }
  return Object.keys(stat).map(k=>({tag:k,count:stat[k].count,last:stat[k].last}))
    .sort((a,b)=>b.count-a.count||b.last.localeCompare(a.last)).slice(0,limit);
}
async function allMealTags(){
  const meals=await DB.all('meals');
  const arr=[];
  for(const m of meals)for(const d of mealDishes(m))for(const t of (d.ing||[])){
    const k=(t||'').trim();if(k&&arr.indexOf(k)<0)arr.push(k);
  }
  return arr;
}

/* ===== J8 设置 + ZIP 工具 ===== */
// CRC32 表（precomputed）
const CRC32_TABLE=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c;}return t;})();
function crc32Bytes(bytes){let c=0xFFFFFFFF;for(const b of bytes)c=CRC32_TABLE[(c^b)&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function strToBytes(s){return new TextEncoder().encode(s);}
// 生成一个 ZIP（store 不压缩）。entries=[{name, bytes}]
function makeZip(entries){
  const parts=[]; // 收集所有部分
  const centralDirs=[];
  let offset=0;
  for(const e of entries){
    const nameBytes=strToBytes(e.name);
    const data=e.bytes;
    const crc=crc32Bytes(data);
    const nlen=nameBytes.length;
    const dlen=data.length;
    // Local file header (30 bytes + name + data)
    const lh=new Uint8Array(30+nlen+dlen);
    const dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); // PK\x03\x04
    dv.setUint16(4,20,true); // version needed
    dv.setUint16(6,0,true); // flags
    dv.setUint16(8,0,true); // method: store
    dv.setUint16(10,0,true); // time
    dv.setUint16(12,0,true); // date
    dv.setUint32(14,crc,true);
    dv.setUint32(18,dlen,true); // compressed
    dv.setUint32(22,dlen,true); // uncompressed
    dv.setUint16(26,nlen,true);
    dv.setUint16(28,0,true); // extra len
    lh.set(nameBytes,30);
    lh.set(data,30+nlen);
    parts.push(lh);
    // Central directory entry (46 bytes + name)
    const cd=new Uint8Array(46+nlen);
    const cdv=new DataView(cd.buffer);
    cdv.setUint32(0,0x02014b50,true); // PK\x01\x02
    cdv.setUint16(4,20,true);
    cdv.setUint16(6,20,true);
    cdv.setUint16(8,0,true);
    cdv.setUint16(10,0,true);
    cdv.setUint16(12,0,true);
    cdv.setUint16(14,0,true);
    cdv.setUint32(16,crc,true);
    cdv.setUint32(20,dlen,true);
    cdv.setUint32(24,dlen,true);
    cdv.setUint16(28,nlen,true);
    cdv.setUint16(30,0,true);
    cdv.setUint16(32,0,true);
    cdv.setUint16(34,0,true);
    cdv.setUint16(36,0,true);
    cdv.setUint32(38,offset,true);
    cd.set(nameBytes,46);
    centralDirs.push(cd);
    offset+=lh.length;
  }
  // End of central directory (22 bytes)
  const eocd=new Uint8Array(22);
  const ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(4,0,true);
  ev.setUint16(6,0,true);
  ev.setUint16(8,entries.length,true);
  ev.setUint16(10,entries.length,true);
  let cdSize=0;for(const cd of centralDirs)cdSize+=cd.length;
  ev.setUint32(12,cdSize,true);
  ev.setUint32(16,offset,true);
  ev.setUint16(20,0,true);
  // 合并
  let total=offset+cdSize+22;
  const out=new Uint8Array(total);
  let p=0;
  for(const part of parts){out.set(part,p);p+=part.length;}
  for(const cd of centralDirs){out.set(cd,p);p+=cd.length;}
  out.set(eocd,p);
  return new Blob([out],{type:'application/zip'});
}
// 简单 ZIP 解析（只支持 store + 本工具生成的格式）
async function parseZip(blob){
  const buf=new Uint8Array(await blob.arrayBuffer());
  const dv=new DataView(buf.buffer);
  const entries={};
  let p=0;
  while(p<buf.length){
    if(dv.getUint32(p,true)!==0x04034b50)break;
    const method=dv.getUint16(p+8,true);
    const compSize=dv.getUint32(p+18,true);
    const nameLen=dv.getUint16(p+26,true);
    const extraLen=dv.getUint16(p+28,true);
    const name=new TextDecoder().decode(buf.subarray(p+30,p+30+nameLen));
    const dataStart=p+30+nameLen+extraLen;
    const data=buf.subarray(dataStart,dataStart+compSize);
    entries[name]=new Blob([data]);
    p=dataStart+compSize;
  }
  return entries;
}
async function exportAll(){
  const storeNames=['items','records','entries','meals','exercises','bodyMetrics','books','skills','inventory','groceries','images','settings'];
  const entries=[];
  for(const n of storeNames){
    const all=await DB.all(n);
    if(n==='images'){
      // images 存的是 Blob，需要特殊处理
      for(const img of all){
        const buf=await (img.blob||img.data).arrayBuffer();
        entries.push({name:'images/'+img.id+'.bin',bytes:new Uint8Array(buf)});
      }
    }else{
      const json=JSON.stringify(all,(_k,v)=>v instanceof Blob?'[BLOB]':v);
      entries.push({name:n+'.json',bytes:strToBytes(json)});
    }
  }
  const zip=makeZip(entries);
  const url=URL.createObjectURL(zip);
  const a=document.createElement('a');
  a.href=url;a.download='journal-backup-'+todayKey()+'.zip';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importAll(blob,mode){
  const entries=await parseZip(blob);
  const storeNames=['items','records','entries','meals','exercises','bodyMetrics','books','skills','inventory','groceries','images','settings'];
  if(mode==='overwrite'){
    for(const n of storeNames)await DB.clear(n);
  }
  for(const n of storeNames){
    const key=n+'.json';
    if(entries[key]){
      const text=await entries[key].text();
      const arr=JSON.parse(text);
      if(arr&&arr.length)await DB.bulkPut(n,arr);
    }
  }
  // images
  for(const k in entries){
    if(k.startsWith('images/')&&k.endsWith('.bin')){
      const id=k.slice(7,-4);
      const ab=await entries[k].arrayBuffer();
      await DB.put('images',{id,blob:new Blob([ab]),updatedAt:Date.now()});
    }
  }
}

function goalDaysLeft(g){ // 剩余天数 =（创建日+天数）- 今天；0=今天截止，负数=已到期
  if(!g.days)return null;
  const s=new Date(g.start+'T00:00:00'),dl=new Date(s);
  dl.setDate(dl.getDate()+Number(g.days));
  const t=new Date(todayKey()+'T00:00:00');
  return Math.round((dl-t)/86400000);
}

function renderGoalList(box,item){ // 目标列表：只显示已设目标＋底部「＋添加目标」；短期显示倒计时（天数黑色加粗），长期仅文本
  // 旧数据迁移：短期/长期文本框内容 → 两条长期目标（无天数，仅文本）
  if(!item.goals&&(item.shortGoal||item.longGoal)){
    item.goals=[];
    if(item.shortGoal)item.goals.push({id:uid(),text:item.shortGoal,type:'long',days:null,start:todayKey()});

  }
  box.innerHTML='';
  for(const g of (item.goals||[])){
    const left=goalDaysLeft(g);
    let cd='';
    if(left!==null){
      if(left>0)cd='<span class="gleft"><b>'+left+'</b> 天</span>';
      else if(left===0)cd='<span class="gleft"><b>今天</b></span>';
      else cd='<span class="gleft"><b>已到期</b></span>';
    }
    const card=h('<div class="goal"><div class="goal-row"><div class="gtext">'+esc(g.text)+'</div>'+cd+'</div></div>');
    // 左滑删除
    let pd=null;
    card.addEventListener('pointerdown',e=>{
      pd={sx:e.clientX,sy:e.clientY,moved:false,dx:0};
      try{card.setPointerCapture(e.pointerId);}catch(err){}
    });
    card.addEventListener('pointermove',e=>{
      if(!pd)return;
      if(!pd.moved){
        if(Math.abs(e.clientX-pd.sx)>6&&Math.abs(e.clientX-pd.sx)>Math.abs(e.clientY-pd.sy))pd.moved=true;
        else return;
      }
      let dx=e.clientX-pd.sx;
      if(dx>0)dx=0; // 只允许向左滑
      pd.dx=dx;
      card.style.transform='translateX('+dx+'px)';
    });
    card.addEventListener('pointerup',async()=>{
      if(!pd)return;
      const dx=pd.dx;
      card.style.transform='';
      if(pd.moved&&dx<-80){
        const y=await confirmBox('删除该目标？',{danger:true,okText:'删除'});
        if(y){item.goals=(item.goals||[]).filter(x=>x.id!==g.id);await DB.put('items',item);Router.refresh();}
      }
      pd=null;
    });
    box.appendChild(card);
  }
  const add=h('<button class="skill-add" style="margin-top:10px;padding:16px 14px"><span class="plus">＋</span><span>添加目标</span></button>');
  add.onclick=()=>openGoalForm(item);
  box.appendChild(add);
}
/* ===== 手势助手：双击 / 长按（桌面+移动端）===== */
function bindDoubleTap(el,fn){ // 双击＝触发 fn（移动端用 touchend 双触检测，桌面用 dblclick）
  let lastTouch=0;
  el.addEventListener('touchend',e=>{
    const now=Date.now();
    if(now-lastTouch<300){lastTouch=0;e.preventDefault();fn();}
    else lastTouch=now;
  },{passive:false});
  el.addEventListener('dblclick',e=>{e.preventDefault();fn();});
}
function bindLongPress(el,fn){ // 长按 600ms＝触发 fn（touch 与 pointer 鼠标）
  let timer=null,start=null;
  function cancel(){if(timer){clearTimeout(timer);timer=null;}}
  el.addEventListener('touchstart',e=>{start=e.touches[0];timer=setTimeout(()=>{timer=null;fn();},600);},{passive:true});
  el.addEventListener('touchmove',e=>{if(start&&Math.abs(e.touches[0].clientX-start.clientX)>10)cancel();},{passive:true});
  el.addEventListener('touchend',cancel,{passive:true});
  el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')timer=setTimeout(()=>{timer=null;fn();},600);});
  el.addEventListener('pointerup',cancel);
  el.addEventListener('pointerleave',cancel);
}

        +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">置入理由</label><textarea class="textarea" id="ie-reason" style="min-height:56px">'+esc(o.reason||'')+'</textarea></div>'
        +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">标签（用于分类筛选）</label><input class="input" id="ie-tag" value="'+esc(o.tag||'')+'" placeholder="如 厨房、文具"></div>'
        +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">评星等级</label><div class="stars" id="ie-stars"></div></div>'
        +'<div style="margin:10px 0;display:flex;align-items:center;gap:10px"><button class="btn" id="ie-img">📷 上传图片</button><img id="ie-preview" style="width:48px;height:48px;object-fit:cover;border-radius:8px;'+(o.imageId?'':'display:none')+'" alt=""></div>'
        +'<div class="row">'+(isNew?'':'<button class="btn danger" data-x="del">删除</button>')+'<button class="btn" data-x="no">取消</button><button class="btn primary" data-x="ok">保存</button></div></div>');

        starBox.innerHTML='';
        for(let i=1;i<=5;i++){
          const b=h('<button type="button" class="'+(i<=rating?'on':'')+'">★</button>');
          b.onclick=()=>{rating=(i===rating)?0:i;drawStars();};
          starBox.appendChild(b);
        }
      };
      drawStars();
      // 图片
      let imageId=o.imageId||'';
      sheet.querySelector('#ie-img').onclick=async()=>{
        const files=await Img.pickFiles();if(!files||!files.length)return;
        const blob=await Img.compress(files[0]);
        imageId=await Img.store(blob);
        const pv=sheet.querySelector('#ie-preview');
        pv.style.display='';Img.attach(pv,imageId);
      };
      if(o.imageId)Img.attach(sheet.querySelector('#ie-preview'),o.imageId);
      const m=modal(sheet);
      sheet.querySelector('[data-x="no"]').onclick=()=>closeModal(m);
      const delBtn=sheet.querySelector('[data-x="del"]');
      if(delBtn)delBtn.onclick=async()=>{
        const yes=await confirmBox('确定删除「'+esc(o.name||'该物品')+'」？',{danger:true,okText:'删除'});
        if(yes){await DB.del('inventory',o.id);closeModal(m);toast('已删除');Router.refresh();}
      };
      sheet.querySelector('[data-x="ok"]').onclick=async()=>{
        o.name=sheet.querySelector('#ie-name').value.trim();
        o.price=sheet.querySelector('#ie-price').value;
        o.uses=Math.max(0,parseInt(sheet.querySelector('#ie-uses').value,10)||0);
        o.reason=sheet.querySelector('#ie-reason').value;
        o.tag=sheet.querySelector('#ie-tag').value.trim();
        o.rating=rating;
        o.imageId=imageId;
        if(isNew&&!o.name){toast('请填写物品名称');return;}
        await DB.put('inventory',o);
        closeModal(m);
        toast(isNew?'已添加':'已保存');
        Router.refresh();
      };
    }
    return el;
  }
};

    el.querySelector('#s-export').onclick=async()=>{await exportAll();toast('已导出');};

      const f=e.target.files[0];if(!f)return;
      const mode=await promptBox('导入模式（输入 overwrite=覆盖 / merge=合并）','merge');
      if(!mode)return;
      const y=await confirmBox('确定导入？这可能会影响现有数据',{danger:true});if(!y)return;

      catch(err){toast('导入失败：'+err.message);}
    };
    el.querySelector('#s-merge').onclick=async()=>{
      const items=(await DB.all('items')).sort((a,b)=>a.order-b.order);
      const groups={};
      for(const it of items){const k=(it.name||'').trim();if(!k)continue;if(!groups[k])groups[k]=[];groups[k].push(it);}
      const dups=Object.keys(groups).filter(k=>groups[k].length>1);
      if(!dups.length){toast('没有发现重复事项');return;}
      let total=0;
      for(const k of dups){
        const g=groups[k];
        g.sort((a,b)=>(b.builtin?1:0)-(a.builtin?1:0)||a.order-b.order||(a.createdAt||0)-(b.createdAt||0));
        const keep=g[0];
        const drop=g.slice(1);
        const y=await confirmBox('「'+k+'」有 '+g.length+' 条重复事项。将保留一条，把其余 '+drop.length+' 条的打卡记录与物品迁移过去并删除。继续？',{okText:'合并'});
        if(!y)continue;
        for(const d of drop){
          const recs=await DB.byIndex('records','itemId',d.id);
          for(const r of recs){
            const ex=await DB.byIndex('records','item_date',[keep.id,r.date]);
            if(ex.length)await DB.del('records',r.id);
            else{r.itemId=keep.id;await DB.put('records',r);}
          }
          const invs=await DB.byIndex('inventory','itemId',d.id);
          for(const o of invs){o.itemId=keep.id;await DB.put('inventory',o);}
          await DB.del('items',d.id);
          total++;
        }
      }
      toast(total?('已合并删除 '+total+' 条重复事项'):'已取消');
      Router.refresh();
    };
    el.querySelector('#s-clear').onclick=async()=>{

      const y2=await confirmBox('请再次确认：所有打卡记录、图片、书籍、体重等数据都会被删除！',{danger:true,okText:'再次确认清空'});if(!y2)return;
      await clearAllDB();
      toast('已清空所有数据');

      const s=await Cloud.status();
      el.querySelector('#s-cloud-status').textContent=!s.enabled?'未配置（离线模式，数据仅存本机）'
        :('已启用 · '+(s.mode==='gh'?('GitHub · '+s.repo):s.base.replace(/^https?:\/\//,'').slice(0,34)+'…')
          +(s.lastErr?(' · 最近错误：'+s.lastErr):'')
          +(s.pending?(' · 待推送 '+s.pending+' 条'):' · 已全部同步'));
    };
    const urlInp=el.querySelector('#s-cloud-url');

      if(/^ghp_|^github_pat_/.test(v)){
        const repo=repoInp.value.trim();
        if(!/^[^\s/]+\/[^\s/]+$/.test(repo)){toast('请填写数据仓库名，格式：用户名/仓库名');return;}
        Cloud.setCfg({mode:'gh',token:v,repo:repo});
      }else if(/^https?:\/\//i.test(v)){
        Cloud.setCfg({mode:'worker',base:v.replace(/\/+$/,'')});
      }else{toast('无法识别：请粘贴 GitHub Token 或 https:// 云端链接');return;}
      Cloud.init();refreshStatus();
      toast('云同步配置已保存');
    };

      const y=await confirmBox('把本机全部数据上传到云端？云端将被本机数据覆盖（合并时间戳 newer-wins）。',{okText:'开始上传'});

Pages.weekStat={
  async render(){
    // 本周一为起点
    let wkStart=weekStart(todayKey());
    const el=h('<div><div class="topbar"><button class="iconbtn" data-act="back">←</button><button class="iconbtn" data-x="prev">‹</button><h1 class="hand">本周统计</h1><button class="iconbtn" data-x="next">›</button></div><div id="wk-body"></div></div>');
    const body=el.querySelector('#wk-body');
    async function redraw(){
      body.innerHTML='';
      const weekDays=[];
      for(let i=0;i<7;i++)weekDays.push(addDays(wkStart,i));
      const items=[]; // 本周食材标签去重
      for(let i=0;i<7;i++){
        const d=weekDays[i];
        const meals=await DB.byIndex('meals','date',d);
        const bySlot={};for(const m of meals)bySlot[m.slot]=m;
        const card=h('<div class="wcard"><div class="wday">'+cnDay(d)+'（'+['一','二','三','四','五','六','日'][i]+'）</div></div>');
        const dayTags=new Set();
        for(const [slot,label] of MEAL_SLOTS){
          const m=bySlot[slot];
          const ds=m?mealDishes(m):[];
          const txt=ds.length?ds.map(d=>{
            const tags=(d.ing||[]).filter(Boolean);
            return d.name+(tags.length?'（'+tags.join('、')+'）':'');
          }).join('、'):'—';
          if(ds.length){
            for(const dd of ds){
              const tags=(dd.ing||[]).filter(Boolean);
              if(tags.length)tags.forEach(t=>dayTags.add(t));
              else if(dd.name)dayTags.add(dd.name);
            }
          }
          card.appendChild(h('<div class="wmeal">'+label+'：'+esc(txt)+'</div>'));
        }
        dayTags.forEach(t=>{if(!items.includes(t))items.push(t);});
        card.appendChild(h('<div class="wcnt">食材 '+dayTags.size+' 种</div>'));
        body.appendChild(card);
      }
      // 本周食材去重清单
      if(items.length){
        const box=h('<div class="wcard"><div class="wday">本周食材清单（去重）</div></div>');
        box.appendChild(h('<div class="wmeal">'+esc(items.join('、'))+'</div>'));
        body.appendChild(box);
      }else{
        body.appendChild(h('<div class="empty">本周还没有饮食记录</div>'));
      }
    }
    await redraw();
    el.querySelector('[data-x=prev]').onclick=()=>{wkStart=addDays(wkStart,-7);redraw();};
    el.querySelector('[data-x=next]').onclick=()=>{wkStart=addDays(wkStart,7);redraw();};
    return el;
  }
};

/* ===== 饮食开销月统计页 ===== */
Pages.foodCost={
  async render(){
    const now=new Date();
    let state={y:now.getFullYear(),m:now.getMonth()};
    const el=h('<div><div class="topbar"><button class="iconbtn" data-act="back">←</button><button class="iconbtn" data-x="prev">‹</button><h1 class="hand">饮食开销</h1><button class="iconbtn" data-x="next">›</button></div><div id="fc-body" style="padding:4px 16px 30px"></div></div>');
    const body=el.querySelector('#fc-body');
    async function redraw(){
      body.innerHTML='';
      const ym=state.y+'-'+String(state.m+1).padStart(2,'0');
      body.appendChild(h('<div class="fmonth">'+state.y+'年'+(state.m+1)+'月</div>'));
      const all=await DB.all('meals');
      const month=all.filter(x=>(x.date||'').indexOf(ym)===0);
      let cost=0,market=0;
      const byDate={};
      for(const m of month){
        for(const d of mealDishes(m)){
          const p=parseFloat(d.price),mk=parseFloat(d.market);
          const hp=!isNaN(p)&&p>0,hm=!isNaN(mk)&&mk>0;
          if(hp)cost+=p;
          if(hm)market+=mk;
          if(hp||hm){
            const rec=byDate[m.date]||(byDate[m.date]={p:0,mk:0});
            if(hp)rec.p+=p;
            if(hm)rec.mk+=mk;
          }
        }
      }
      const head=h('<div class="fchead"><div class="fccard"><div class="fclabel">实际消费（食材价格）</div><div class="fcnum">¥'+cost.toFixed(2)+'</div></div><div class="fccard"><div class="fclabel">节约成本（市场价合计）</div><div class="fcnum">¥'+market.toFixed(2)+'</div></div></div>');
      body.appendChild(head);
      const days=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));
      if(!days.length){body.appendChild(h('<div class="empty">本月还没有价格记录</div>'));return;}
      const box=h('<div class="wcard"><div class="wday">按日明细</div></div>');
      for(const d of days){
        box.appendChild(h('<div class="fcrow"><span>'+cnDay(d)+'</span><span>实际 ¥'+byDate[d].p.toFixed(2)+' · 市场 ¥'+byDate[d].mk.toFixed(2)+'</span></div>'));
      }
      body.appendChild(box);
    }
    await redraw();
    el.querySelector('[data-x=prev]').onclick=()=>{state.m--;if(state.m<0){state.m=11;state.y--;}redraw();};
    el.querySelector('[data-x=next]').onclick=()=>{state.m++;if(state.m>11){state.m=0;state.y++;}redraw();};
    return el;
  }
};

function openGroceryForm(onSaved){ // 记一笔：单价=总价÷数量自动算出，可手动覆盖
  const sheet=h('<div class="sheet"><h3>记一笔食材</h3>'
    +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">食材名称</label><input class="input" id="gr-name" placeholder="如 鸡蛋"></div>'
    +'<div style="display:flex;gap:10px"><div style="flex:1;margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">总价（元）</label><input type="number" step="0.01" min="0" class="input" id="gr-total" placeholder="如 15.8"></div>'
    +'<div style="flex:1;margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">数量</label><input type="number" step="0.01" min="0" class="input" id="gr-qty" placeholder="如 2（斤/盒/袋）"></div></div>'
    +'<div style="display:flex;gap:10px"><div style="flex:1;margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">单价（自动算，可改）</label><input type="number" step="0.01" min="0" class="input" id="gr-price" placeholder="自动计算"></div>'
    +'<div style="flex:1;margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">时间</label><input type="date" class="input" id="gr-date"></div></div>'
    +'<div style="margin:10px 0"><label style="display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px">备注</label><input class="input" id="gr-note" placeholder="选填"></div>'
    +'<div class="row"><button class="btn" data-x="no">取消</button><button class="btn primary" data-x="ok">保存</button></div></div>');
  const m=modal(sheet);
  sheet.querySelector('#gr-date').value=todayKey();
  const tIn=sheet.querySelector('#gr-total'),qIn=sheet.querySelector('#gr-qty'),pIn=sheet.querySelector('#gr-price');
  function autoPrice(){ // 总价÷数量 自动填单价
    const t=parseFloat(tIn.value),q=parseFloat(qIn.value);
    if(!isNaN(t)&&!isNaN(q)&&q>0)pIn.value=(t/q).toFixed(2);
  }
  tIn.addEventListener('input',autoPrice);
  qIn.addEventListener('input',autoPrice);
  sheet.querySelector('[data-x="no"]').onclick=()=>closeModal(m);
  sheet.querySelector('[data-x="ok"]').onclick=async()=>{
    const name=sheet.querySelector('#gr-name').value.trim();
    if(!name){toast('请填写食材名称');return;}
    const rec={id:uid(),name:name,
      total:tIn.value===''?null:parseFloat(tIn.value),
      qty:qIn.value===''?null:parseFloat(qIn.value),
      price:pIn.value===''?null:parseFloat(pIn.value),
      date:sheet.querySelector('#gr-date').value||todayKey(),
      note:sheet.querySelector('#gr-note').value.trim()};
    await DB.put('groceries',rec);
    closeModal(m);
    toast('已记录');
    onSaved&&onSaved();
  };
}

        img.src=Img.url(book.coverId);
        img.onclick=async()=>{const id=await Img.pickFiles({multiple:false});if(id){const blob=await Img.compress(id[0]);book.coverId=await Img.store(blob);await DB.put('books',book);drawCover();}};
        coverbox.appendChild(img);
      }else{
        const placeholder=h('<div style="width:150px;aspect-ratio:3/4;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:40px;box-shadow:var(--shadow);cursor:pointer">📖</div>');
        placeholder.onclick=async()=>{const id=await Img.pickFiles({multiple:false});if(id){const blob=await Img.compress(id[0]);book.coverId=await Img.store(blob);await DB.put('books',book);drawCover();}};
        coverbox.appendChild(placeholder);
      }
    }
    drawCover();
    // 想看/已看状态
    const stBtn=el.querySelector('#bd-status');
    function refreshStatus(){stBtn.textContent=(book.status||'read')==='want'?'🔖 想看 · 点击移入「已看」':'✅ 已看 · 点击移入「想看」';}
    refreshStatus();
    stBtn.onclick=async()=>{
      book.status=(book.status||'read')==='want'?'read':'want';
      await DB.put('books',book);
      refreshStatus();
      toast(book.status==='want'?'已移入「想看」':'已移入「已看」');
    };
    // 星星（.stars 样式：灰色未点亮 / 沙金色点亮）
    const starBox=el.querySelector('#bd-stars');
    function drawStars(){
      starBox.innerHTML='';
      for(let i=1;i<=5;i++){
        const b=h('<button type="button" class="'+(i<=(book.rating||0)?'on':'')+'">★</button>');
        b.onclick=()=>{book.rating=(i===(book.rating||0))?0:i;drawStars();DB.put('books',book);};
        starBox.appendChild(b);
      }
    }
    drawStars();
    // 读后感 autosave
    const ta=el.querySelector('#bd-review');
    ta.value=book.review||'';
    bindAutosave(ta,async v=>{book.review=v;await DB.put('books',book);});
    // 标题编辑
    el.querySelector('#bd-title').style.cursor='pointer';
    el.querySelector('#bd-title').onclick=async()=>{const v=await promptBox('书名',book.title);if(v&&v!==book.title){book.title=v;el.querySelector('#bd-title').textContent=v;await DB.put('books',book);}};
    // 删除
    el.querySelector('#bd-del').onclick=async()=>{
      const y=await confirmBox('删除「'+book.title+'」？',{danger:true});
      if(y){
        if(book.coverId)await DB.del('images',book.coverId);
        await DB.del('books',book.id);
        Router.back();
      }
    };
    return el;
  }
};

/* ===== J15 播种与启动 ===== */
const SEED=[
  {name:'缝纫',kind:'sew',color:'coffee'},
  {name:'饮食',kind:'eat',color:'bean'},
  {name:'运动',kind:'sport',color:'mist'},
  {name:'阅读',kind:'read',color:'sand'},
  {name:'技能',kind:'skill',color:'sage'},
];
async function seedIfEmpty(){
  if(await DB.count('items')>0)return;
  let o=0;
  for(const s of SEED){
    await DB.put('items',{id:uid(),name:s.name,kind:s.kind,color:s.color,order:o++,
      shortGoal:'',longGoal:'',remindOn:false,remindTime:'21:00',builtin:true});
  }
  await DB.setSetting('schemaVersion',1);
}
async function ensureBuiltin(){ // 固定模块自愈：缺失时优先把同名自定义事项升级为固定模块（保留其记录），否则重新补种
  const items=await DB.all('items');
  const max=items.reduce((m,i)=>Math.max(m,i.order),-1);
  let n=max;
  for(const s of SEED){
    const cands=items.filter(it=>(it.kind==='custom'?(it.specKind||'none'):it.kind)===s.kind);
    if(cands.some(it=>it.builtin))continue;
    const up=cands.find(it=>(it.name||'').trim()===s.name);
    if(up){
      delete up.specKind;up.kind=s.kind;up.builtin=true;up.updatedAt=Date.now();
      await DB.put('items',up);
    }else{
      await DB.put('items',{id:uid(),name:s.name,kind:s.kind,color:s.color,order:++n,shortGoal:'',longGoal:'',remindOn:false,remindTime:'21:00',builtin:true});
    }
  }
}
(async function boot(){
  try{await DB.open();}
  catch(e){
    document.body.innerHTML='<div style="padding:40px 24px;text-align:center">浏览器本地存储（IndexedDB）不可用，无法运行。<br>请使用 Chrome / Edge 浏览器打开本文件。</div>';
    return;
  }
  await seedIfEmpty();
  await ensureBuiltin();
  Router.start();
})();

/* ===== J16 提醒调度器 ===== */
const __lastFired={}; // itemId -> dateString（今日已触发过）
(async function startReminder(){
  try{
    const items=await DB.all('items');
    let notifSupported=('Notification' in window);
    if(notifSupported&&Notification.permission==='default'){
      try{await Notification.requestPermission();}catch(e){}
    }
    setInterval(async()=>{
      try{
        const now=nowHM();
        const today=todayKey();
        const its=await DB.all('items');
        for(const it of its){
          if(!it.remindOn||!it.remindTime)continue;
          if(it.remindTime!==now)continue;
          if(__lastFired[it.id]===today)continue; // 今天已经触发过
          __lastFired[it.id]=today;
          // 触发提醒
          const msg='该打卡了：'+it.name;
          if(notifSupported&&Notification.permission==='granted'){
            try{new Notification('生活手帐',{body:msg});}catch(e){toast(msg);}
          }else{
            toast(msg);
          }
        }
      }catch(e){}
    },30000); // 每30秒检查一次
  }catch(e){}
})();
